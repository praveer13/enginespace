<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 268" width="360" height="268" fill="none" stroke="currentColor" stroke-width="1">
  <title>One step of the loop with a grammar mask: whether its fill hides under the forward</title>
  <desc>Four timelines of one step of the loop, each a CPU lane above a GPU lane on the same scale in microseconds. The CPU plans a step, fills the grammar's bitmask, and reads the result back, and the GPU runs the forward. When the fill is overlapped and light, it sits under the forward, and the GPU idles 160 microseconds between forwards, as it would with no grammar. When the fill is overlapped and heavy, it outlasts the forward, and the GPU idles 380 microseconds. When the fill comes after the forward, none of it hides, and the GPU idles 400 microseconds. With async scheduling the CPU runs a step ahead and the light fill hides, so the GPU idles 0 microseconds.</desc>
  <g>
    <rect x="30" y="3" width="10" height="8"/>
    <rect x="92" y="3" width="10" height="8" stroke-dasharray="2 1.5"/>
    <rect x="154" y="3" width="10" height="8" fill="currentColor" fill-opacity="0.45"/>
    <rect x="216" y="3" width="10" height="8" fill="currentColor" fill-opacity="0.18"/>
  </g>
  <g stroke="none" fill="currentColor" font-size="8">
    <text x="44" y="10">plan</text>
    <text x="106" y="10">read</text>
    <text x="168" y="10">fill</text>
    <text x="230" y="10">forward</text>
  </g>
  <g>
    <rect x="30" y="30" width="18" height="11"/>
    <rect x="48" y="30" width="43.2" height="11" fill="currentColor" fill-opacity="0.45"/>
    <rect x="138" y="30" width="10.8" height="11" stroke-dasharray="2 1.5"/>
    <rect x="148.8" y="30" width="18" height="11"/>
    <rect x="166.8" y="30" width="43.2" height="11" fill="currentColor" fill-opacity="0.45"/>
    <rect x="256.8" y="30" width="10.8" height="11" stroke-dasharray="2 1.5"/>
    <rect x="48" y="44" width="90" height="11" fill="currentColor" fill-opacity="0.18"/>
    <rect x="166.8" y="44" width="90" height="11" fill="currentColor" fill-opacity="0.18"/>
    <path d="M138 57V60H166.8V57" stroke-width="0.75"/>
  </g>
  <g stroke="none" fill="currentColor" font-size="8">
    <text x="2" y="25" font-size="9">Overlapped, light grammar: the fill hides under the forward</text>
    <text x="2" y="38">CPU</text>
    <text x="2" y="52">GPU</text>
    <text x="69.6" y="38">fill</text>
    <text x="188.4" y="38">fill</text>
    <text x="93" y="52">forward</text>
    <text x="211.8" y="52">forward</text>
    <text x="152.4" y="69" text-anchor="middle">GPU idle 160 µs</text>
  </g>
  <g>
    <rect x="30" y="86" width="18" height="11"/>
    <rect x="48" y="86" width="129.6" height="11" fill="currentColor" fill-opacity="0.45"/>
    <rect x="177.6" y="86" width="10.8" height="11" stroke-dasharray="2 1.5"/>
    <rect x="188.4" y="86" width="18" height="11"/>
    <rect x="206.4" y="86" width="129.6" height="11" fill="currentColor" fill-opacity="0.45"/>
    <rect x="336" y="86" width="10.8" height="11" stroke-dasharray="2 1.5"/>
    <rect x="48" y="100" width="90" height="11" fill="currentColor" fill-opacity="0.18"/>
    <rect x="206.4" y="100" width="90" height="11" fill="currentColor" fill-opacity="0.18"/>
    <path d="M138 113V116H206.4V113" stroke-width="0.75"/>
  </g>
  <g stroke="none" fill="currentColor" font-size="8">
    <text x="2" y="81" font-size="9">Overlapped, heavy grammar: the fill outlasts the forward</text>
    <text x="2" y="94">CPU</text>
    <text x="2" y="108">GPU</text>
    <text x="112.8" y="94">fill</text>
    <text x="271.2" y="94">fill</text>
    <text x="93" y="108">forward</text>
    <text x="251.4" y="108">forward</text>
    <text x="172.2" y="125" text-anchor="middle">GPU idle 380 µs</text>
  </g>
  <g>
    <rect x="30" y="142" width="18" height="11"/>
    <rect x="138" y="142" width="10.8" height="11" stroke-dasharray="2 1.5"/>
    <rect x="148.8" y="142" width="43.2" height="11" fill="currentColor" fill-opacity="0.45"/>
    <rect x="192" y="142" width="18" height="11"/>
    <rect x="300" y="142" width="10.8" height="11" stroke-dasharray="2 1.5"/>
    <rect x="310.8" y="142" width="43.2" height="11" fill="currentColor" fill-opacity="0.45"/>
    <rect x="48" y="156" width="90" height="11" fill="currentColor" fill-opacity="0.18"/>
    <rect x="210" y="156" width="90" height="11" fill="currentColor" fill-opacity="0.18"/>
    <path d="M138 169V172H210V169" stroke-width="0.75"/>
  </g>
  <g stroke="none" fill="currentColor" font-size="8">
    <text x="2" y="137" font-size="9">Serial, light grammar: the fill comes after the forward</text>
    <text x="2" y="150">CPU</text>
    <text x="2" y="164">GPU</text>
    <text x="170.4" y="150">fill</text>
    <text x="332.4" y="150">fill</text>
    <text x="93" y="164">forward</text>
    <text x="255" y="164">forward</text>
    <text x="174" y="181" text-anchor="middle">GPU idle 400 µs</text>
  </g>
  <g>
    <rect x="30" y="198" width="18" height="11"/>
    <rect x="76.8" y="198" width="43.2" height="11" fill="currentColor" fill-opacity="0.45"/>
    <rect x="120" y="198" width="18" height="11"/>
    <rect x="156" y="198" width="10.8" height="11" stroke-dasharray="2 1.5"/>
    <rect x="166.8" y="198" width="43.2" height="11" fill="currentColor" fill-opacity="0.45"/>
    <rect x="246" y="198" width="10.8" height="11" stroke-dasharray="2 1.5"/>
    <rect x="66" y="212" width="90" height="11" fill="currentColor" fill-opacity="0.18"/>
    <rect x="156" y="212" width="90" height="11" fill="currentColor" fill-opacity="0.18"/>
  </g>
  <g stroke="none" fill="currentColor" font-size="8">
    <text x="2" y="193" font-size="9">Async scheduling, light grammar: the CPU runs a step ahead</text>
    <text x="2" y="206">CPU</text>
    <text x="2" y="220">GPU</text>
    <text x="98.4" y="206">fill</text>
    <text x="188.4" y="206">fill</text>
    <text x="111" y="220">forward</text>
    <text x="201" y="220">forward</text>
    <text x="156" y="237" text-anchor="middle">GPU idle 0 µs</text>
  </g>
  <g stroke-width="0.75">
    <path d="M30 244H354"/>
    <path d="M30 244V248M120 244V248M210 244V248M300 244V248"/>
  </g>
  <g stroke="none" fill="currentColor" font-size="8">
    <text x="30" y="257" text-anchor="middle">0</text>
    <text x="120" y="257" text-anchor="middle">500</text>
    <text x="210" y="257" text-anchor="middle">1,000</text>
    <text x="300" y="257" text-anchor="middle">1,500</text>
    <text x="354" y="266" text-anchor="end">µs from the start of the step's plan</text>
  </g>
</svg>
