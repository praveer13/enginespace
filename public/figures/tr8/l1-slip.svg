<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 152" width="360" height="152" fill="none" stroke="currentColor" stroke-width="1.5">
  <title>Eight requests, when each was due and when each was sent, with the client blocked on the third reply</title>
  <desc>Two timelines on one time axis. The top one marks when each of eight requests was due, evenly spaced. The bottom one marks when the client sent each, and how long each took. The third request takes most of the width, and the four after it are sent one after another at the end, each joined by a line back to its due tick.</desc>
  <g stroke="none" fill="currentColor" font-size="10">
    <text x="24" y="12">due</text>
    <text x="24" y="66">sent, and the time each took</text>
  </g>
  <g stroke-width="1">
    <path d="M16 44H348"/>
    <path d="M24 28V44M68 28V44M112 28V44M156 28V44M200 28V44M244 28V44M288 28V44M332 28V44"/>
  </g>
  <g stroke="none" fill="currentColor" font-size="10" text-anchor="middle">
    <text x="24" y="24">1</text>
    <text x="68" y="24">2</text>
    <text x="112" y="24">3</text>
    <text x="156" y="24">4</text>
    <text x="200" y="24">5</text>
    <text x="244" y="24">6</text>
    <text x="288" y="24">7</text>
    <text x="332" y="24">8</text>
  </g>
  <g stroke-width="1" stroke-dasharray="3 3">
    <path d="M156 44L296.8 88M200 44L305.6 88M244 44L314.4 88M288 44L323.2 88"/>
  </g>
  <g stroke-width="1">
    <path d="M24 88V96M68 88V96M112 88V96M296.8 88V96M305.6 88V96M314.4 88V96M323.2 88V96M332 88V96"/>
  </g>
  <g fill="currentColor" stroke="none">
    <rect x="24" y="96" width="8.8" height="8"/>
    <rect x="68" y="96" width="8.8" height="8"/>
    <rect x="112" y="96" width="184.8" height="8"/>
    <rect x="296.8" y="96" width="8.8" height="8"/>
    <rect x="305.6" y="96" width="8.8" height="8"/>
    <rect x="314.4" y="96" width="8.8" height="8"/>
    <rect x="323.2" y="96" width="8.8" height="8"/>
    <rect x="332" y="96" width="8.8" height="8"/>
  </g>
  <g stroke="none" fill="currentColor" font-size="10" text-anchor="middle">
    <text x="28" y="118">1</text>
    <text x="72" y="118">2</text>
    <text x="204" y="118">3</text>
    <text x="301" y="118">4</text>
    <text x="310" y="118">5</text>
    <text x="319" y="118">6</text>
    <text x="328" y="118">7</text>
    <text x="337" y="118">8</text>
  </g>
  <g stroke-width="1">
    <path d="M112 126V132H296.8V126"/>
  </g>
  <g stroke="none" fill="currentColor" font-size="10" text-anchor="middle">
    <text x="204" y="146">the client is blocked on the third reply</text>
  </g>
</svg>
