    <text x="4" y="45">full</text>
    <text x="4" y="73">sliding</text>
    <text x="4" y="101">sliding</text>
    <text x="4" y="144">B: the first has a gap in its run</text>
    <text x="4" y="175">full</text>
    <text x="4" y="203">sliding</text>
    <text x="4" y="231">sliding</text>
  </g>
