    <text x="22" y="13">block</text>
    <text x="70" y="13">0</text>
    <text x="112" y="13">1</text>
    <text x="154" y="13">2</text>
    <text x="196" y="13">3</text>
    <text x="238" y="13">4</text>
    <text x="280" y="13">5</text>
    <text x="322" y="13">6</text>
  </g>
  <g stroke="none" fill="currentColor" font-size="10">
    <text x="4" y="39">full</text>
    <text x="4" y="77">sliding</text>
    <text x="4" y="115">sliding</text>
  </g>
  <g fill="currentColor" fill-opacity="0.16">
