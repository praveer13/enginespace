    <rect x="94" y="60" width="36" height="26"/>
    <rect x="136" y="60" width="36" height="26"/>
    <rect x="178" y="60" width="36" height="26"/>
    <rect x="220" y="60" width="36" height="26"/>
    <rect x="52" y="98" width="36" height="26"/>
