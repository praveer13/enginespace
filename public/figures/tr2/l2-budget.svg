<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" width="360" height="230">
  <title>The token budget of two steps: the running requests first, then the prompt's chunk</title>
  <desc>Two bars, one for each of the two steps that carry the prompt of 3,000 tokens, each as long as the budget of 2,048 tokens. In each the first segment, narrow, is the 100 running requests' one token each. In the first step the rest of the budget is the prompt's first chunk, 1,948 tokens. In the second step the prompt's remaining 1,052 tokens follow the decodes and 896 tokens of the budget are left, drawn as a dashed box.</desc>
