    <rect x="139.30" y="16" width="9.28" height="18"/>
    <rect x="240.95" y="16" width="1.03" height="18"/>
    <rect x="241.98" y="16" width="9.28" height="18"/>
    <rect x="343.69" y="16" width="1.03" height="18"/>
    <rect x="344.72" y="16" width="9.28" height="18"/>
  </g>
  <g fill="currentColor" fill-opacity="0.55">
    <rect x="75.09" y="44" width="63.18" height="18"/>
    <rect x="177.67" y="44" width="63.28" height="18"/>
    <rect x="280.35" y="44" width="63.33" height="18"/>
  </g>
  <g stroke-dasharray="3 3">
    <rect x="138.27" y="44" width="39.40" height="18"/>
    <rect x="240.95" y="44" width="39.40" height="18"/>
  </g>
  <g fill="currentColor" fill-opacity="0.14">
