<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 170" width="360" height="170" fill="none" stroke="currentColor" stroke-width="1">
  <title>Three engine steps with async scheduling off and on, drawn to one scale</title>
  <desc>Two pairs of lanes, one pair for async scheduling off and one for on, with three steps in each. With it off, the GPU lane has an empty stretch, drawn dashed, between every two forwards, 764 and 764 microseconds, because the next step's schedule, prepare and launch wait for the last step to be read. With it on, the CPU lane writes each step's schedule, prepare and launch while the previous forward runs, the forwards follow one another with gaps of 0 and 0 microseconds, and the three steps end sooner.</desc>
  <g stroke="none" fill="currentColor" font-size="9">
    <text x="4" y="12">async scheduling off</text>
    <text x="4" y="29">CPU</text>
    <text x="4" y="57">GPU</text>
    <text x="4" y="94">async scheduling on</text>
    <text x="4" y="111">CPU</text>
    <text x="4" y="139">GPU</text>
  </g>
  <g fill="currentColor" fill-opacity="0.14">
    <rect x="46.00" y="16" width="26.30" height="18"/>
    <rect x="72.30" y="16" width="1.24" height="18"/>
    <rect x="73.54" y="16" width="1.55" height="18"/>
