<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 124" width="360" height="124" fill="none" stroke="currentColor" stroke-width="1">
  <title>Rows padded and wasted by a decode batch of 1 to 40 rows under vLLM's default capture sizes</title>
  <desc>A bar for each batch size from 1 to 40 rows, as tall as the rows that the batch is padded by, up to 7. The bar is nothing at each captured size, 1, 2, 4, 8, 16, 24, 32 and 40, and grows by one row for each row the batch has over the last captured size, until the next size is reached. The bars run in a sawtooth that is tallest just above a size that sits far above the last, as at 9 rows and 17.</desc>
