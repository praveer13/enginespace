<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 226" width="360" height="226">
  <title>The CPU's launch work for one step of the small model, launched kernel by kernel, in pieces, and as one graph, to one scale</title>
  <desc>Three rows on one time scale. The first has 28 teeth, one for each layer, each the 12 launches of that layer, 336 calls and 2,016 microseconds in all. The second is 29 short boxes for the replays of the pieces with a thin launch between them for each layer's attention, 57 calls and 1,038 microseconds. The third is one box, a single replay, 30 microseconds.</desc>
