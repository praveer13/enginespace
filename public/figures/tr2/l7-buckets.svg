<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 146" width="360" height="146" fill="none" stroke="currentColor" stroke-width="1">
  <title>Rows wasted by a decode batch of 1 to 24 rows under vLLM's list and under SGLang's, drawn to one scale</title>
  <desc>Two rows of bars, one bar for each batch size from 1 to 24 rows, as tall as the rows the batch is padded by. The top row is vLLM's default list of sizes and the bottom row SGLang's decode buckets. They differ only for the batches of 9 to 12 rows, which vLLM pads to 16 and SGLang to 12, because SGLang has a bucket at 12 and vLLM has none.</desc>
