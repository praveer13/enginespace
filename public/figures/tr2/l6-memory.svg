  <g class="span" data-slot="blue"><rect x="6" y="42" width="46.4" height="22" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="14" cy="53" r="3.5" fill="#fafaf6"/></g></g>
