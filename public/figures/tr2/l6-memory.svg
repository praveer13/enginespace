<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 252" width="360" height="252">
  <title>How the memory of a 24 GB card is divided, with the CUDA graphs ignored and with their estimate taken off before the KV cache is sized</title>
  <desc>Two bars, each the whole card. In both, the weights and the activations come first, 3.2 GB together, and the last 1.9 GB are not requested, drawn dashed. In the first bar the rest, 18.9 GB, is the KV cache. In the second the graphs' estimate, 1.0 GB, is a box before the cache, and the KV cache is 17.9 GB.</desc>
  <defs><pattern id="code-yellow" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#685000" stroke-width="1.5" stroke-opacity="0.7"/></pattern></defs>
  <rect width="360" height="252" fill="#fafaf6"/>
  <g class="graticule" fill="none" stroke="#c2c8bd"><path d="M6 38v30M14 38v30M22 38v30M30 38v30M38 38v30M46 38v30M54 38v30M62 38v30M70 38v30M78 38v30M86 38v30M94 38v30M102 38v30M110 38v30M118 38v30M126 38v30M134 38v30M142 38v30M150 38v30M158 38v30M166 38v30M174 38v30M182 38v30M190 38v30M198 38v30M206 38v30M214 38v30M222 38v30M230 38v30M238 38v30M246 38v30M254 38v30M262 38v30M270 38v30M278 38v30M286 38v30M294 38v30M302 38v30M310 38v30M318 38v30M326 38v30M334 38v30M342 38v30M350 38v30M6 38h348M6 46h348M6 54h348M6 62h348" stroke-width="0.5" stroke-opacity="0.55"/><path d="M6 38v30M46 38v30M86 38v30M126 38v30M166 38v30M206 38v30M246 38v30M286 38v30M326 38v30M6 38h348" stroke-width="0.75"/></g>
