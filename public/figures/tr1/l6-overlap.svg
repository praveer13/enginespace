  <g class="glyph" data-slot="blue"><circle cx="12" cy="184" r="3.5" fill="#fafaf6"/></g>
  <text x="24" y="188" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">host work</text>
