  <g class="box" data-slot="green"><rect x="164" y="92" width="90" height="24" fill="#237a37" stroke="#185e2c" stroke-width="1"/><g class="glyph" data-slot="green"><polygon points="168.5,104 170.25,100.95 173.75,100.95 175.5,104 173.75,107.05 170.25,107.05" fill="#fafaf6"/></g><text x="217" y="107.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">forward 2</text></g>
  <g class="box" data-slot="green"><rect x="254" y="92" width="90" height="24" fill="#237a37" stroke="#185e2c" stroke-width="1"/><g class="glyph" data-slot="green"><polygon points="258.5,104 260.25,100.95 263.75,100.95 265.5,104 263.75,107.05 260.25,107.05" fill="#fafaf6"/></g><text x="307" y="107.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">forward 3</text></g>
  <text x="34" y="22" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">turn 1</text>
  <text x="74" y="22" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">turn 2</text>
  <text x="186" y="22" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">turn 3</text>
  <path class="arrow" d="M65 52L65 90M67.61 84.6L65 90L62.39 84.6" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <path class="arrow" d="M105 52L105 90M107.61 84.6L105 90L102.39 84.6" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <path class="arrow" d="M217 52L217 90M219.61 84.6L217 90L214.39 84.6" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <text x="111" y="84" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">queued</text>
  <text x="4" y="150" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">S schedule, L launch, W wait for the copy, P process</text>
  <text x="4" y="166" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">the number is the batch; a sketch, not to scale</text>
