<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 152" width="360" height="152" fill="none" stroke="currentColor" stroke-width="1.5">
  <title>SGLang's overlap loop: the host launches the next batch before it reads the last one</title>
  <desc>Two lanes against time, the host above and the GPU below, in three turns of the loop. In each turn the host lane has a schedule block and a launch block, and from the second turn on a dashed wait block and a process block for the batch before. The GPU lane has three forward blocks end to end with no gap. An arrow runs from each launch block to the start of its forward, and the arrow from the second launch is labelled queued, because the first forward is still running. Each wait block ends where the forward it waits for ends. The copy back to the host is not drawn, and nothing is to scale.</desc>
  <rect x="34" y="24" width="22" height="24"/>
  <rect x="56" y="24" width="18" height="24"/>
  <rect x="74" y="24" width="22" height="24"/>
  <rect x="96" y="24" width="18" height="24"/>
  <rect x="114" y="24" width="50" height="24" stroke-dasharray="4 3"/>
  <rect x="164" y="24" width="22" height="24"/>
  <rect x="186" y="24" width="22" height="24"/>
  <rect x="208" y="24" width="18" height="24"/>
  <rect x="226" y="24" width="28" height="24" stroke-dasharray="4 3"/>
  <rect x="254" y="24" width="22" height="24"/>
  <rect x="74" y="86" width="90" height="24"/>
  <rect x="164" y="86" width="90" height="24"/>
  <rect x="254" y="86" width="90" height="24"/>
  <g stroke="none" fill="currentColor" font-size="10" text-anchor="middle">
    <text x="45" y="40">S1</text>
    <text x="65" y="40">L1</text>
    <text x="85" y="40">S2</text>
    <text x="105" y="40">L2</text>
    <text x="139" y="40">W1</text>
    <text x="175" y="40">P1</text>
    <text x="197" y="40">S3</text>
    <text x="217" y="40">L3</text>
    <text x="240" y="40">W2</text>
    <text x="265" y="40">P2</text>
    <text x="119" y="102">forward 1</text>
    <text x="209" y="102">forward 2</text>
    <text x="299" y="102">forward 3</text>
    <text x="180" y="132">S schedule, L launch, W wait for the copy, P process</text>
    <text x="180" y="148">the number is the batch; a sketch, not to scale</text>
  </g>
  <g stroke="none" fill="currentColor" font-size="10">
    <text x="4" y="40">host</text>
    <text x="4" y="102">GPU</text>
  </g>
  <g stroke="none" fill="currentColor" font-size="9">
    <text x="34" y="18">turn 1</text>
    <text x="74" y="18">turn 2</text>
    <text x="186" y="18">turn 3</text>
    <text x="112" y="79">queued</text>
  </g>
  <path d="M65 48V66H74V84M70 79L74 84L78 79"/>
  <path d="M105 48V66H164V84M160 79L164 84L168 79"/>
  <path d="M217 48V66H254V84M250 79L254 84L258 79"/>
</svg>
