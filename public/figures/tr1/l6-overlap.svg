<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 198" width="360" height="198">
  <title>SGLang's overlap loop: the host launches the next batch before it reads the last one</title>
  <desc>Two lanes against time, the host above and the GPU below, in three turns of the loop. In each turn the host lane has a schedule block and a launch block, and from the second turn on a dashed wait block and a process block for the batch before. The GPU lane has three forward blocks end to end with no gap. An arrow runs from each launch block to the start of its forward, and the arrow from the second launch is labelled queued, because the first forward is still running. Each wait block ends where the forward it waits for ends. The copy back to the host is not drawn, and nothing is to scale.</desc>
  <defs><pattern id="code-yellow" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#685000" stroke-width="1.5" stroke-opacity="0.7"/></pattern></defs>
  <rect width="360" height="198" fill="#fafaf6"/>
  <text x="4" y="44" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">host</text>
  <text x="4" y="108" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">GPU</text>
  <g class="box" data-slot="blue"><rect x="34" y="28" width="22" height="24" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><text x="45" y="43.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">S1</text></g>
  <g class="box" data-slot="blue"><rect x="56" y="28" width="18" height="24" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><text x="65" y="43.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">L1</text></g>
  <g class="box" data-slot="blue"><rect x="74" y="28" width="22" height="24" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><text x="85" y="43.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">S2</text></g>
  <g class="box" data-slot="blue"><rect x="96" y="28" width="18" height="24" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><text x="105" y="43.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">L2</text></g>
  <g class="box" data-slot="yellow"><rect x="114" y="28" width="50" height="24" fill="#f5c400" stroke="#685000" stroke-width="1"/><rect x="114" y="28" width="50" height="24" fill="url(#code-yellow)" stroke="none"/><text x="139" y="43.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#1d1b22" text-anchor="middle" stroke="#f5c400" stroke-width="3" paint-order="stroke" stroke-linejoin="round">W1</text></g>
  <g class="box" data-slot="blue"><rect x="164" y="28" width="22" height="24" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><text x="175" y="43.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">P1</text></g>
  <g class="box" data-slot="blue"><rect x="186" y="28" width="22" height="24" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><text x="197" y="43.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">S3</text></g>
  <g class="box" data-slot="blue"><rect x="208" y="28" width="18" height="24" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><text x="217" y="43.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">L3</text></g>
  <g class="box" data-slot="yellow"><rect x="226" y="28" width="28" height="24" fill="#f5c400" stroke="#685000" stroke-width="1"/><rect x="226" y="28" width="28" height="24" fill="url(#code-yellow)" stroke="none"/><text x="240" y="43.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#1d1b22" text-anchor="middle" stroke="#f5c400" stroke-width="3" paint-order="stroke" stroke-linejoin="round">W2</text></g>
