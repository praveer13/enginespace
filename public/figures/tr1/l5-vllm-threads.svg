<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 218" width="360" height="218">
  <title>vLLM's API server and engine core, with their tasks, threads, sockets and queues</title>
  <desc>Two large boxes side by side. The API server on the left holds three asyncio tasks, a handler task above an output handler task above a socket task, joined upward by the outputs queue and the collector. The engine core on the right holds an input thread, a main thread and an output thread, joined downward by input_queue and output_queue, with a GPU box beside the main thread. A ZMQ arrow runs from the handler task to the input thread, and another from the output thread to the socket task. A caption notes that the busy loop also keeps batch_queue and aborts_queue.</desc>
  <rect width="360" height="218" fill="#fafaf6"/>
  <path d="M4 18h156v118h-156Z" fill="none" stroke="#5f666d" stroke-width="1"/>
  <path d="M186 18h170v118h-170Z" fill="none" stroke="#5f666d" stroke-width="1"/>
  <text x="82" y="12" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">API server</text>
  <text x="271" y="12" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">engine core</text>
  <g class="box" data-slot="blue"><rect x="10" y="28" width="144" height="22" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="18" cy="39" r="3.5" fill="#fafaf6"/></g><text x="90" y="42.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">handler task</text></g>
  <g class="box" data-slot="blue"><rect x="10" y="66" width="144" height="22" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="18" cy="77" r="3.5" fill="#fafaf6"/></g><text x="90" y="80.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">output handler task</text></g>
  <g class="box" data-slot="blue"><rect x="10" y="108" width="144" height="22" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="18" cy="119" r="3.5" fill="#fafaf6"/></g><text x="90" y="122.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">socket task</text></g>
  <g class="box" data-slot="blue"><rect x="192" y="28" width="104" height="22" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="200" cy="39" r="3.5" fill="#fafaf6"/></g><text x="252" y="42.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">input thread</text></g>
  <g class="box" data-slot="blue"><rect x="192" y="66" width="104" height="22" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="200" cy="77" r="3.5" fill="#fafaf6"/></g><text x="252" y="80.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">main thread</text></g>
  <g class="box" data-slot="blue"><rect x="192" y="108" width="104" height="22" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="200" cy="119" r="3.5" fill="#fafaf6"/></g><text x="252" y="122.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">output thread</text></g>
  <g class="box" data-slot="green"><rect x="310" y="66" width="40" height="22" fill="#237a37" stroke="#185e2c" stroke-width="1"/><text x="330" y="80.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">GPU</text></g>
  <path class="arrow" d="M154 39L190 39M184.6 36.39L190 39L184.6 41.61" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <path class="arrow" d="M192 119L156 119M161.4 121.61L156 119L161.4 116.39" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <text x="172" y="32" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">ZMQ</text>
  <text x="174" y="113" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">ZMQ</text>
  <path class="arrow" d="M40 66L40 52M37.39 57.4L40 52L42.61 57.4" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <path class="arrow" d="M40 108L40 90M37.39 95.4L40 90L42.61 95.4" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <text x="48" y="62" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">collector</text>
  <text x="48" y="102" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">outputs_queue</text>
  <path class="arrow" d="M210 50L210 64M212.61 58.6L210 64L207.39 58.6" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <path class="arrow" d="M210 90L210 106M212.61 100.6L210 106L207.39 100.6" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <text x="218" y="62" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">input_queue</text>
  <text x="218" y="102" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">output_queue</text>
  <path class="arrow" d="M296 74L308 74M302.6 71.39L308 74L302.6 76.61" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <path class="arrow" d="M308 80L296 80M301.4 82.61L296 80L301.4 77.39" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <text x="180" y="154" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">ROUTER to DEALER on the way in, PUSH to PULL on the way out</text>
  <text x="180" y="170" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">the busy loop also keeps batch_queue and aborts_queue</text>
  <text x="180" y="186" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">asyncio tasks on the left, threads on the right</text>
  <g class="key" data-slot="blue"><rect x="4" y="198" width="16" height="12" fill="#1b5faa" stroke="#18509a" stroke-width="1"/></g>
  <g class="glyph" data-slot="blue"><circle cx="12" cy="204" r="3.5" fill="#fafaf6"/></g>
  <text x="24" y="208" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">task or thread</text>
  <g class="key" data-slot="green"><rect x="120" y="198" width="16" height="12" fill="#237a37" stroke="#185e2c" stroke-width="1"/></g>
  <g class="glyph" data-slot="green"><polygon points="124.5,204 126.25,200.96 129.75,200.96 131.5,204 129.75,207.04 126.25,207.04" fill="#fafaf6"/></g>
  <text x="140" y="208" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">GPU</text>
</svg>
