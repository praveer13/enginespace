<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 186" width="360" height="186">
  <title>A request crossing a thread boundary, a process boundary, the host-to-GPU boundary and back, with a sync before the read</title>
  <desc>Three host threads in a row. Thread A hands the request to thread B through a queue, and thread B hands it to thread C in another process over IPC. A dashed line marks the process boundary between B and C. Thread C copies the request down to a GPU box, where a launch runs the work, and a second arrow copies the result back up. A bar across the upward arrow, marked sync, is the gate: nothing on the host reads the result before it.</desc>
  <defs><pattern id="code-yellow" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V6" stroke="#685000" stroke-width="1.5" stroke-opacity="0.7"/></pattern><pattern id="code-brown" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#fafaf6" fill-opacity="0.6"/></pattern></defs>
  <rect width="360" height="186" fill="#fafaf6"/>
  <text x="98" y="12" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">process 1</text>
  <text x="266" y="12" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">process 2</text>
  <path d="M214 2V142" fill="none" stroke="#5f666d" stroke-width="1" stroke-dasharray="4 3"/>
  <g class="box" data-slot="blue"><rect x="8" y="22" width="68" height="30" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="16" cy="37" r="3.5" fill="#fafaf6"/></g><text x="50" y="40.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">thread A</text></g>
  <g class="box" data-slot="blue"><rect x="120" y="22" width="68" height="30" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="128" cy="37" r="3.5" fill="#fafaf6"/></g><text x="162" y="40.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">thread B</text></g>
  <g class="box" data-slot="blue"><rect x="232" y="22" width="68" height="30" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="240" cy="37" r="3.5" fill="#fafaf6"/></g><text x="274" y="40.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">thread C</text></g>
  <path class="arrow" d="M76 37L118 37M112.6 34.39L118 37L112.6 39.61" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <path class="arrow" d="M188 37L230 37M224.6 34.39L230 37L224.6 39.61" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <text x="98" y="31" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">queue</text>
  <text x="201" y="31" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">IPC</text>
  <g class="box" data-slot="green"><rect x="224" y="98" width="84" height="32" fill="#237a37" stroke="#185e2c" stroke-width="1"/><g class="glyph" data-slot="green"><polygon points="228.5,114 230.25,110.95 233.75,110.95 235.5,114 233.75,117.05 230.25,117.05" fill="#fafaf6"/></g><text x="274" y="117.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">GPU launch</text></g>
  <path class="arrow" d="M250 54L250 96M252.61 90.6L250 96L247.39 90.6" fill="none" stroke="#5a361b" stroke-width="1.25"/>
  <path class="arrow" d="M290 96L290 56M287.39 61.4L290 56L292.61 61.4" fill="none" stroke="#5a361b" stroke-width="1.25"/>
  <g class="gate" data-slot="yellow"><rect x="280" y="72" width="20" height="8" fill="#f5c400" stroke="#685000" stroke-width="1"/><rect x="280" y="72" width="20" height="8" fill="url(#code-yellow)" stroke="none"/></g>
  <text x="244" y="70" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="end" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">copy down</text>
  <text x="298" y="62" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">copy up</text>
  <text x="304" y="82" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">sync</text>
  <text x="8" y="156" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">the gate: no read before the sync</text>
  <g class="key" data-slot="blue"><rect x="4" y="166" width="16" height="12" fill="#1b5faa" stroke="#18509a" stroke-width="1"/></g>
  <g class="glyph" data-slot="blue"><circle cx="12" cy="172" r="3.5" fill="#fafaf6"/></g>
  <text x="24" y="176" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">thread</text>
  <g class="key" data-slot="green"><rect x="72" y="166" width="16" height="12" fill="#237a37" stroke="#185e2c" stroke-width="1"/></g>
  <g class="glyph" data-slot="green"><polygon points="76.5,172 78.25,168.96 81.75,168.96 83.5,172 81.75,175.04 78.25,175.04" fill="#fafaf6"/></g>
  <text x="92" y="176" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">GPU</text>
  <g class="key" data-slot="brown"><rect x="122" y="166" width="16" height="12" fill="#7b4a26" stroke="#5a361b" stroke-width="1"/><rect x="122" y="166" width="16" height="12" fill="url(#code-brown)" stroke="none"/></g>
  <g class="glyph" data-slot="brown"><rect x="127" y="169" width="6" height="6" fill="#fafaf6"/></g>
  <text x="142" y="176" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">copy</text>
  <g class="key" data-slot="yellow"><rect x="178" y="166" width="16" height="12" fill="#f5c400" stroke="#685000" stroke-width="1"/><rect x="178" y="166" width="16" height="12" fill="url(#code-yellow)" stroke="none"/></g>
  <g class="glyph" data-slot="yellow"><polygon points="186,168 190,172 186,176 182,172" fill="#685000"/></g>
  <text x="198" y="176" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">sync</text>
</svg>
