<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 212" width="360" height="212">
  <title>Mini-SGLang's processes and the sockets between them</title>
  <desc>Four boxes in a row: the client, the API server, a box for the tokenizer and the detokenizer, and a scheduler. Between each pair, one arrow runs to the right on the way in and one runs to the left on the way out. The client and the API server are joined by HTTP in and a server-sent event stream out, and the other pairs by ZeroMQ. The tokenizer and the detokenizer share one dashed box, because by default they are one process. Under the scheduler, a GPU box has an arrow down for the copy of the step's inputs and an arrow up for the copy of the sampled tokens.</desc>
  <defs><pattern id="code-brown" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#fafaf6" fill-opacity="0.6"/></pattern></defs>
  <rect width="360" height="212" fill="#fafaf6"/>
  <g class="box" data-slot="blue"><rect x="4" y="30" width="60" height="42" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="12" cy="51" r="3.5" fill="#fafaf6"/></g><text x="42" y="54.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">client</text></g>
  <g class="box" data-slot="blue"><rect x="84" y="30" width="60" height="42" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="92" cy="51" r="3.5" fill="#fafaf6"/></g><text x="122" y="48.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">API</text><text x="122" y="60.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">server</text></g>
  <g class="box" data-slot="blue"><rect x="164" y="30" width="92" height="42" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="172" cy="51" r="3.5" fill="#fafaf6"/></g><text x="218" y="48.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">tokenizer</text><text x="218" y="60.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">detokenizer</text></g>
  <g class="box" data-slot="blue"><rect x="276" y="30" width="80" height="42" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="284" cy="51" r="3.5" fill="#fafaf6"/></g><text x="324" y="48.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">scheduler</text><text x="324" y="60.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">per rank</text></g>
  <path d="M161 27h98v48h-98Z" fill="none" stroke="#5f666d" stroke-width="1" stroke-dasharray="4 3"/>
  <path class="arrow" d="M64 42L82 42M76.6 39.39L82 42L76.6 44.61" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <path class="arrow" d="M84 60L66 60M71.4 62.61L66 60L71.4 57.39" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <text x="74" y="22" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">HTTP</text>
  <text x="74" y="86" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">SSE</text>
  <path class="arrow" d="M144 42L162 42M156.6 39.39L162 42L156.6 44.61" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <path class="arrow" d="M164 60L146 60M151.4 62.61L146 60L151.4 57.39" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <text x="154" y="22" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">ZMQ</text>
  <text x="154" y="86" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">ZMQ</text>
  <path class="arrow" d="M256 42L274 42M268.6 39.39L274 42L268.6 44.61" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <path class="arrow" d="M276 60L258 60M263.4 62.61L258 60L263.4 57.39" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <text x="266" y="22" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">ZMQ</text>
  <text x="266" y="86" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">ZMQ</text>
  <text x="210" y="10" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="middle" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">one process by default</text>
  <g class="box" data-slot="green"><rect x="276" y="120" width="80" height="32" fill="#237a37" stroke="#185e2c" stroke-width="1"/><g class="glyph" data-slot="green"><polygon points="280.5,136 282.25,132.96 285.75,132.96 287.5,136 285.75,139.04 282.25,139.04" fill="#fafaf6"/></g><text x="324" y="139.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">GPU</text></g>
  <path class="arrow" d="M294 72L294 118M296.61 112.6L294 118L291.39 112.6" fill="none" stroke="#5a361b" stroke-width="1.25"/>
  <path class="arrow" d="M338 118L338 74M335.39 79.4L338 74L340.61 79.4" fill="none" stroke="#5a361b" stroke-width="1.25"/>
  <text x="288" y="100" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="end" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">down</text>
  <text x="344" y="100" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">up</text>
  <text x="4" y="166" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">copy down, launch, copy up:</text>
  <text x="4" y="180" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">one turn of the scheduler's loop</text>
  <g class="key" data-slot="blue"><rect x="4" y="192" width="16" height="12" fill="#1b5faa" stroke="#18509a" stroke-width="1"/></g>
  <g class="glyph" data-slot="blue"><circle cx="12" cy="198" r="3.5" fill="#fafaf6"/></g>
  <text x="24" y="202" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">process</text>
  <g class="key" data-slot="green"><rect x="78" y="192" width="16" height="12" fill="#237a37" stroke="#185e2c" stroke-width="1"/></g>
  <g class="glyph" data-slot="green"><polygon points="82.5,198 84.25,194.96 87.75,194.96 89.5,198 87.75,201.04 84.25,201.04" fill="#fafaf6"/></g>
  <text x="98" y="202" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">GPU</text>
  <g class="key" data-slot="brown"><rect x="128" y="192" width="16" height="12" fill="#7b4a26" stroke="#5a361b" stroke-width="1"/><rect x="128" y="192" width="16" height="12" fill="url(#code-brown)" stroke="none"/></g>
  <g class="glyph" data-slot="brown"><rect x="133" y="195" width="6" height="6" fill="#fafaf6"/></g>
  <text x="148" y="202" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">copy</text>
</svg>
