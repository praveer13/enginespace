<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 216" width="360" height="216">
  <title>An abort in vLLM at the pin: it arrives during a step and is handled before the update</title>
  <desc>Three lanes against time. The API server lane has a cancel block and then an abort block. A ZMQ arrow runs from the abort block to the input thread's lane, where one block puts the abort on both queues. The main thread's lane has a long block for the forward of step N, and after it an aborts block and an update block. An arrow labelled aborts_queue runs from the queues block to the aborts block, which begins where the forward ends. The abort arrives while the step runs, and it is handled after the forward and before the update.</desc>
  <rect width="360" height="216" fill="#fafaf6"/>
  <text x="4" y="36" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">API server</text>
  <text x="4" y="86" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">input thread</text>
  <text x="4" y="130" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">main thread</text>
  <g class="box" data-slot="blue"><rect x="88" y="20" width="60" height="26" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="96" cy="33" r="3.5" fill="#fafaf6"/></g><text x="126" y="36.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">cancel</text></g>
  <g class="box" data-slot="blue"><rect x="152" y="20" width="54" height="26" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="160" cy="33" r="3.5" fill="#fafaf6"/></g><text x="187" y="36.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">abort</text></g>
  <g class="box" data-slot="blue"><rect x="190" y="68" width="92" height="26" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="198" cy="81" r="3.5" fill="#fafaf6"/></g><text x="244" y="84.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">both queues</text></g>
  <g class="box" data-slot="green"><rect x="88" y="112" width="162" height="26" fill="#237a37" stroke="#185e2c" stroke-width="1"/><g class="glyph" data-slot="green"><polygon points="92.5,125 94.25,121.95 97.75,121.95 99.5,125 97.75,128.04 94.25,128.04" fill="#fafaf6"/></g><text x="177" y="128.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">forward of step N</text></g>
  <g class="box" data-slot="blue"><rect x="250" y="112" width="60" height="26" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><g class="glyph" data-slot="blue"><circle cx="258" cy="125" r="3.5" fill="#fafaf6"/></g><text x="288" y="128.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">aborts</text></g>
  <g class="box" data-slot="blue"><rect x="310" y="112" width="46" height="26" fill="#1b5faa" stroke="#18509a" stroke-width="1"/><text x="333" y="128.5" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#fafaf6" text-anchor="middle">update</text></g>
  <path d="M179 46V81" fill="none" stroke="#5f666d" stroke-width="1"/>
  <path class="arrow" d="M179 81L188 81M182.6 78.39L188 81L182.6 83.61" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <text x="185" y="62" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">ZMQ</text>
  <path class="arrow" d="M268 94L268 110M270.61 104.6L268 110L265.39 104.6" fill="none" stroke="#3b4148" stroke-width="1.25"/>
  <text x="274" y="106" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">aborts_queue</text>
  <text x="4" y="168" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">the abort arrives while step N runs</text>
  <text x="4" y="184" font-family="'Atkinson Hyperlegible', system-ui, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">it is handled after the forward, before the update</text>
  <g class="key" data-slot="blue"><rect x="4" y="196" width="16" height="12" fill="#1b5faa" stroke="#18509a" stroke-width="1"/></g>
  <g class="glyph" data-slot="blue"><circle cx="12" cy="202" r="3.5" fill="#fafaf6"/></g>
  <text x="24" y="206" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">thread work</text>
  <g class="key" data-slot="green"><rect x="102" y="196" width="16" height="12" fill="#237a37" stroke="#185e2c" stroke-width="1"/></g>
  <g class="glyph" data-slot="green"><polygon points="106.5,202 108.25,198.96 111.75,198.96 113.5,202 111.75,205.04 108.25,205.04" fill="#fafaf6"/></g>
  <text x="122" y="206" font-family="'Atkinson Hyperlegible Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#17191d" text-anchor="start" stroke="#fafaf6" stroke-width="3" stroke-linejoin="round" paint-order="stroke">forward</text>
</svg>
