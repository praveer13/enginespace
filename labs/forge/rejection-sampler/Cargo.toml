[package]
name = "rejection-sampler"
version = "0.1.0"
edition = "2021"
description = "forge lab rejection-sampler: the exact verify step of speculative decoding (enginespace)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kslab = { path = "../kit" }

# The builds that are not the learner's own. Each swaps the file that the learner edits (src/verify.rs) for one of the repository's, and
# no zip carries `reference/` or `bestiary/` (W1-T11 leaves them out). At most one of them is on.
[features]
# The reference solution, named `rejection-sampler@reference`: the site shows its run and never credits it (ARCHITECTURE §8.3).
reference = []
# The reference solution under the lab's own name, as a learner who finished would build it. For the host's own tests (verify:labs, the
# fixtures): it is how a credited run is made without a learner.
solved = []
# The bestiary (ASSESSMENT §4.5, curriculum TR6 §5): wrong verify steps that every host run must fail, each by the checks that
# bestiary/bestiary.json names for it. None of them loops or traps, so `cargo test` could run one, and nothing does.
bestiary-accept-if-p-over-q = []
bestiary-resample-from-p = []
bestiary-resample-from-q = []
bestiary-residual-off-by-one = []
bestiary-boundary-inclusive = []
bestiary-fly-lossy = []
