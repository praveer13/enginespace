[package]
name = "toy"
version = "0.1.0"
edition = "2021"
description = "forge lab toy: the rotation, the forge host's own practice lab (enginespace)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kslab = { path = "../kit" }

# The builds that are not the learner's own. Each swaps the file that the learner edits (src/rotation.rs) for one of the repository's, and
# no zip carries `reference/` or `bestiary/` (W1-T11 leaves them out). At most one of them is on.
[features]
# The reference solution, named `toy@reference`: the site shows its run and never credits it (ARCHITECTURE §8.3).
reference = []
# The reference solution under the lab's own name, as a learner who finished would build it. For the host's own tests (verify:labs,
# the e2e fixtures): it is how a credited run is made without a learner.
solved = []
# The bestiary (ASSESSMENT §4.5): wrong modules that every host run must fail, each by the checks that bestiary/bestiary.json names for it.
# Never `cargo test` a bestiary feature on: `bestiary-spin` is an infinite loop on purpose, natively as well as in wasm.
bestiary-fifo = []
bestiary-spin = []
