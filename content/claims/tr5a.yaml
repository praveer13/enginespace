- id: vllm.hybrid-kv.memory-layout
  value: one buffer per layer of a group, shared by one layer from each group
  text: For a model with n groups of m layers each, vLLM allocates m buffers, and each buffer is shared by n layers, one from each group. One logical block therefore maps to m pieces in the m buffers.
