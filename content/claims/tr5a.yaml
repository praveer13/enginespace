# What TR5a's four lessons cite beyond the claims of vllm/kv.yaml, vllm/kv-manager.yaml, sglang/kv.yaml and worlds/references.yaml (W1-T25; curriculum/TR5a §8):
# why a hybrid model needs several KV groups, how vLLM's planner brings the groups to one page size and what the padding costs, the one rule of the
# hybrid coordinator that makes its lookup a loop, the shape of the adapter slots of both engines, what S-LoRA's paper says of its pages, and what
# kernelspace's lab 02 already asks of a block manager. An id starts with its engine, or with `kv` when its source is not an engine's.
#
# Each quote was read on 2026-11-05 with the generic User-Agent "Mozilla/5.0 (X11; Linux x86_64)" from the file or page its anchor names, and
# found verbatim inside the lines the anchor gives (a file at a tag is downloaded into a folder of its own and read as text, never run; the
# paper's HTML page is turned into text by a script that reads it and runs nothing from it). The engines are read at the pins, vLLM v0.33.0 and
# SGLang v0.5.23, so their TTL is the quarter that a pin lasts. S-LoRA is read at its v3 and kernelspace at d478f91, and a paper at a version or
# a document at a commit does not move, so those carry a year [estimated].

# --- Why one model needs several caches (lesson 1) -----------------------------------------------------------------------------------

- id: vllm.hybrid-kv.hybrid-models
  value: sliding window, Mamba and local chunked, each with full attention
  text: vLLM's design document names three families of hybrid model, sliding-window attention with full attention (gpt-oss, Gemma 2 and 3, Ministral and cohere among them), Mamba with full attention (Bamba, Jamba, Minimax) and local chunked attention with full attention (Llama 4).
  tag: measured
  source:
