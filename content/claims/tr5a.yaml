  value: one manager class for each kind of cache spec
  text: vLLM registers a manager class for each kind of KV cache spec. At v0.33.0 full attention has FullAttentionManager, a sliding window SlidingWindowManager, a Mamba layer MambaManager, chunked local attention ChunkedLocalAttentionManager and cross-attention CrossAttentionManager, and there are more.
