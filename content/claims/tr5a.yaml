- id: vllm.hybrid-kv.group-rules
  value: one attention type in a group, one page size across groups
  text: The design document gives a KV cache group two rules. The layers of a group are all of one attention type, so that they need the same number of blocks for a request and can share the same block ids. And every group has the same page size, because the memory pool has only one.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/hybrid_kv_cache_manager.md#L92-L95
    title: vLLM v0.33.0, docs/design/hybrid_kv_cache_manager.md (Case 2)
    quote: 'Identical page size across groups'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

# --- One pool, one page size (lesson 2) ------------------------------------------------------------------------------------------------

- id: vllm.hybrid-kv.page-size-formula
  value: layers x block size x kv hidden size
  text: In the design document a block holds block_size tokens for the layers it serves, and the page size is the physical size of a block, the number of layers times the block size times the bytes that one token's KV takes in one layer. The number of layers in that product is not the model's total, but the number the block serves in the case at hand.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/hybrid_kv_cache_manager.md#L25-L34
    title: vLLM v0.33.0, docs/design/hybrid_kv_cache_manager.md (Definitions)
    quote: 'doesn''t mean the total number of layers in the model'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

