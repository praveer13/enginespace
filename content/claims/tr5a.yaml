- id: vllm.hybrid-kv.layer-slots
  value: only the most recent window of tokens
  text: A hybrid model's KV cache manager has to reserve slots for all tokens in a full-attention layer and only for the most recent window of tokens in a sliding-window layer, and it has to apply a prefix-cache rule for each kind of layer.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/hybrid_kv_cache_manager.md#L14-L21
    title: vLLM v0.33.0, docs/design/hybrid_kv_cache_manager.md (What is a hybrid model?)
    quote: 'reserve slots only for the most recent'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.hybrid-kv.no-ring-buffer
  value: a ring of window blocks was not picked
  text: The design document rejects the obvious design for a sliding window, a ring of window-sized blocks that new tokens overwrite in turn, because it is not compatible with prefix caching. vLLM allocates different blocks for different tokens instead, and frees the blocks that are outside the window.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/hybrid_kv_cache_manager.md#L177
    title: vLLM v0.33.0, docs/design/hybrid_kv_cache_manager.md (Prefix caching, case 1)
    quote: 'this naive implementation is not compatible with prefix caching so we didn''t pick this design'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

