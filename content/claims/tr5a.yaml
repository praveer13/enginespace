# --- A prefix hit must hold in every group (lesson 3) ----------------------------------------------------------------------------------

- id: vllm.hybrid-kv.downward-closed
  value: full attention is downward-closed
  text: The hybrid coordinator's lookup treats full attention as downward-closed, so it looks up the cached blocks of a full-attention group once, and on the later passes of its loop only trims that group's hit to the candidate length. The other groups get no such shortcut, and are asked again on every pass.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/kv_cache_coordinator.py#L856-L901
    title: vLLM v0.33.0, vllm/v1/core/kv_cache_coordinator.py, HybridKVCacheCoordinator.find_longest_cache_hit
    quote: 'Full attention is downward-closed: we only need to look'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

