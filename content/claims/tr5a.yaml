- id: vllm.hybrid-kv.kv-sharing
  value: layers that share a cache get none of their own
  text: Some models have a layer that uses the KV cache of another layer, Gemma-3n among them. The KV cache manager ignores every layer that shares and allocates cache only for the layers that need it, and the model runner applies the result to the layers that share.
