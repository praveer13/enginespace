- id: kv.kernelspace.lab02-all-or-nothing
  value: all or nothing
  text: kernelspace's lab 02, the block manager, asks for every operation to be all or nothing. If the pool cannot satisfy an operation, the manager returns false and leaves all state untouched, because half-applied allocations are how production engines corrupt themselves.
  tag: measured
  source:
    url: https://github.com/praveer13/kernelspace/blob/d478f91a0af590f03fcfd76ee73149fa70b28e51/labs/kv-block-manager/src/lib.rs#L22-L24
    title: kernelspace labs/kv-block-manager/src/lib.rs, the model of lab 02 (at d478f91)
    quote: 'All-or-nothing: if the pool can''t satisfy an operation, return'
