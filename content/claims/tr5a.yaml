- id: kv.slora.page-vector
  value: a page is one vector of the hidden size
  text: In S-LoRA's unified pool each page is one vector of the hidden size. A KV cache tensor with a sequence length of S uses up S pages, and a LoRA weight tensor of rank R takes up R pages.
  tag: measured
  source:
    url: https://arxiv.org/html/2311.03285v3#S5.SS1
    title: Sheng et al., S-LoRA, arXiv 2311.03285v3, section 5.1 (Unified Paging)
    quote: 'Thus, a KV cache tensor with a sequence length of S uses up S pages, while a LoRA weight tensor of rank R takes up R pages.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 365

- id: kv.slora.non-contiguous
  value: interleaved and non-contiguous
  text: S-LoRA stores KV caches and adapter weights in its pool interleaved and non-contiguously, which the authors say significantly reduces fragmentation and lets adapters of different ranks live beside KV caches that keep changing size.
  tag: measured
  source:
    url: https://arxiv.org/html/2311.03285v3#S5.SS1
    title: Sheng et al., S-LoRA, arXiv 2311.03285v3, section 5.1 (Unified Paging)
    quote: 'where KV caches and adapter weights are stored interleaved and non-contiguously.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 365

- id: kv.slora.static-pool
  value: one buffer, everything but the weights and the activations
  text: S-LoRA allocates one large buffer statically for its pool. The buffer takes all the space except what the base model's weights and the temporary activations occupy, and KV caches and adapter weights then share it.
  tag: measured
  source:
    url: https://arxiv.org/html/2311.03285v3#S5.SS1
    title: Sheng et al., S-LoRA, arXiv 2311.03285v3, section 5.1 (Unified Paging)
    quote: 'This buffer uses all available space except for the space occupied by the base model weights and temporary activation tensors.'
