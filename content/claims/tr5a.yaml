  source:
    url: https://arxiv.org/html/2311.03285v3#S5.SS2
    title: Sheng et al., S-LoRA, arXiv 2311.03285v3, section 5.2 (Prefetching and Overlapping)
    quote: 'While running the current decoding batch, we predict the adapters required for the next batch based on the current waiting queue.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 365

- id: kv.slora.headline-results
  value: up to 4 times
  text: The S-LoRA paper reports a throughput up to 4 times that of HuggingFace PEFT and of vLLM with naive support of LoRA serving, and several orders of magnitude more adapters served. The comparison is the authors' own, against a vLLM with naive support of LoRA serving and not the pinned engine, and the course has not reproduced it.
  tag: measured
  source:
    url: https://arxiv.org/html/2311.03285v3
    title: Sheng et al., S-LoRA, arXiv 2311.03285v3, abstract
