- id: kv.kernelspace.lab02-adapter-check
  value: adapter_unified_paging
  text: kernelspace's lab 02 has an optional advanced check, adapter_unified_paging. It asks the manager to place adapter pages and sequence KV in the same finite pool, to fail atomically under pressure, and to reclaim each lifetime independently.
