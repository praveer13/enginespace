- id: kv.slora.prefetch-next-batch
  value: predict the next batch from the waiting queue
  text: While S-LoRA runs the current decoding batch, it predicts the adapters that the next batch needs from the waiting queue, and prefetches them into available memory, so that most of them are in place before the batch runs.
