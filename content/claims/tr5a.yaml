    url: https://arxiv.org/html/2311.03285v3
    title: Sheng et al., S-LoRA, arXiv 2311.03285v3, abstract
    quote: 'S-LoRA stores all adapters in the main memory and fetches the adapters used by the currently running queries to the GPU memory.'
