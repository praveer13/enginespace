    title: 'PyTorch 2.14 documentation, torch.Tensor.view'
    quote: 'When it is unclear whether a view() can be performed, it is advisable to use reshape(), which returns a view if the shapes are compatible, and copies (equivalent to calling contiguous()) otherwise.'
    accessed: 2026-11-20
  verifiedAt: 2026-11-20
  ttlDays: 365
  pin: torch

- id: torch.reshape.view-if-compatible
