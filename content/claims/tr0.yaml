- id: transformers.qwen3.attn-projections
  value: 'q_proj, k_proj, v_proj and o_proj'
  text: 'Qwen3Attention has three separate projections for the query, the key and the value, and an output projection. The query''s output width is the number of attention heads times the head size, and the key''s and the value''s is the number of key and value heads times the head size.'
