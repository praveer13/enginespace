- id: transformers.qwen3.rmsnorm
  value: 'float32, mean of squares, rsqrt, then the weight'
  text: 'Qwen3RMSNorm casts to float32, takes the mean of the squares over the last dimension, multiplies by the reciprocal square root of that mean plus epsilon, casts back and then multiplies by its weight.'
