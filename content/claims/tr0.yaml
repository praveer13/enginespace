- id: transformers.qwen3.decoder-order
  value: 'norm, attention, add, norm, MLP, add'
  text: 'In Qwen3''s decoder layer in transformers the residual is kept, the input is normalized, the attention runs and the residual is added back. The same four steps follow for the MLP, with the post-attention norm.'
  tag: measured
  source:
    url: https://github.com/huggingface/transformers/blob/v5.19.0/src/transformers/models/qwen3/modeling_qwen3.py#L296-L315
