# What TR0's five lessons, its game and its lab cite: which PyTorch 2.14 calls give a view and which copy, which calls wait for the GPU, Triton 3.8.0's
# program model and its interpreter, the five Model Runner V2 files of vLLM that lesson 5 reads, Mini-SGLang's Qwen3 beside transformers' own, SGLang's one PyO3
# example, and the configuration and the files of Qwen3-0.6B at its proposed revision. An id starts with the thing it describes (`torch`, `triton`, `vllm`,
# `minisgl`, `transformers`, `sglang`, `qwen3`, `python`).
#
# Each quote was read on 2026-11-20 with the generic User-Agent "Mozilla/5.0 (X11; Linux x86_64)" from the file or page its anchor names, and found
# verbatim inside the lines the anchor gives. A file at a commit or a tag was downloaded into a folder of its own and read as text, never run, and a page was
# turned into text by a script that reads it and runs nothing from it. PyTorch is read at its 2.14 documents (never "stable", which was the 2.15 documents on the
# day), Triton at the tag v3.8.0 and transformers at the tag v5.19.0, each as the source files whose docstrings are those documents (Triton's own site
# publishes one unversioned copy), vLLM at 4ba787ec (v0.33.0), Mini-SGLang at 9a91cfaf and SGLang at 297e54fd (v0.5.23). The lines of an anchor are lines of those copies.
#
# A claim of the model's files and of the hub's listings is `unverified`: the course has fetched the configuration and no weight file, and the lab's own download check hashes the
# rest. One fact could not be read as a statement, that printing a GPU tensor waits for the GPU (`torch.cuda.print-waits`): the pages say a copy between the GPU
# and the CPU synchronizes, and none names printing. It is `unverified` and no lesson or question leans on it.



# PyTorch 2.14: which calls give a view and which copy (lesson 1, lesson 2 and the parts of Tensor views) ----------------------------------------

- id: torch.view.shares-data
  value: 'a view shares the data'
  text: 'Tensor.view returns a tensor that shares its data with the original and has the same number of elements, so it moves nothing.'
  tag: measured
  source:
    url: https://docs.pytorch.org/docs/2.14/generated/torch.Tensor.view.html
    title: 'PyTorch 2.14 documentation, torch.Tensor.view'
    quote: 'The returned tensor shares the same data and must have the same number of elements, but may have a different size.'
    accessed: 2026-11-20
  verifiedAt: 2026-11-20
  ttlDays: 365
  pin: torch

- id: torch.view.needs-compatible-strides
  value: 'the new size must fit the old strides'
  text: 'A tensor can be viewed with a new shape only when the new size is compatible with its original size and stride. Each new dimension must lie inside one old dimension, or span old dimensions whose strides chain.'
  tag: measured
  source:
    url: https://docs.pytorch.org/docs/2.14/generated/torch.Tensor.view.html
    title: 'PyTorch 2.14 documentation, torch.Tensor.view'
    quote: 'For a tensor to be viewed, the new view size must be compatible with its original size and stride, i.e., each new view dimension must either be a subspace of an original dimension, or only span across original dimensions'
    accessed: 2026-11-20
  verifiedAt: 2026-11-20
  ttlDays: 365
  pin: torch

- id: torch.view.otherwise-copy
  value: 'not possible without a copy'
  text: 'When the strides do not allow it, a view of the new shape cannot be made without copying the tensor, for example through contiguous().'
  tag: measured
  source:
    url: https://docs.pytorch.org/docs/2.14/generated/torch.Tensor.view.html
    title: 'PyTorch 2.14 documentation, torch.Tensor.view'
    quote: 'Otherwise, it will not be possible to view self tensor as shape without copying it (e.g., via contiguous()).'
    accessed: 2026-11-20
  verifiedAt: 2026-11-20
  ttlDays: 365
  pin: torch

- id: torch.view.prefer-reshape
  value: 'reshape when unsure'
  text: 'When it is unclear whether view() can be performed, the page advises reshape(), which returns a view where the shapes are compatible and copies, as contiguous() does, where they are not.'
