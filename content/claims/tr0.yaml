- id: triton.arange-range-check
  value: 'end minus start is a power of two'
  text: 'The code that builds tl.arange raises an error unless end minus start is a power of two. So tl.arange(0, BLOCK) compiles only for a BLOCK that is a power of two. The documentation words the rule about start and end, and the code checks their difference.'
