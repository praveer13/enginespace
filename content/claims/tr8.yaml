# What TR8's lessons cite beyond the claims of vllm/bench.yaml, sglang/bench.yaml and broken-bench.yaml (W1-T34; curriculum/TR8 §8): the tools' percentile
# and goodput arithmetic, their warm-up requests, SGLang's one replay in time, wrk2's own run in more detail, what kernelspace's T7.L2 and its knee fix,
# and what BurstGPT's files say about their timestamps. An id starts with its engine, or with `bench` when its source is not an engine's.
#
# Each quote was read on 2026-11-04 with the generic User-Agent "Mozilla/5.0 (X11; Linux x86_64)" from the file or page its anchor names, and found
# verbatim inside the lines the anchor gives (a file at a tag is downloaded into a folder of its own and read as text, never run; a run of spaces in a
# README's table is read as one). The tools are read at the pins, vLLM v0.33.0 and SGLang v0.5.23, and so their TTL is the quarter that a pin lasts.
# wrk2 is read at 44a94c1, kernelspace at d478f91 and BurstGPT at its v2.0 tag, and a document at a commit or a tag does not move, so those carry a
# year [estimated].

- id: vllm.bench.percentile-numpy
  value: np.percentile
  text: In calculate_metrics, vllm bench serve takes each time-to-first-token percentile by passing the list of values straight to NumPy's np.percentile, with no check on how many there are. A run of ten requests reports a p99 just as a run of ten thousand does.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/benchmarks/serve.py#L786-L788
    title: vLLM v0.33.0, vllm/benchmarks/serve.py, calculate_metrics (the TTFT percentiles)
    quote: '(p, np.percentile(ttfts or 0, p) * 1000) for p in selected_percentiles'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.bench.goodput-denominator
  value: good_completed / dur_s
  text: vllm bench serve divides the requests that met every objective by dur_s, the benchmark duration. The duration is taken from just before the first request is generated to just after the last request has returned, so a run that is still draining its queue counts that time in the denominator.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/benchmarks/serve.py#L777-L780
    title: vLLM v0.33.0, vllm/benchmarks/serve.py, calculate_metrics (request_goodput); the clock is started at line 1048 and read at line 1123
    quote: 'request_goodput=good_completed / dur_s,'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.bench.timer-inside-request
  value: output.ttft = timestamp - st
  text: In vllm bench serve's default request function, for the openai backend, the timer starts as the function begins (st = time.perf_counter()), just before it posts the request, and the time to first token is the first chunk's timestamp less that start. So TTFT counts from the send.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/benchmarks/lib/endpoint_request_func.py#L248-L286
    title: vLLM v0.33.0, vllm/benchmarks/lib/endpoint_request_func.py, async_request_openai_completions (the timer)
    quote: 'output.ttft = timestamp - st'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.bench.client-queue-in-percentile-metrics
  value: --percentile-metrics
  text: vLLM's benchmarking guide says that when --max-concurrency is set, client_queue_time should be included in --percentile-metrics, to report the time spent waiting for the benchmark client's concurrency limit.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/benchmarking/cli.md#L775
    title: vLLM v0.33.0, docs/benchmarking/cli.md, load pattern control parameters
    quote: 'include `client_queue_time` in `--percentile-metrics` to report time spent waiting for the benchmark client''s concurrency limit.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.bench.warmup-is-request-zero
  value: copies of one request
  text: In vllm bench serve the warm-up requests are all one and the same, test_input, which is built from the first request of the dataset. They are sent together before the main run, under the concurrency cap when there is one, and none of their outputs is kept.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/benchmarks/serve.py#L875-L945
    title: vLLM v0.33.0, vllm/benchmarks/serve.py, benchmark (the test run and the warm-up)
    quote: 'request_func_input=test_input, session=session, pbar=warmup_pbar'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: sglang.bench.warmup-is-request-zero
  value: 32
  unit: tokens
  text: In bench_serving the warm-up requests are copies of the first request of the dataset, with the output length capped at 32 tokens, and they run at the same concurrency as the measured run, so --warmup-requests does not become a burst of its own.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/benchmark/serving.py#L1466-L1501
    title: SGLang v0.5.23, python/sglang/benchmark/serving.py, benchmark (the warm-up)
    quote: 'output_len=min(test_request.output_len, 32),'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

