# What TR2's seven lessons cite beyond the claims of vllm/engine.yaml, vllm/graphs.yaml, vllm/steploop.yaml, sglang/engine.yaml, sglang/graphs.yaml,
# readings.yaml and loop.yaml (W1-T15; curriculum/TR2 §8): how one engine step is made of calls, what the scheduler's one token budget is and how a waiting
# prompt is cut to it, how async scheduling plans on tokens that are not sampled yet, what Model Runner V2 changes about the runner and what its authors
# report, what a CUDA graph is for and what each mode costs, which attention backends can replay which graphs, and how SGLang, Mini-SGLang and
# TensorRT-LLM do the same things. An id starts with its engine (`vllm`, `sglang`, `mini-sglang`, `trtllm`), or with `loop` when its source is kernelspace's.
#
# Each quote was read on 2026-11-05 with the generic User-Agent "Mozilla/5.0 (X11; Linux x86_64)" from the file or page its anchor names, and found
# verbatim inside the lines the anchor gives (a file at a tag or a commit is downloaded into a folder of its own and read as text, never run; a blog
# post is turned into text by a script that reads it and runs nothing from it; kernelspace is read with `git show` at d478f91). The engines are read at
# the pins, vLLM v0.33.0 and SGLang v0.5.23, so a claim that cites a file there lasts the quarter that a pin lasts. A post, a file at a commit that does not
# move, and a fact about an older release carry a year [estimated]. TensorRT-LLM is not a pin of the course: it is read at the commit b96ba434 of its tag
# v1.4.0rc2, and a claim about it carries no pin. A figure that a team measured and that the course has not repeated is `unverified`, and says so.
#
# Seven claims (vllm.step.execute-model-state, vllm.step.sample-if-none, vllm.executor.uni-default, vllm.executor.uni-inline,
# vllm.executor.uni-blocking-output, vllm.mrv2.input-tensors and vllm.cudagraph.none-debugging) were written on 2026-11-08, when the lessons were checked
# line by line against the source. Each quote was found in the lines of its anchor in the copy of the file that the first reading downloaded on 2026-11-05,
# so for these seven `accessed` and `verifiedAt` are the day of that copy, which is the day the source was read, and no later.


# --- Lesson 1: one step, five calls ------------------------------------------------------------------------------------------------------

- id: vllm.step.two-phase
  value: 'execute_model, then sample_tokens'
  text: MRV2's model runner keeps the state of execute_model for the sample_tokens call that follows it, so one step is two calls into the runner.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/worker/gpu/model_runner.py#L360
    title: vLLM v0.33.0, vllm/v1/worker/gpu/model_runner.py, GPUModelRunner (execute_model_state)
    quote: '# For transferring state from execute_model to subsequent sample_tokens call.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.step.sample-if-none
  value: 'sample_tokens when the result is empty'
  text: EngineCore.step calls sample_tokens with the grammar output only when the result of the future is None, so when the runner leaves the sampling for a second call, the output of the step comes from that call.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/engine/core.py#L684-L686
    title: vLLM v0.33.0, vllm/v1/engine/core.py, EngineCore.step (the result of the future)
    quote: 'if model_output is None:'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.step.execute-model-state
  value: 'state first, then the inputs'
  text: MRV2's execute_model first brings the request states up to date, by finishing and freeing requests, adding new ones and updating the others, and applies the staged block-table writes. It then prepares all the inputs and copies them to the input buffers, before it runs the model.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/worker/gpu/model_runner.py#L1775-L1866
    title: vLLM v0.33.0, vllm/v1/worker/gpu/model_runner.py, GPUModelRunner.execute_model (the first half of a step)
    quote: '# Update the request states.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.executor.uni-default
  value: 'uni'
  text: With one GPU the distributed executor backend defaults to uni, the single-process executor.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/parallel.py#L1098-L1099
