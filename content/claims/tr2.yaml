# --- Lesson 3: async scheduling ----------------------------------------------------------------------------------------------------------

- id: vllm.async-scheduling.placeholders-added
  value: 'num_output_placeholders'
  text: Under async scheduling, once a step is scheduled, the scheduler adds to each decode request's num_output_placeholders the tokens that the step will sample (and the draft tokens it carries), so that the next schedule call can plan on tokens that have not been sampled yet.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/sched/async_scheduler.py#L44-L46
    title: vLLM v0.33.0, vllm/v1/core/sched/async_scheduler.py, AsyncScheduler._update_after_schedule
    quote: 'request.num_output_placeholders += ('
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.async-scheduling.placeholders-resolved
  value: 'placeholders resolved by the output'
  text: When the output of a step comes back, the scheduler takes the tokens it returned off the request's placeholders.
  tag: measured
