  tag: measured
  source:
    url: https://github.com/NVIDIA/TensorRT-LLM/blob/b96ba434e8a05e2ab52d2082bd8d70b1d844739b/docs/source/developer-guide/overview.md#L54-L55
    title: TensorRT-LLM at b96ba43 (the tag v1.4.0rc2), docs/source/developer-guide/overview.md, Runtime Optimizations (CUDA Graph)
    quote: 'If an incoming batch''s size doesn''t match a captured graph, it''s padded to the nearest larger, supported size for which a graph exists.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90

