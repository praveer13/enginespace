    title: vLLM v0.33.0, docs/design/model_runner_v2.md, Explicit CUDA Graph Management
    quote: 'MRV2 uses a `CUDAGraphManager` that explicitly captures and launches full CUDA graphs through standard PyTorch APIs.'
