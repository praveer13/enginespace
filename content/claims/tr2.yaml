- id: sglang.cudagraph.blog-definition
  value: 'record once, replay'
  text: SGLang's post on CUDA graphs says that repeatedly launching the many GPU operations of an inference step from the CPU can introduce noticeable overhead, and that a CUDA graph reduces it by recording the GPU work once and replaying it with much lower launch overhead.
  tag: measured
  source:
    url: https://lmsys.org/blog/2026-08-17-advanced-cuda-graph/
    title: LMSYS blog, Advanced CUDA Graph Techniques in SGLang (2026-08-17), Background
    quote: 'CUDA Graph reduces this overhead by recording the GPU work once and replaying it with much lower launch overhead.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 365
  pin: sglang

- id: sglang.cudagraph.blog-flat-curve
  value: 'a flat curve is launch-bound'
  text: In its prefill benchmark on gpt-oss-120b, SGLang's post notes that every curve is flat across a 32 times range in prompt length, which it calls the signature of launch overhead rather than compute.
  tag: measured
  source:
    url: https://lmsys.org/blog/2026-08-17-advanced-cuda-graph/
    title: LMSYS blog, Advanced CUDA Graph Techniques in SGLang (2026-08-17), Prefill benchmark
    quote: 'Every curve is flat across a 32× range in prompt length, which is the signature of launch overhead rather than compute.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 365
  pin: sglang

- id: sglang.cudagraph.blog-padded-tokens
  value: 'padded tokens are real work'
  text: SGLang's post says that a padded token is real work, an actual row in the captured batch that passes through the dense projections in the same matrix multiplications, and that an empty request slot is much cheaper.
  tag: measured
  source:
    url: https://lmsys.org/blog/2026-08-17-advanced-cuda-graph/
    title: LMSYS blog, Advanced CUDA Graph Techniques in SGLang (2026-08-17), What does the padding cost?
    quote: 'Padded tokens are real work. They become actual rows in the captured batch and therefore pass through dense projections as part of the same GEMMs.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 365
  pin: sglang

- id: sglang.cudagraph.blog-ceiling
  value: 'the ceiling matters more than the count'
  text: 'SGLang''s post argues that the largest captured shape matters more than how many shapes are captured: a prefill above the ceiling runs eagerly and keeps the activation peak, while the graphs below it still take their memory.'
  tag: measured
  source:
    url: https://lmsys.org/blog/2026-08-17-advanced-cuda-graph/
    title: LMSYS blog, Advanced CUDA Graph Techniques in SGLang (2026-08-17), Capture through the chunked-prefill size
    quote: 'This makes the capture ceiling more important than the number of captured shapes.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 365
  pin: sglang

