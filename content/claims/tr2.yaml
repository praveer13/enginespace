- id: trtllm.overlap.extra-step
  value: 'one extra decoding step'
  text: TensorRT-LLM says the Overlap Scheduler introduces one extra decoding step into the pipeline, calls the throughput gain a significant trade-off, and enables it by default.
  tag: measured
  source:
    url: https://github.com/NVIDIA/TensorRT-LLM/blob/b96ba434e8a05e2ab52d2082bd8d70b1d844739b/docs/source/developer-guide/overview.md#L75
