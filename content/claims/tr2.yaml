- id: trtllm.cudagraph.one-call
  value: 'one API call'
  text: TensorRT-LLM's architecture overview says that capturing a sequence of CUDA operations as a single graph lets the entire sequence be launched with one API call, which minimizes CPU-GPU synchronization and driver overhead.
