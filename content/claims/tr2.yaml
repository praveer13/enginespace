  ttlDays: 90
  pin: vllm

- id: vllm.mrv2.cuda-graph-manager
  value: 'CUDAGraphManager'
  text: MRV2 owns an explicit CUDAGraphManager that captures and launches full CUDA graphs through standard PyTorch APIs, where V1's graph handling was implicit.
