- id: trtllm.overlap.strategy
  value: 'launch step n+1 without waiting for the results of step n'
  text: TensorRT-LLM's Overlap Scheduler launches the GPU's work for the next step immediately, without waiting for the CPU to finish processing the results of the current step, so the CPU checks stop criteria and updates responses for one batch while the GPU executes the next.
  tag: measured
  source:
    url: https://github.com/NVIDIA/TensorRT-LLM/blob/b96ba434e8a05e2ab52d2082bd8d70b1d844739b/docs/source/developer-guide/overview.md#L60
