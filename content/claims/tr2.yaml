- id: vllm.scheduler.chunk-to-budget
  value: 'the smaller of need and budget'
  text: When the scheduler takes a waiting request, the new tokens it gives it are the smaller of the tokens the request still needs and the token budget that is left, which is what cuts a long prompt into chunks.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/sched/scheduler.py#L1346
    title: vLLM v0.33.0, vllm/v1/core/sched/scheduler.py, Scheduler.schedule (a waiting request)
    quote: 'num_new_tokens = min(num_new_tokens, request_token_budget)'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.scheduler.no-chunk-stop
  value: 'stops the waiting loop'
  text: With chunked prefill off, a waiting request whose new tokens do not fit the budget that is left ends the scheduling of waiting requests for that step.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/sched/scheduler.py#L1338-L1344
    title: vLLM v0.33.0, vllm/v1/core/sched/scheduler.py, Scheduler.schedule (chunked prefill off)
