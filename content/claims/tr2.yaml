# --- Lesson 4: the MRV2 delta ------------------------------------------------------------------------------------------------------------

- id: vllm.mrv2.input-tensors
  value: 'contiguous input tensors for each step'
  text: The MRV2 design document says that V1 introduced persistent batches to minimize CPU overhead during input preparation, because when requests are scheduled for a step the model runner must construct contiguous input tensors, such as block tables and per-request temperature values, to feed into the model, and building them from scratch each step is often very slow in Python.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/model_runner_v2.md#L17
    title: vLLM v0.33.0, docs/design/model_runner_v2.md, Persistent Batch (background)
    quote: 'When requests are scheduled for a step, the model runner must construct contiguous input tensors (for example, block tables and per-request temperature values) to feed into the model.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.mrv2.v1-coupling
  value: 'persistent state used as inputs'
  text: The MRV2 design document says that V1 uses its persistent state tensors directly as model and sampler inputs, which imposes strict layout and ordering requirements, so a request that joins or finishes often means a reordering of the whole tensor.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/model_runner_v2.md#L23
    title: vLLM v0.33.0, docs/design/model_runner_v2.md, Persistent Batch (problems with V1)
    quote: 'V1 uses persistent state tensors directly as model and sampler inputs, which imposes strict layout and ordering requirements. When requests join or finish, this often requires complex tensor-wide reordering rather than simple row insertion/removal.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.mrv2.decoupled-state
  value: 'persistent state apart from per-step inputs'
  text: MRV2 keeps its persistent state tensors apart from the per-step input tensors, and gathers each step's inputs from the state in the request order of the step.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/model_runner_v2.md#L33
    title: vLLM v0.33.0, docs/design/model_runner_v2.md, Persistent Batch (MRV2's solution)
    quote: 'MRV2 decouples persistent state tensors from per-step input tensors. Given request ordering for the step (usually determined by the attention backend), MRV2 gathers input tensors from persistent state.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.mrv2.async-retrofit
  value: 'async scheduling was retrofitted onto V1'
  text: The MRV2 design document says that V1 was not designed with async scheduling in mind, and that its support needed retrofitted behavior and hacks.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/model_runner_v2.md#L47
    title: vLLM v0.33.0, docs/design/model_runner_v2.md, Async-First
    quote: 'V1 was not originally designed with async scheduling in mind, and support required retrofitted behavior and hacks.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.mrv2.no-cpu-sync
  value: 'a stream with no CPU synchronization points'
  text: MRV2 assumes that the core model execution loop is a CUDA stream with no CPU synchronization points, and that the CPU entry points only queue work onto the stream.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/model_runner_v2.md#L47
    title: vLLM v0.33.0, docs/design/model_runner_v2.md, Async-First
    quote: 'MRV2 instead assumes the core model execution loop is a CUDA stream with no CPU synchronization points. CPU entrypoints queue work onto the stream.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.mrv2.staged-write
  value: 'StagedWriteTensor'
  text: For large tensors such as block tables, MRV2 avoids a full CPU-to-GPU copy at every step. It keeps the tensor on the GPU, stages the differences on the CPU, packs and copies them, and launches one kernel to apply them.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/model_runner_v2.md#L106-L112
    title: vLLM v0.33.0, docs/design/model_runner_v2.md, StagedWriteTensor
    quote: 'For large tensors like block tables, MRV2 avoids full CPU-to-GPU copies each step by using `StagedWriteTensor`:'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.mrv2.triton-sampler
  value: 'sampling in Triton'
  text: MRV2 reimplements sampling mostly in Triton, with a Gumbel sampling kernel that avoids materializing the softmax.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/model_runner_v2.md#L147-L151
    title: vLLM v0.33.0, docs/design/model_runner_v2.md, Triton-Native Sampler
    quote: 'MRV2 reimplements sampling mostly in Triton for better numeric/memory control and optimization.'
    accessed: 2026-11-05
