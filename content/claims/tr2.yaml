- id: vllm.executor.uni-inline
  value: 'the calling thread'
  text: The single-process executor runs a call into the worker, execute_model among them, in the thread that makes the call. A non-blocking call returns a future for the output once the work has been launched, and does not wait for the GPU to finish it.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/executor/uniproc_executor.py#L108-L111
    title: vLLM v0.33.0, vllm/v1/executor/uniproc_executor.py, UniProcExecutor.collective_rpc (a non-blocking call)
    quote: 'return AsyncOutputFuture(result, single_value)'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.executor.uni-blocking-output
  value: 'get_output() before it returns'
  text: In a blocking call, when the runner returns an async output, the single-process executor calls get_output() on it before it returns, so the call does not return until get_output() has.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/executor/uniproc_executor.py#L102-L106
    title: vLLM v0.33.0, vllm/v1/executor/uniproc_executor.py, UniProcExecutor.collective_rpc (a blocking call)
    quote: 'result = result.get_output()'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

