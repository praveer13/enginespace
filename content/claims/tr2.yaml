# --- Lesson 2: one token budget ----------------------------------------------------------------------------------------------------------

- id: vllm.scheduler.budget-default
  value: 'max_num_batched_tokens'
  text: The token budget of a scheduling step is max_num_scheduled_tokens, which is max_num_batched_tokens unless it is set.
  tag: measured
