# SGLang at the pin: speculative decoding and the grammar mask's overlap (W1-T01; TR6).
#
# TR6 owns speculation and the overlap of the grammar mask with the forward, and SGLang is the second engine that the answer key reads.
# Read on 2026-11-04 at v0.5.23 (commit 297e54fd105e974cdf401e5b4d20253a22c16f90). Paths under python/sglang/srt/ are shortened in titles
# to srt/.

- id: sglang.spec.algorithms
  value: 'EAGLE, EAGLE3, NEXTN, STANDALONE, NGRAM, DFLASH, DSPARK, UNO'
  text: The built-in --speculative-algorithm values at v0.5.23 are EAGLE, EAGLE3, NEXTN, STANDALONE, NGRAM, DFLASH, DSPARK and UNO, and any name registered with SpeculativeAlgorithm.register. MTP runs through the EAGLE workers.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/arg_groups/fields/spec.py#L31-L34
    title: SGLang v0.5.23, srt/arg_groups/fields/spec.py, speculative_algorithm
    quote: 'Speculative algorithm. Builtins: EAGLE, EAGLE3, NEXTN, STANDALONE, NGRAM, DFLASH, DSPARK, UNO.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.spec.v2-workers
  value: V2 workers, overlap on
  text: Speculative decoding runs the V2 speculative workers, such as EAGLEWorkerV2 and StandaloneWorkerV2, with the overlap scheduler on by default. --disable-overlap-schedule falls back to the synchronous path.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/docs/docs/advanced_features/speculative_decoding.mdx#L774-L776
    title: SGLang v0.5.23, docs/docs/advanced_features/speculative_decoding.mdx (V2, overlap scheduler)
    quote: 'Speculative decoding runs the V2 speculative workers'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

