- id: sglang.spec.pr-35798
  value: coin <= cumulative probability
  text: SGLang pull request 35798, opened on 2026-08-21, fixed an exactness bug in TreeSpeculativeSamplingTargetOnly. It drew its coins from [0, 1) but chose the target CDF bucket with coin <= cumulative_probability, which at coin == 0 accepts a draft token whose target probability is zero.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/pull/35798
    title: SGLang pull request 35798, Fix CDF boundary handling in TreeSpeculativeSamplingTargetOnly
    quote: 'TreeSpeculativeSamplingTargetOnly draws coins from [0, 1) but selects a target CDF bucket with coin <= cumulative_probability.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 365
  pin: sglang

- id: sglang.spec.pr-35798-interior
  value: interior CDF boundaries go to the preceding bucket
  text: The same pull request names a second effect of the inclusive comparison. A coin that lands exactly on an interior boundary of the CDF goes to the bucket before it and not to the next bucket that has positive mass.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/pull/35798
    title: SGLang pull request 35798, Fix CDF boundary handling in TreeSpeculativeSamplingTargetOnly
    quote: 'exact interior CDF boundaries land in the preceding bucket instead of the next positive-mass one.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 365
  pin: sglang

- id: sglang.spec.pr-35798-fix
  value: coin < cumulative probability, and mass above 0
  text: The fix is in the v0.5.23 source. A draft token is accepted only if its target probability is above 0, and the bucket test uses the half-open comparison coin < prob_acc / threshold_acc.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/kernels/jit/include/sgl_kernel/speculative/sampling.cuh#L80-L81
    title: SGLang v0.5.23, kernels/jit/include/sgl_kernel/speculative/sampling.cuh
    quote: 'const bool has_target_mass = target_prob_single > DType(0);'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

# --- The grammar mask ----------------------------------------------------------------------------------------------------------------

- id: sglang.mask.delayed-sampling
  value: sample after the last batch is processed
  text: Without speculation SGLang delays the current batch's sampling until the last batch has been processed, because the sample depends on that result, a grammar being the example. The scheduler runs the sample after it processes the last batch.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/managers/scheduler.py#L2125-L2128
    title: SGLang v0.5.23, srt/managers/scheduler.py, Scheduler.event_loop_overlap
    quote: 'It depends on the result of the last batch (e.g., grammar), so we run it after the last batch is processed.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.mask.grammar-barrier
  value: EAGLE, STANDALONE, DFLASH family
  text: With EAGLE, STANDALONE and the DFLASH family the worker advances the grammar state machine inside verify() through the scheduler's grammar barrier, so that the CPU's grammar work hides under the GPU's draft and verify. NGRAM drafts from a host corpus lookup and stays synchronous by design.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/speculative/spec_info.py#L166-L172
    title: SGLang v0.5.23, srt/speculative/spec_info.py, supports_grammar_overlap
    quote: 'Whether the worker advances the grammar FSM inside verify() (via the'
    accessed: 2026-11-04
