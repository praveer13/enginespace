- id: sglang.spec.overlap-topk
  value: --speculative-eagle-topk 1
  text: The overlap scheduler supports only --speculative-eagle-topk 1 for speculative decoding. A run that omits the flag may be auto-tuned to a topk above 1, which is incompatible with overlap and may not raise an error at once.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/docs/docs/advanced_features/speculative_decoding.mdx#L779-L781
    title: SGLang v0.5.23, docs/docs/advanced_features/speculative_decoding.mdx (V2, overlap scheduler)
    quote: 'The overlap scheduler currently only supports `--speculative-eagle-topk 1`'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

