- id: sglang.cudagraph.decode-max-bs.small
  value: 48
  unit: requests
  text: On a card with 20 GiB to under 35 GiB of memory, which the source lists as A10, 4090 and 5090, the decode graphs stop at a batch of 48 at tensor-parallel sizes under 4, and at 160 from tensor-parallel size 4. A decode batch above 48 should therefore run eagerly on such a card [derived, not run].
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/arg_groups/memory_hook.py#L101-L117
    title: SGLang v0.5.23, srt/arg_groups/memory_hook.py, handle_gpu_memory_settings
    quote: 'decode_cuda_graph_config.max_bs = 48'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

