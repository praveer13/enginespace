# SGLang at the pin: CUDA-graph backends, the buckets a graph is keyed by, and the card-dependent maximum (W1-T01; D-041).
#
# D-041 says SGLang keys its graphs by padded batch size or token count from bucket lists, not by a descriptor. Read on 2026-11-04 at v0.5.23
# (commit 297e54fd105e974cdf401e5b4d20253a22c16f90). Paths under python/sglang/srt/ are shortened in titles to srt/.

- id: sglang.cudagraph.backends
  value: 'full, breakable, disabled'
  text: SGLang configures CUDA graphs per phase, decode and prefill, and each phase uses one backend from full, breakable and disabled.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/model_executor/cuda_graph_config.py#L40-L66
    title: SGLang v0.5.23, srt/model_executor/cuda_graph_config.py, Backend
    quote: 'ALL = (FULL, BREAKABLE, DISABLED)'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

