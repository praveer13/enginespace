- id: sglang.cudagraph.tc-piecewise-removed
  value: removed in v0.5.22
  text: The tc_piecewise prefill graph backend was removed in v0.5.22. Passing it, or a tc_compiler setting, now raises an error, and CUDA keeps breakable as the default prefill backend.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/releases/tag/v0.5.22
    title: SGLang v0.5.22 release notes
    quote: 'The tc_piecewise prefill CUDA graph backend is removed.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 365
  pin: sglang

- id: sglang.cudagraph.decode-buckets
  value: keyed by padded batch size
  text: Without speculative decoding, SGLang captures its decode graphs at the batch sizes 1, 2, 4, 8 and 12, then 16 to 256 in steps of 8, then 272 to 496 in steps of 16, then 512 up to the maximum in steps of 32. A batch is padded up to the next captured size, and the maximum is added to the list if it is missing.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/arg_groups/cuda_graph_hook.py#L500-L532
    title: SGLang v0.5.23, srt/arg_groups/cuda_graph_hook.py, generate_decode_cuda_graph_batch_sizes
    quote: '[1, 2, 4, 8, 12]'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.cudagraph.prefill-buckets
  value: keyed by padded token count
  text: SGLang keys its prefill graphs by the padded token count, not by batch size. The buckets run from 4 to 32 in steps of 4, 48 to 256 in steps of 16, 288 to 512 in steps of 32, 576 to 1,024 in steps of 64, 1,280 to 4,096 in steps of 256, and then in steps of 512 up to the maximum.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/arg_groups/cuda_graph_hook.py#L480-L497
    title: SGLang v0.5.23, srt/arg_groups/cuda_graph_hook.py, generate_prefill_cuda_graph_batch_sizes
    quote: 'list(range(4, 33, 4))'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

