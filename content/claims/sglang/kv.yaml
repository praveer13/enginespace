# SGLang at the pin: adapter slots, the KV events and the radix cache (W1-T01; D-034, D-042).
#
# D-042: at the pins neither engine pages adapters in the KV pool, and SGLang uses a fixed-slot LoRAMemoryPool. D-034: both engines publish
# BlockStored, BlockRemoved and AllBlocksCleared over ZMQ, and kv-events@1 mirrors the pinned shapes. Read on 2026-11-04 at v0.5.23
# (commit 297e54fd105e974cdf401e5b4d20253a22c16f90). Paths under python/sglang/srt/ are shortened in titles to srt/.

# --- Adapter slots --------------------------------------------------------------------------------------------------------------------

- id: sglang.lora.max-loras-per-batch
  value: 8
  unit: slots
  text: SGLang's LoRAMemoryPool has max_loras_per_batch slots, which default to 8 at v0.5.23. The count includes a base-only request.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/arg_groups/fields/lora.py#L66-L69
    title: SGLang v0.5.23, srt/arg_groups/fields/lora.py, max_loras_per_batch
    quote: 'Maximum number of adapters for a running batch, include base-only request.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.lora.pool
  value: a fixed-slot pool
  text: SGLang keeps adapters in LoRAMemoryPool, a pool of max_loras_per_batch buffer slots that maps each slot to an adapter or to an empty marker. It is not a page pool shared with the KV cache.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/lora/mem_pool.py#L131-L132
    title: SGLang v0.5.23, srt/lora/mem_pool.py, LoRAMemoryPool
    quote: 'Class for memory pool management of lora modules'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.lora.slot-search
  value: empty slot first, then evict
  text: To place an adapter the pool takes an empty slot first. When the pool is full it picks a victim among the adapters that the current batch does not need and that are not pinned, by the eviction policy, and prefers evicting a real adapter to evicting the base model.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/lora/mem_pool.py#L792-L843
    title: SGLang v0.5.23, srt/lora/mem_pool.py, LoRAMemoryPool.prepare_lora_batch
    quote: '2. Memory pool is full, need to evict using policy'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.lora.eviction-default
  value: lru
  text: The adapter eviction policy is lru by default, with fifo as the other choice.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/arg_groups/fields/lora.py#L70-L76
    title: SGLang v0.5.23, srt/arg_groups/fields/lora.py, lora_eviction_policy
    quote: "'lru': Least Recently Used (default, better cache efficiency)."
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.lora.cpu-cap
  value: max_loaded_loras >= max_loras_per_batch
  text: max_loaded_loras, when it is set, limits how many adapters stay loaded in CPU memory, and it must be at least max_loras_per_batch.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/arg_groups/fields/lora.py#L62-L65
    title: SGLang v0.5.23, srt/arg_groups/fields/lora.py, max_loaded_loras
    quote: 'The value must be greater than or equal to `--max-loras-per-batch`.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

# --- KV events -----------------------------------------------------------------------------------------------------------------------

- id: sglang.kv-events.encoding
  value: tagged msgpack maps
  text: SGLang encodes a KV event as a tagged msgpack map. The key type carries the class name, every other key is a field name, and an optional field left at None is omitted, so adding an optional field never changes the shape that an older consumer sees.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/disaggregation/kv_events.py#L243-L258
    title: SGLang v0.5.23, srt/disaggregation/kv_events.py, KVCacheEvent
    quote: 'Events are tagged msgpack maps: ``type`` carries the class name and every other key is a field name.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.kv-events.same-encoding-as-vllm
  value: one code path for both engines
  text: SGLang's source says its encoding is the one vLLM uses for its KVCacheEvent, so that a consumer such as Dynamo decodes both engines with one code path.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/disaggregation/kv_events.py#L254-L255
    title: SGLang v0.5.23, srt/disaggregation/kv_events.py, KVCacheEvent
    quote: 'This is the same encoding vLLM uses for its ``KVCacheEvent``, so a consumer such as Dynamo decodes both engines with one code path.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.kv-events.batch
  value: '[ts, events, attn_dp_rank]'
  text: A SGLang event batch is a positional array of a timestamp, a list of events and an optional attention data-parallel rank. vLLM's batch has the same first two entries and calls the third data_parallel_rank.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/disaggregation/kv_events.py#L257
    title: SGLang v0.5.23, srt/disaggregation/kv_events.py, EventBatch
    quote: '``EventBatch`` stays a positional array ``[ts, events, attn_dp_rank]``.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.kv-events.block-stored
  value: 9
  unit: fields
  text: SGLang's BlockStored has 9 fields, block_hashes, parent_block_hash, token_ids, block_size, lora_id, and the optional medium, cache_salt, session_id and lora_name. It has no group index, no extra_keys and no cache-spec fields, which vLLM's has.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/disaggregation/kv_events.py#L279-L295
    title: SGLang v0.5.23, srt/disaggregation/kv_events.py, BlockStored
    quote: 'class BlockStored(KVCacheEvent):'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.kv-events.block-removed
  value: 2
  unit: fields
  text: SGLang's BlockRemoved has 2 fields, block_hashes and the optional medium. AllBlocksCleared has none.
