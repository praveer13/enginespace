  ttlDays: 90
  pin: sglang

- id: sglang.kv-events.adapter-field
  value: lora_name, cache_salt
  text: The adapter is part of SGLang's event shape. The adapter's public name rides in lora_name, and the published block hashes are opaque ids that are scoped to the internal cache namespace, which includes the adapter load. A request's cache_salt is published too, so a consumer indexes the emitted hashes and does not recompute them.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/disaggregation/kv_events.py#L286-L295
    title: SGLang v0.5.23, srt/disaggregation/kv_events.py, BlockStored
    quote: 'Public adapter name for router lookup. Published hashes are opaque IDs'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.kv-events.lora-ids-since
  value: v0.5.23
  text: SGLang v0.5.23 began to publish opaque LoRA block ids and adapter names in its KV events (pull request 42817), so an event consumer written for an earlier release gets no adapter name.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/releases/tag/v0.5.23
    title: SGLang v0.5.23 release notes
    quote: '[KV events] Publish opaque LoRA block IDs and adapter names: #42817'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 365
  pin: sglang

- id: sglang.kv-events.publisher-defaults
  value: tcp://*:5557
  text: SGLang's KV event publisher is null by default. With zmq it binds tcp://*:5557, keeps the last 10,000 batches for replay, and has a high-water mark of 100,000, the same numbers as vLLM's. A replay endpoint lets a consumer re-fetch batches it missed.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/disaggregation/kv_events.py#L684-L712
    title: SGLang v0.5.23, srt/disaggregation/kv_events.py, KVEventsConfig
    quote: 'endpoint: str = "tcp://*:5557"'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.kv-events.dynamo-format
  value: dynamo
  text: The format option is default or dynamo. The dynamo format is the one the Dynamo KV router reads, where block hashes also depend on extra_key and cache_salt and BlockStored has lora_name.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/disaggregation/kv_events.py#L723-L727
    title: SGLang v0.5.23, srt/disaggregation/kv_events.py, KVEventsConfig.format
    quote: '"dynamo" is the format the Dynamo KV router reads:'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

# --- The radix cache -----------------------------------------------------------------------------------------------------------------

- id: sglang.radix.rust-core-default
  value: rust
  text: The radix tree's core is the Rust one by default at v0.5.23, selected by SGLANG_UNIFIED_RADIX_TREE_CORE_BACKEND, and the Python core remains a switch away.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/srt/environ.py#L741
    title: SGLang v0.5.23, srt/environ.py, SGLANG_UNIFIED_RADIX_TREE_CORE_BACKEND
    quote: 'SGLANG_UNIFIED_RADIX_TREE_CORE_BACKEND = EnvStr("rust")'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.radix.rust-core-fallback
  value: conditional
  text: The Rust core is conditional. The registry falls back to Python for session-aware caching, for unsupported components, for custom component overrides, on non-Linux platforms, for PyTorch outside 2.11 to 2.14, on devices other than CPU and CUDA, and when the extension or its toolchain is missing. A trace may therefore come from the Python core.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/rust/sglang-radix-tree/README.md#L7-L19
    title: SGLang v0.5.23, rust/sglang-radix-tree/README.md (Usage)
    quote: 'Rust is the default tree core.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.radix.unified-cache
  value: Full, SWA and Mamba on one tree
  text: The Rust core serves the Unified Radix Cache, one tree that covers full attention, sliding-window attention and Mamba components. It implements the tree side only, match and insert walks, the node arena, locks and eviction walks, and Python keeps the physical KV allocation.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/rust/sglang-radix-tree/README.md#L3
    title: SGLang v0.5.23, rust/sglang-radix-tree/README.md
    quote: 'Rust tree core for the Unified Radix Cache, covering Full attention, sliding window attention, and Mamba components.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.radix.legacy-classes-removed
  value: removed in v0.5.21
  text: SGLang v0.5.21 removed the legacy radix cache classes. Code that imports SWARadixCache, MambaRadixCache or HiRadixCache has to move to UnifiedRadixCache, and the experimental C++ radix tree is gone.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/releases/tag/v0.5.21
    title: SGLang v0.5.21 release notes
    quote: 'Legacy radix cache implementations are removed.'
