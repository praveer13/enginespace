# SGLang at the pin: the benchmark client bench_serving, its defaults and its traps (W1-T01; TR8, W1-T32).
#
# TR8's broken-benchmark corpus cites the real tool for each flaw: a rate of infinity, a capped closed loop, a warm-up that is one request, and
# a run that ignores EOS. Read on 2026-11-04 at v0.5.23 (commit 297e54fd105e974cdf401e5b4d20253a22c16f90), in python/sglang/benchmark/serving.py.

- id: sglang.bench.request-rate-default
  value: inf
  text: bench_serving defaults --request-rate to infinity, which sends all the requests at time 0, as vllm bench serve does. A finite rate draws exponential gaps, a Poisson process.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/benchmark/serving.py#L2465-L2471
    title: SGLang v0.5.23, benchmark/serving.py, --request-rate
    quote: 'Otherwise, we use Poisson process to synthesize the request arrival times. Default is inf.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.bench.max-concurrency-semaphore
  value: a semaphore
  text: bench_serving caps concurrency with an asyncio semaphore, so with --max-concurrency set the run is a capped closed loop.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/benchmark/serving.py#L1432
    title: SGLang v0.5.23, benchmark/serving.py, benchmark
    quote: 'semaphore = asyncio.Semaphore(max_concurrency) if max_concurrency else None'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.bench.warmup-default
  value: 1
  unit: requests
  text: bench_serving sends 1 warm-up request by default, and --flush-cache, which flushes the server's cache before the run, is opt-in.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/benchmark/serving.py#L2697-L2712
    title: SGLang v0.5.23, benchmark/serving.py, --warmup-requests
    quote: 'help="Number of warmup requests to run before the benchmark",'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.bench.seed-default
  value: 42
  text: bench_serving seeds its random choices with 42 by default.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/benchmark/serving.py#L2554
    title: SGLang v0.5.23, benchmark/serving.py, --seed
