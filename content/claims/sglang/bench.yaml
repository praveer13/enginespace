- id: sglang.bench.ignore-eos-default
  value: 'true'
  text: bench_serving sends ignore_eos as true unless --disable-ignore-eos is given, so every response runs to its output length, which distorts speculation and structured output.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/benchmark/serving.py#L315-L317
    title: SGLang v0.5.23, benchmark/serving.py
    quote: 'payload["ignore_eos"] = not args.disable_ignore_eos'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

- id: sglang.bench.goodput
  value: every SLO met
  text: A request counts toward bench_serving's goodput only if it succeeds and meets every given SLO. The SLOs are KEY:VALUE pairs in milliseconds, for example --goodput ttft:500 tpot:50.
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/python/sglang/benchmark/serving.py#L2494-L2503
    title: SGLang v0.5.23, benchmark/serving.py, --goodput
    quote: 'counts toward goodput only if it succeeds and meets every given SLO.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: sglang

