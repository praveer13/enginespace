    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: mini-sglang

- id: mini-sglang.overlap-loop-order
  value: launch this batch, then process the last one
  text: In Mini-SGLang's overlap_loop the scheduler launches the current batch on the engine's stream first and processes the previous batch's results after it, so the CPU's work on one batch overlaps the GPU's work on the next.
  tag: measured
  source:
    url: https://github.com/sgl-project/mini-sglang/blob/9a91cfafe754aa85daee49998176275667eb58f2/python/minisgl/scheduler/scheduler.py#L83-L106
    title: Mini-SGLang at 9a91cfa, python/minisgl/scheduler/scheduler.py, Scheduler.overlap_loop
    quote: 'It will overlap the execution of current batch and processing of last batch''s results,'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: mini-sglang

