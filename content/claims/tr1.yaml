- id: mini-sglang.copy-event
  value: a non-blocking copy and an event
  text: Mini-SGLang's Engine.forward_batch samples on the GPU, copies the sampled token ids to the host with a non-blocking .to("cpu"), records an event on its stream, and returns the GPU tensor, the host tensor and the event together. It reads nothing from the host tensor.
  tag: measured
  source:
    url: https://github.com/sgl-project/mini-sglang/blob/9a91cfafe754aa85daee49998176275667eb58f2/python/minisgl/engine/engine.py#L202-L206
