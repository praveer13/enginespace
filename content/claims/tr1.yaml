- id: vllm.scheduler.finish-requests
  value: status set, request freed
  text: Scheduler.finish_requests takes request ids and a finished status such as FINISHED_ABORTED. It skips an id that is unknown or already finished, takes each other request out of the running list or the waiting queues, sets the status and frees the request. Its docstring gives the API server's abort of a disconnected client as its example.
  tag: measured
  source:
