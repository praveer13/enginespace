# The hardware atlas, Ada Lovelace: the RTX 4090, the L4 and the L40S (W2-T09; ARCHITECTURE §8.5 rule 9, ASSESSMENT §6.4). What each GPU can do, as NVIDIA states it: the name it is listed under,
# its memory capacity and bandwidth, and its peak rates by precision. The physics floors of the receipt check read them, keyed by the GPU name that the fingerprint reports.
# content/claims/README.md, "The hardware atlas", says how an id is built, which units the claims use, and how a dense peak is told from a sparse one.
#
# Every number was read on 2026-11-09 from the document its source names, with the generic User-Agent "Mozilla/5.0 (X11; Linux x86_64)" and no other header that names anyone.
# Each download went into a folder of its own and was read as text, never run: a PDF through pdftotext and a page through an HTML parser. The pieces of every quote were found,
# in order, in that text before the claim was written. A TTL of 365 days is a design parameter [estimated]: the figures of a shipped GPU do not move, but a vendor can revise a page.
#
# The documents of this file, with the size and the SHA-256 of the copy that was read on 2026-11-09:
#   - NVIDIA Linux x86_64 driver 580.196.07 README
#     https://download.nvidia.com/XFree86/Linux-x86_64/580.196.07/README/supportedchips.html
#     221357 bytes, SHA-256 9595baedfa021dcfd3c89e16fc85f969c79f60e44064dba02504c921102bc769
#   - NVIDIA L4 Tensor Core GPU datasheet 3408215 (August 2024)
#     https://dam-cdn.nvd.orangelogic.com/AssetLink/8f4cjsr458mk07kxxt608b1ct0t570x7.pdf
#     467982 bytes, SHA-256 63b48f3f686158b1ee7872bac251d6b5875b65a9319454dff8fba378719b2074
#   - NVIDIA L40S GPU page on nvidia.com
#     https://www.nvidia.com/en-us/data-center/l40s/
#     577559 bytes, SHA-256 be4c48d0dd3af1cf28926a97f8e2a23a284460b3139fb97d0dad51299d64538b
#   - NVIDIA Ada GPU Architecture whitepaper, V2.02
#     https://images.nvidia.com/aem-dam/Solutions/Data-Center/l4/nvidia-ada-gpu-architecture-whitepaper-V2.02.pdf
#     3856537 bytes, SHA-256 7cbe859bf7e63e16921536042fef24788968667c967529427099e97be0805ed1

