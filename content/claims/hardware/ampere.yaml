# --- A100 40GB SXM (NVIDIA A100-SXM4-40GB) ---------------------------------------------------------------------------------------------------------

- id: hw.a100-40-sxm.product-name
  value: NVIDIA A100-SXM4-40GB
  text: NVIDIA's Linux driver 580.196.07 lists PCI device 20B0 as "NVIDIA A100-SXM4-40GB". It is the A100 with 40 GB of HBM2 on an SXM4 board. The atlas matches the GPU name in a fingerprint to this string. That nvidia-smi and NVML print the same string is not checked here [unverified].
  tag: measured
  source:
    url: https://download.nvidia.com/XFree86/Linux-x86_64/580.196.07/README/supportedchips.html
    title: NVIDIA Linux x86_64 driver 580.196.07 README, Appendix A, Supported NVIDIA GPU Products
    quote: NVIDIA A100-SXM4-40GB | 20B0
    accessed: 2026-11-09
  verifiedAt: 2026-11-09
  ttlDays: 365

- id: hw.a100-40-sxm.mem-capacity
  value: 40
  unit: GB
  text: NVIDIA's Ampere whitepaper lists 40 GB of HBM2 memory for the A100 40GB SXM.
  tag: measured
