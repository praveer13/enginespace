# --- H100 SXM (NVIDIA H100 80GB HBM3) --------------------------------------------------------------------------------------------------------------

- id: hw.h100-sxm.product-name
  value: NVIDIA H100 80GB HBM3
  text: NVIDIA's Linux driver 580.196.07 lists PCI device 2330 as "NVIDIA H100 80GB HBM3". The name carries HBM3, the memory of the H100 SXM; the PCIe card has HBM2e and is listed as "NVIDIA H100 PCIe" (device 2331). The atlas matches the GPU name in a fingerprint to this string. That nvidia-smi and NVML print the same string is not checked here [unverified].
  tag: measured
  source:
    url: https://download.nvidia.com/XFree86/Linux-x86_64/580.196.07/README/supportedchips.html
    title: NVIDIA Linux x86_64 driver 580.196.07 README, Appendix A, Supported NVIDIA GPU Products
    quote: NVIDIA H100 80GB HBM3 | 2330 10DE 16C0
    accessed: 2026-11-09
  verifiedAt: 2026-11-09
  ttlDays: 365

- id: hw.h100-sxm.mem-capacity
