  text: NVIDIA's Linux driver 580.196.07 lists PCI device 2331 as "NVIDIA H100 PCIe". The card has HBM2e; the HBM3 module is listed as "NVIDIA H100 80GB HBM3" (device 2330). The atlas matches the GPU name in a fingerprint to this string. That nvidia-smi and NVML print the same string is not checked here [unverified].
  tag: measured
  source:
    url: https://download.nvidia.com/XFree86/Linux-x86_64/580.196.07/README/supportedchips.html
