# --- NVIDIA GeForce RTX 5090 -----------------------------------------------------------------------------------------------------------------------

- id: hw.rtx5090.product-name
  value: NVIDIA GeForce RTX 5090
  text: NVIDIA's Linux driver 580.196.07 lists PCI device 2B85 as "NVIDIA GeForce RTX 5090". The RTX 5090 D and D v2 are listed apart (devices 2B87 and 2B8C). The atlas matches the GPU name in a fingerprint to this string. That nvidia-smi and NVML print the same string is not checked here [unverified].
  tag: measured
  source:
    url: https://download.nvidia.com/XFree86/Linux-x86_64/580.196.07/README/supportedchips.html
    title: NVIDIA Linux x86_64 driver 580.196.07 README, Appendix A, Supported NVIDIA GPU Products
    quote: NVIDIA GeForce RTX 5090 | 2B85
    accessed: 2026-11-09
  verifiedAt: 2026-11-09
  ttlDays: 365

