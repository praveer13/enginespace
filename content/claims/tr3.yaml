- id: nsys.paranoid-2-gaps
  value: 'gaps at level 2'
  text: 'At paranoid level 2, samples are not collected while the workload runs kernel-mode code during a system call, so the CPU sampling has gaps.'
  tag: measured
  source:
    url: https://archive.docs.nvidia.com/nsight-systems/2026.5/UserGuide/index.html
    title: 'Nsight Systems 2026.5 User Guide (archived)'
    quote: 'The paranoid level is set to 2. If the paranoid level is set to 2, anytime the workload makes a system call and spends time executing kernel mode code, samples will not be collected and there will be gaps in the sampling data.'
    accessed: 2026-11-23
  verifiedAt: 2026-11-23
  ttlDays: 90
  pin: nsys

