    quote: 'The profiler will skip the first ``skip_first`` steps, then wait for ``wait`` steps, then do the warmup for the next ``warmup`` steps, then do the active recording for the next ``active`` steps'
    accessed: 2026-11-23
  verifiedAt: 2026-11-23
  ttlDays: 365
  pin: torch

