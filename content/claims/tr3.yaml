# What TR3's six lessons, its game (Trace attribution) and its item families cite beyond the files above: how vLLM and SGLang switch a profiler on, what the
# capture window holds, what the torch profiler's schedule and step ranges are, what the two engines name a profiled step, how Nsight Systems traces a CUDA graph
# and what it needs from the host, how Perfetto reads a Chrome JSON trace, which driver the pinned vLLM's CUDA 13 wheels need, and what one program of the small
# Triton kernels around the forward covers. An id starts with the thing it describes (`vllm`, `sglang`, `torch`, `nsys`, `perfetto`).
#
# THE PLAN (written before the sources were read, kept as the first comment of the file)
#   1. Read, as raw files at the pins, never at main: of vLLM at 4ba787ec (v0.33.0) `docs/contributing/profiling.md`, `vllm/config/profiler.py`, the two files that build
#      and run the profiled step (`vllm/v1/worker/gpu_worker.py`, `vllm/profiler/wrapper.py`), the install document `docs/getting_started/installation/gpu.cuda.inc.md`
#      for the CUDA 13 driver line, and the four Triton files of Model Runner V2 that TR0's lesson 4 links (`sample/gumbel.py`, `buffer_utils.py`, `block_table.py`,
#      `input_batch.py` under `vllm/v1/worker/gpu/`); of SGLang at 297e54fd (v0.5.23) `docs/docs/developer_guide/benchmark_and_profiling.mdx`; of PyTorch at v2.14.0
#      the file whose docstrings are the profiler's documentation, `torch/profiler/profiler.py`; of Perfetto at v59.1 `docs/getting-started/other-formats.md`.
#   2. Read as a versioned page: the Nsight Systems 2026.5 User Guide in NVIDIA's archive. Read once, as one page, and turned into text by a script that runs nothing from it.
#   3. Re-cite `mlc-book.gemm-launch-api` (in tr2.yaml) to the book's repository file at a commit, and write no new claim of the book. `verify:claims` refuses any other.
#   4. A fact that was not read stays `unverified` and is listed below, and no lesson, rule table, sim or check may rest on it.
#
# HOW IT WAS READ. On 2026-11-23, with the generic User-Agent "Mozilla/5.0 (X11; Linux x86_64)", no token, no cookie and no other header. Each file was downloaded into a folder
# of its own, read as text and never run, and none of it is kept. Every quote below was found, with each run of whitespace read as one space, inside the lines its
# anchor names (a claim of the Nsight Systems guide names no lines, because the guide is one page: its quote was found in the page's text). The lines of an anchor
# are lines of the file at that commit or tag. A command is quoted from the guide and is `measured` only as a statement of the guide: the course has run none of them.
#
# WHAT WAS NOT FOUND, AND WHAT WAS NOT READ
#   - The "Queue Dur" column. The Nsight Systems 2026.5 User Guide holds no report named `cuda_kern_exec_trace`, no column "Queue Dur" and no word "kern_exec" (the page
#     was searched for each). Its `nsys stats` section lists other reports. So no claim of that column is written, and the design's sentence about it is dropped. The
#     Analysis Guide, a separate document of the same version, was not read.
#   - The trace's event names at the pin are `unverified` (`vllm.profiling.trace-event-names`): the course has no capture of the pinned engine. What the code names a
#     range, and what the docs print as a label, are claims; that a trace file holds that name on that track is not.
#   - SGLang's `python/sglang/profiler.py`, and so that the command writes `server_args.json` beside the traces, was not read: the guide does not mention the file.
#   - Modal's page for the GPU name `H100!`, a provider's page with no version, was not read in this task. No claim rests on it.
#   - The Nsight Systems pin is 2026.5.1 and the archived guide is headed v2026.5. The package's own copy of the guide was not read, so a difference between 2026.5
#     and 2026.5.1 is not excluded.
#   - PyTorch's `docs/source/profiler.md` at v2.14.0 holds only automodule and autoclass directives. The documents are made from the docstrings of
#     `torch/profiler/profiler.py`, which is why the `torch.profiler.*` claims read that file.
#   - The install document of the pinned vLLM disagrees with its own release notes: it still says the binaries are compiled with CUDA 12.9 by default
#     (`vllm.install.doc-default-cuda`), where the notes say CUDA 13.0 only (`vllm.release.cuda-13-only`). The driver line is taken from the document (`vllm.install.cuda13-driver`).
#   - The vLLM guide's flush time of about 10 minutes (`vllm.profiling.flush-time`) is `unverified`: nobody reproduced it.
#
# The Triton claims say what one program covers, as the code names it, and never what it costs: a program's cost is a measurement that this file does not hold.



