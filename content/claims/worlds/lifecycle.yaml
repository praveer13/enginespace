# --- PyTorch 2.14, the version the pinned engines require -------------------------------------------------------------------------------

- id: lifecycle.torch.copy-synchronizes
  value: a copy between the CPU and the GPU synchronizes
  text: PyTorch performs the synchronization that a copy between the CPU and the GPU needs, when the current stream is the default one. A blocking copy of a CUDA tensor to the host, such as .tolist(), therefore returns once the data is there, and it is an implicit wait for the GPU work before it.
  tag: measured
  source:
    url: https://docs.pytorch.org/docs/2.14/notes/cuda.html#asynchronous-execution
    title: PyTorch 2.14 documentation, CUDA semantics, Asynchronous execution
    quote: 'PyTorch automatically performs necessary synchronization when copying data between CPU and GPU or between two GPUs.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 365

