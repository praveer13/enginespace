# --- vLLM at 42172ad (Inside vLLM) ------------------------------------------------------------------------------------------------------

- id: inside-vllm.abort-input-queue
  value: the input queue
  text: At the commit the post reads, EngineCoreProc._handle_client_request handles an ABORT request in the same dispatch as an ADD, so an abort reaches the busy loop on the same input queue as a new request, behind the requests before it. Searching the file for aborts_queue finds nothing, where the pinned engine has a queue of its own for aborts.
  tag: measured
