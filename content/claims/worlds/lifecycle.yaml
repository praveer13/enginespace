# What the lifecycle card cites beyond the claims of the engines' own files: how the small engines and the pinned ones put a tensor-parallel
# rank in another process, how an abort reaches a running request, and what an `n` of two does (W1-T16; ARCHITECTURE §4.4, §5.8, §5.9).
# Each fact was read on 2026-11-04 from the file its URL names, at the tag or the commit the URL names (course.lock.json: vllm, sglang,
# nano-vllm, mini-sglang, inside-vllm), and each quote is that file's own text on the lines the anchor names. The unpacked tarballs, checked
# against the pinned commit with `git get-tar-commit-id`, are what tests/sim/lifecycle-sources.test.ts reads the model's stages against.
# A fact that belongs to a pin is re-read at the quarterly re-pin, so its TTL is 90 days. PyTorch's documentation of a released version
# does not change, and keeps a year.

# --- nano-vllm (commit bb823b3e06983d71485a8e1f23715ebd87d98ef8) -----------------------------------------------------------------------

- id: nano-vllm.tp-worker-process
  value: one process for each rank above 0
  text: With tensor_parallel_size above 1, nano-vllm's LLMEngine starts a process for each rank above 0, which runs a ModelRunner, and gives each an Event. Rank 0's ModelRunner stays in the caller's process, so the first tensor-parallel level of The Engine Floor has a second process.
  tag: measured
  source:
    url: https://github.com/GeeeekExplorer/nano-vllm/blob/bb823b3e06983d71485a8e1f23715ebd87d98ef8/nanovllm/engine/llm_engine.py#L25-L31
    title: nano-vllm at bb823b3, nanovllm/engine/llm_engine.py, LLMEngine.__init__
    quote: 'process = ctx.Process(target=ModelRunner, args=(config, i, event))'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: nano-vllm

- id: nano-vllm.tp-shared-memory
  value: a shared-memory buffer and an Event
  text: Rank 0's ModelRunner hands each call to the other ranks through a shared-memory buffer named nanovllm. It pickles the method name and its arguments into the buffer and sets an Event for each worker, and a worker's loop waits on its Event and runs the call it reads.
  tag: measured
  source:
    url: https://github.com/GeeeekExplorer/nano-vllm/blob/bb823b3e06983d71485a8e1f23715ebd87d98ef8/nanovllm/engine/model_runner.py#L61-L83
