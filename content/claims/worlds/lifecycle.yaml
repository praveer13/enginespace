- id: sglang.abort.running-request
  value: to_finish, one more forward
  text: An abort that reaches SGLang's scheduler while a request is running does not free it at once. The scheduler sets the request's to_finish, the request runs one more forward pass, and the existing finishing code then cleans up its KV allocation.
