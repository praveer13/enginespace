# What the notional-machine cards cite beyond the engines: two papers, a statement of Little's law and a trace-viewer format (W1-T07;
# ARCHITECTURE §4.4, §5.9). Each quote is the source's own words, read on 2026-11-04 from the page its URL names. A paper does not move,
# so its TTL is 365 days, as is the TTL of a theorem such as Little's law; a documentation page can move, and keeps the 90 days of a version.

- id: spec.paper.accept-or-resample
  value: 'min(1, p/q), then norm(max(0, p - q))'
  text: In speculative sampling a token x drawn from the draft distribution q is kept when q(x) is at most p(x), and otherwise rejected with probability 1 - p(x)/q(x). A rejected token is replaced by one drawn from the adjusted distribution norm(max(0, p(x) - q(x))), and the output is distributed as p.
  tag: measured
  source:
    url: https://arxiv.org/html/2211.17192v2
    title: Leviathan, Kalman and Matias, Fast Inference from Transformers via Speculative Decoding, arXiv 2211.17192v2, section 2.3 (the fraction is typeset stacked on the page)
    quote: 'To sample x ∼ p(x), we instead sample x ∼ q(x), keeping it if q(x) ≤ p(x), and in case q(x) > p(x) we reject the sample with probability 1 − p(x)/q(x) and sample x again from an adjusted distribution p′(x) = norm(max(0, p(x) − q(x))) instead.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 365

- id: spec.paper.bonus-token
  value: one more token when every draft is accepted
  text: A round of speculative decoding ends with a token from an adjusted distribution that replaces the first rejected draft, or with one extra token when every draft is accepted. So each run of the target model yields at least one new token.
  tag: measured
  source:
    url: https://arxiv.org/html/2211.17192v2
    title: Leviathan, Kalman and Matias, Fast Inference from Transformers via Speculative Decoding, arXiv 2211.17192v2, section 2.1
    quote: '(3) sampling an additional token from an adjusted distribution to fix the first one that was rejected, or to add an additional one if they are all accepted.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 365

- id: spec.paper.expected-tokens
  value: '(1 - alpha^(gamma+1)) / (1 - alpha)'
  text: With the same acceptance rate alpha for every draft and gamma drafts per round, a round yields a capped geometric number of tokens, with success probability 1 - alpha and cap gamma + 1, and the expected number is (1 - alpha^(gamma+1)) / (1 - alpha).
  tag: measured
  source:
    url: https://arxiv.org/html/2211.17192v2
    title: Leviathan, Kalman and Matias, Fast Inference from Transformers via Speculative Decoding, arXiv 2211.17192v2, section 3.1 and equation 1
    quote: 'the number of tokens produced by a single run of Algorithm 1 is a capped geometric variable, with success probability 1−α and cap γ+1, and the expected number of tokens generated by Algorithm 1 satisfies Equation 1.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 365

- id: kv.slora.unified-paging
  value: Unified Paging
  text: S-LoRA keeps adapter weights and KV cache tensors in one unified memory pool, which its authors call Unified Paging. The pool holds adapters of different ranks and KV tensors of varying sequence lengths.
  tag: measured
  source:
    url: https://arxiv.org/abs/2311.03285v3
    title: Sheng et al., S-LoRA, Serving Thousands of Concurrent LoRA Adapters, arXiv 2311.03285v3, abstract
    quote: 'Unified Paging uses a unified memory pool to manage dynamic adapter weights with different ranks and KV cache tensors with varying sequence lengths.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 365

- id: bench.littles-law
  value: L = lambda * W
  text: Little's law says the long-term average number of customers in a stationary system equals their long-term average arrival rate times the average time each spends in the system. For a benchmark, mean concurrency equals throughput times mean latency on a stable run.
  tag: measured
  source:
    url: https://en.wikipedia.org/wiki/Little%27s_law
    title: Little's law, Wikipedia (the proof is J. D. C. Little, Operations Research 9(3), 1961)
    quote: 'a theorem by John Little which states that the long-term average number of customers (L) in a stationary system is equal to the long-term average effective arrival rate (λ) multiplied by the average time that a customer spends in the system (W).'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 365

