# The rented-GPU runners (W2-T11; ARCHITECTURE section 9.3): the image tags that the four engine Dockerfiles start from, and what the runner documents rely on at RunPod,
# Lambda and Modal. Read on 2026-11-15.
#
# Every request sent the User-Agent `Mozilla/5.0 (X11; Linux x86_64)` with no cookie, no login and no other header that names anyone, and no call used the `gh` CLI.
# Docker Hub's JSON API answered the four tag questions (`hub.docker.com/v2/repositories/<namespace>/<repository>/tags/<tag>`), and each answer was saved to a folder of its
# own and read as text. The pages of RunPod, Lambda and Modal were saved the same way and read with their markup stripped. The modal 1.6.4 wheel was checked against the
# SHA-256 that PyPI lists for it and read as text, never run, to see the signatures that modal_app.py calls; nothing was installed and no Modal account was used.
#
# A Docker Hub tag is a moving label unless a digest is pinned, and the Dockerfiles pin none (the lock holds the Python packages that run, ARCHITECTURE section 9.3), so each tag
# claim records the digest that the tag pointed at on the day, and a re-read that finds another digest is a change card for the pin. The Python tag moves with its patch releases.
# No claim here is about a price: the runner documents state none, because a price that was not read from the vendor's page that day would be invented.

