- id: runners.runpod.no-docker-in-pod
  value: no Docker inside a pod
  text: RunPod runs the Docker engine for the pod, so a pod cannot build an image from a Dockerfile or run one of its own. The pod's image has to be one that RunPod can pull, and the environment's setup runs inside it.
  tag: measured
  source:
    url: https://docs.runpod.io/pods/overview
    title: Runpod documentation, Pods overview, Limitations
    quote: 'Runpod runs Docker for you, so you cannot spin up your own Docker instance or use Docker Compose on Pods.'
    accessed: 2026-11-15
  verifiedAt: 2026-11-15
  ttlDays: 90

- id: runners.runpod.custom-template-ssh
  value: TCP port 22 and an SSH daemon
  text: For a pod from a custom template, RunPod's page on SSH says to expose TCP port 22 and to run an SSH daemon inside the pod, and gives a start command for it that ends in sleep infinity. Full SSH, which scp needs, wants a pod with a public IP address. Its official templates, such as Runpod PyTorch, have this set up.
  tag: measured
  source:
    url: https://docs.runpod.io/pods/configuration/use-ssh
    title: Runpod documentation, Connect to a Pod with SSH
    quote: 'ensure that TCP port 22 is exposed and that the SSH daemon is running inside your Pod.'
    accessed: 2026-11-15
  verifiedAt: 2026-11-15
  ttlDays: 90

