  value: 1.6.4
  text: The newest release of the modal package on PyPI on 2026-11-15 was 1.6.4, uploaded on 2026-11-12. Its Image.from_dockerfile takes a context_dir, Image.add_local_dir takes copy and ignore, and App.function takes gpu, timeout and volumes, which is what modal_app.py calls. The runner document names this version, and a newer one is the learner's to try.
