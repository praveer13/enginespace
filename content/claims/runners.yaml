- id: runners.modal.from-dockerfile
  value: Image.from_dockerfile
  text: Modal builds an image from a local Dockerfile through Image.from_dockerfile, with its own implementation of the Dockerfile specification and not Docker, and the image can be extended with the image builder's methods. modal_app.py builds each environment's Dockerfile this way, with the kit as the context.
  tag: measured
  source:
    url: https://modal.com/docs/guide/existing-images
    title: Modal documentation, Images, using existing images
    quote: 'You can define an Image from an existing Dockerfile by passing its path to'
    accessed: 2026-11-15
  verifiedAt: 2026-11-15
  ttlDays: 90

