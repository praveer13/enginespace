# The real-world instance of each flaw in the broken-benchmark corpus (W1-T32; GAMES.md §11, ARCHITECTURE §5.6): what a debrief cites when it names a flaw.
# Each quote is the source's own words, read on 2026-11-04 with the generic User-Agent "Mozilla/5.0 (X11; Linux x86_64)" from the file its URL names, at the tag or commit
# the URL names: vLLM v0.33.0 and SGLang v0.5.23 (the proposed pins, D-035), wrk2 at 44a94c1, kernelspace at d478f91, and a paper. A #L anchor says which lines hold
# the quote, and a quote that runs over several lines is written on one. Facts about an engine's tool belong to a pin and are re-read at the quarterly re-pin, so their TTL is
# 90 days; a paper, and a README at a commit, do not move, so theirs is 365 [estimated]. A quote of a Python help string is the string as the tool prints it:
# the source writes it as adjacent literals. The control case has no flaw and no claim.

- id: broken-bench.closed-loop.vllm-request-rate-default
  value: 'inf'
  unit: requests per second
  text: 'In `vllm bench serve` the default of `--request-rate` is infinity, and its help says that with an infinite rate all the requests are sent at time 0. Only a finite rate makes the tool draw Poisson or gamma arrival times.'
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/benchmarks/serve.py#L1746-L1753
    title: 'vLLM v0.33.0, vllm/benchmarks/serve.py, the --request-rate argument'
    quote: 'Number of requests per second. If this is inf, then all the requests are sent at time 0. Otherwise, we use Poisson process or gamma distribution to synthesize the request arrival times.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: broken-bench.closed-loop.vllm-max-throughput-pattern
  value: '--request-rate=inf with --max-concurrency set'
  text: 'vLLM''s benchmarking guide calls an infinite request rate with a limit on concurrency, `--request-rate=inf --max-concurrency=N`, the most commonly used configuration for production benchmarking. It describes users who send as fast as they can, behind a gateway that holds the concurrent connections at the limit.'
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/benchmarking/cli.md#L805-L810
    title: 'vLLM v0.33.0, docs/benchmarking/cli.md, load patterns (the pattern and its limit)'
    quote: 'is the most commonly used configuration for production benchmarking.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: broken-bench.closed-loop.vllm-rate-below-requested
  value: 'the actual request rate may be lower than specified'
  text: 'In `vllm bench serve`, `--max-concurrency` limits how many requests run at once, and the tool''s own help says that used with `--request-rate` the actual request rate may be lower than specified if the server is not processing requests fast enough to keep up.'
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/benchmarks/serve.py#L1679-L1689
    title: 'vLLM v0.33.0, vllm/benchmarks/serve.py, the --max-concurrency argument'
    quote: 'This means that when used in combination, the actual request rate may be lower than specified with --request-rate, if the server is not processing requests fast enough to keep up.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: broken-bench.closed-loop.schroeder-definition
  value: 'new arrivals are triggered only by completions'
  text: 'Schroeder, Wierman and Harchol-Balter separate two kinds of workload generator. In a closed system model new job arrivals are triggered only by job completions, followed by think time, and in an open system model new jobs arrive independently of completions.'
  tag: measured
  source:
    url: https://www.usenix.org/legacy/event/nsdi06/tech/schroeder.html
    title: 'Schroeder, Wierman and Harchol-Balter, Open Versus Closed: A Cautionary Tale, NSDI 2006, abstract'
    quote: 'Workload generators may be classified as based on a closed system model, where new job arrivals are only triggered by job completions (followed by think time), or an open system model, where new jobs arrive independently of job completions.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 365

- id: broken-bench.coordinated-omission.wrk2-from-should-have
  value: 'latency from when the request should have been sent'
  text: 'wrk2 measures a request''s latency from the time its transmission should have occurred under the constant throughput set for the run, and not from the time it was actually sent. Its author built it that way to avoid what he calls coordinated omission.'
  tag: measured
  source:
    url: https://github.com/giltene/wrk2/blob/44a94c17d8e6a0bac8559b53da76848e430cb7a7/README.md#L326-L331
    title: 'wrk2 README (giltene/wrk2 at 44a94c1), the model chosen for avoiding Coordinated Omission'
    quote: 'Rather than measure response latency from the time that the actual transmission of a request occurred, wrk2 measures response latency from the time the transmission *should* have occurred according to the constant throughput configured for the run.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 365

