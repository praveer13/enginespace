- id: broken-bench.client-queue-hidden.vllm-semaphore-start-time
  value: 'client_queue_time'
  text: 'In `vllm bench serve` a request waits for the concurrency semaphore before its request function runs, and the start time kept for it is the time it was sent. The wait for the semaphore is recorded apart, as `client_queue_time`.'
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/benchmarks/serve.py#L1001-L1017
    title: 'vLLM v0.33.0, vllm/benchmarks/serve.py, limited_request_func'
    quote: '# Preserve start_time as the time the request was sent. It is used by # throughput calculations; record client-side semaphore delay separately.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

