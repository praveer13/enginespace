- id: bench.kernelspace.warm-up-rule
  value: 'warm up, then measure a steady-state window'
  text: 'kernelspace''s T7.L2 teaches that a benchmark that includes the first minutes measures the cold start and not the system: warm until the first-token p50 stabilizes, then measure a steady-state window and report it.'
  tag: measured
  source:
    url: https://github.com/praveer13/kernelspace/blob/d478f91a0af590f03fcfd76ee73149fa70b28e51/public/lessons-md/t7.l2.md#L16
    title: 'kernelspace T7.L2, Benchmarking Methodology, rule 2 (at d478f91)'
    quote: 'A benchmark that includes the first minutes measures the cold start, not the system.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 365

- id: bench.kernelspace.samples-rule
  value: 'a p99 needs samples'
  text: 'kernelspace''s T7.L2 teaches that percentiles need samples: a p99 computed from 20 requests is astrology, and each step of a sweep should hold hundreds of requests.'
