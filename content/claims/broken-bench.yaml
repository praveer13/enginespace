- id: vllm.bench.self-timed-default
  value: 'False except for timed_trace'
  text: 'In `vllm bench serve` the trace''s own timing is used only with `--self-timed`, which defaults to False except for `--dataset-name=timed_trace`. When it is off, the user''s generation rates are used and the timing in the trace is ignored.'
  tag: measured
  source:
