- id: sglang.bench.rust-client-sets-throughput
  value: 'the client, not the server, sets the measured throughput'
  text: 'The README of SGLang''s Rust benchmark client says that its Python predecessor drives every request and parses every response on one asyncio thread, and that past some request count the client, not the server, sets the measured throughput, so that the benchmark reports the client''s limit.'
  tag: measured
  source:
    url: https://github.com/sgl-project/sglang/blob/v0.5.23/rust/sglang-bench/README.md#L9-L11
    title: 'SGLang v0.5.23, rust/sglang-bench/README.md, Why'
