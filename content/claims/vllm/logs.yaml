# vLLM at the pin: what the engine prints and where, which the grader reads the effective engine configuration from (W2-T03; ARCHITECTURE section 9.5, ASSESSMENT section 5.6).
#
# Every claim here was read on 2026-11-09 from the file the source URL names, at the tag the URL names, in the tag's source tarball, as text. Nothing in the tarball
# was run. The pin is v0.33.0, the commit 4ba787ec9959e566d3b587a796dff07673324da5 (course.lock.json, key vllm), which `git get-tar-commit-id` read from the tarball,
# and the tarball's SHA-256 is 2540b44ac130699997ccc2c7cf57ae3ceae43348643d0603330b01458b111a09, the same as W1-T01's copy. A quote is the source's own text from one
# line, and a #L anchor says which lines hold it. In the text of a log line, a word in capitals, such as MODE or N, stands for what the engine fills in. labs/grader/src/enginespace_grader/engine_config.py reads exactly these lines of a log, so a re-pin that moves one of
# them moves the reading: read these claims again first, and run the grader's tests on a log of the new pin.
#
# Two things are absences, and say where the search looked: that no INFO line says async scheduling is on (vllm.log.async-scheduling-silent) and that the config
# line holds none of the scheduler's limits (vllm.log.config-line-no-scheduler-limits).


