- id: vllm.hybrid-kv.layer-spread
  value: layers[i::num_groups]
  text: The layers of one type are spread over its groups, with group i taking every num_groups-th layer from layer i. A type whose layers do not divide evenly therefore gets groups that differ by one layer, and the padding is spread over the groups with them. The design document draws the padding in the last group.
  tag: measured
