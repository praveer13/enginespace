- id: vllm.kv-pool.duplicate-keys
  value: not de-duplicated
  text: The block pool does not de-duplicate cached blocks. When a block becomes full it is cached without a check for an identical block already in the cache, so that allocated block ids never change and block tables stay append-only. Two requests that compute the same block leave two cached copies under one key.
  tag: measured
  source:
