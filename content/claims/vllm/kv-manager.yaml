# vLLM at the pin: the rules of the block pool and the hybrid KV manager that the model in packages/sim/kv follows (W1-T21; ARCHITECTURE §5.4,
# D-045). W1-T01's kv.yaml holds the facts about the hybrid groups, the adapters and the shape of the events; these are the rules under them
# that the model needs and that no claim held: the order of the free queue, how a window lets go of blocks, how a hit is found for each
# kind of group, how the layers are grouped and padded, and what an event carries. Each was read on 2026-11-04 from the file its URL names
# at v0.33.0 (commit 4ba787ec9959e566d3b587a796dff07673324da5), downloaded from raw.githubusercontent.com with the User-Agent
# `Mozilla/5.0 (X11; Linux x86_64)` and read as text. Every quote is found verbatim inside the lines of its anchor, and a quote is one
# line of the source, because a source that splits a string across lines is quoted from one of its lines.

# --- The free queue ------------------------------------------------------------------------------------------------------------------

- id: vllm.kv-pool.free-order
  value: unhashed to the front, hashed to the back
  text: When the last holder of a block lets go, the pool puts a block with no hash at the front of the free queue, where it is reused first, and a block with a hash at the back, so that cached blocks leave in least-recently-used order. The blocks go in the order the caller gives.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/block_pool.py#L816-L849
    title: vLLM v0.33.0, vllm/v1/core/block_pool.py, BlockPool.free_blocks
    quote: 'FIFO reuse of cached blocks for LRU eviction behavior.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.kv-pool.free-reverse
  value: last block first
  text: A request's blocks are freed in reverse order, so that the tail blocks go back first and, among blocks with hashes, are evicted before the head of the same prefix.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/single_type_kv_cache_manager.py#L591-L599
    title: vLLM v0.33.0, vllm/v1/core/single_type_kv_cache_manager.py, SingleTypeKVCacheManager.free
    quote: 'Free blocks in reverse order so that the tail blocks are freed first.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.kv-pool.allocate-from-front
