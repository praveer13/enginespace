# --- The window, and the hit of each kind of group -----------------------------------------------------------------------------------

- id: vllm.hybrid-kv.sliding-skipped-tokens
  value: max(0, computed - window + 1)
  text: A sliding-window group skips the tokens before max(0, computed tokens - window + 1), which the next token no longer attends to. The manager frees the whole blocks among them, the number of skipped tokens divided by the block size and rounded down.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/single_type_kv_cache_manager.py#L1148-L1183
    title: vLLM v0.33.0, vllm/v1/core/single_type_kv_cache_manager.py, SlidingWindowManager.get_num_skipped_tokens
    quote: 'num_computed_tokens - self.sliding_window + 1 - self.extra_retained_tokens'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.hybrid-kv.sliding-hit-blocks
  value: ceil((window - 1) / block size)
  text: A prefix hit in a sliding-window group needs the blocks that the window covers before the edge of the hit, which are the ceiling of (window - 1) divided by the block size of them in a row.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/single_type_kv_cache_manager.py#L956-L966
    title: vLLM v0.33.0, vllm/v1/core/single_type_kv_cache_manager.py, SlidingWindowManager._contiguous_blocks_for_hit
    quote: 'blocks = cdiv(window_size - 1, block_size)'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

