# vLLM at the pin: the release itself and what it needs from the host (W1-T01; D-035, O-4).
#
# course.lock.json (key vllm) pins v0.33.0 at the commit 4ba787ec9959e566d3b587a796dff07673324da5. These claims are the evidence for D-035's
# driver gate: the v0.33.0 wheels need CUDA 13.0, which needs a host driver of R580 or newer. The sample claim vllm.release.requires-python
# (tests/fixtures/sample-course/content/claims/sample.yaml) is the Python range of the same release. Read on 2026-11-04.

