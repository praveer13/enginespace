- id: vllm.release.cuda-13-only
  value: CUDA 13.0 only
  text: From v0.33.0 the release wheels and images are built for CUDA 13.0 only. The CUDA 12.9 wheels and the -cu129 images are no longer published, and v0.32.0 was the last minor that had them.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/releases/tag/v0.33.0rc3
    title: vLLM v0.33.0 release notes (kept on the v0.33.0rc3 release; the tag is the v0.33.0 commit)
    quote: 'CUDA 12.9 dropped: release wheels and images are CUDA 13.0 only.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.release.driver-r580
  value: R580
  text: A CUDA 13 image needs an R580 or newer host driver. The compatibility mode for older drivers covers R535 and R570 hosts and only supports select professional and datacenter GPUs, so a GeForce card such as an RTX 4090 should not count on it [estimated].
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/getting_started/installation/gpu.cuda.inc.md#L344-L346
    title: vLLM v0.33.0, docs/getting_started/installation/gpu.cuda.inc.md (older CUDA drivers)
    quote: 'because CUDA 13 requires an R580 or newer driver.'
