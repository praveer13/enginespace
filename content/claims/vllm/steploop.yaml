# --- The scheduler, speculation and the mask -----------------------------------------------------------------------------------------

- id: vllm.scheduler.spec-drafts
  value: a running request carries its drafts
  text: The scheduler gives a running request every token it has that is not computed yet, its drafts included, which is 1 plus its drafts for a request in decode. The count is cut to what is left of the step's token budget, and the drafts are cut with it.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/sched/scheduler.py#L836-L849
    title: vLLM v0.33.0, vllm/v1/core/sched/scheduler.py, Scheduler.schedule
    quote: 'request.num_tokens_with_spec'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.scheduler.spec-pad
  value: a new decode request is padded to 1 + num_spec_tokens
  text: With speculative decoding the scheduler pads a request that is new to the running set and has one token to schedule to 1 plus num_spec_tokens, so that the decode batch stays uniform and keeps a full graph. It prefers to leave such a request out of the step than to schedule it unpadded when the budget is short.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/sched/scheduler.py#L1308-L1330
    title: vLLM v0.33.0, vllm/v1/core/sched/scheduler.py, Scheduler.schedule
    quote: 'padded_num_tokens = 1 + self.num_spec_tokens'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.scheduler.skip-extra-step
  value: no extra step for a length-capped stop
  text: Under async scheduling the scheduler does not schedule another step for a request when the steps in flight are sure to reach its max_tokens, so a stop at the length cap leaves no ghost token. A stop on EOS cannot be known in advance, and the request rides one more step.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/sched/scheduler.py#L799-L813
    title: vLLM v0.33.0, vllm/v1/core/sched/scheduler.py, Scheduler.schedule
    quote: 'Async scheduling: Avoid scheduling an extra step when we are sure that'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.mask.fill-rows-per-request
  value: 1 + num_speculative_tokens rows
  text: The bitmask has a fixed-width block of rows for each structured request, one row for each speculative position and one for the next token. The parallel fill is used only when a step has more structured requests than the threshold and no speculative tokens are configured.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/structured_output/__init__.py#L408-L420
    title: vLLM v0.33.0, vllm/v1/structured_output/__init__.py, StructuredOutputManager.grammar_bitmask
    quote: 'Each request owns a fixed-width block of `mask_stride` rows.'
