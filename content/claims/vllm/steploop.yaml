# vLLM at the pin: the rules that the step-loop model v1 encodes (W1-T12; ARCHITECTURE §5.3, WORLD §2.3 to §2.8, D-041, D-044).
#
# content/claims/vllm/graphs.yaml and engine.yaml hold the facts that W1-T01 read for TR2. These are the ones that W1-T12 needed on top
# of them to write the dispatchers, the capture-size defaults, the graph modes' downgrades, the mask's cost and the speculative step as
# code, so that every rule in packages/sim/steploop cites a claim in a comment. Read on 2026-11-04 at v0.33.0 (commit
# 4ba787ec9959e566d3b587a796dff07673324da5), in the tag's source tarball, as text. Nothing in the tarball was run.

# --- Graph modes ---------------------------------------------------------------------------------------------------------------------

- id: vllm.cudagraph.mode-routines
  value: 'decode mode and mixed mode'
  text: A CUDAGraphMode is a single mode or a pair. FULL_DECODE_ONLY is the pair (FULL, NONE) and FULL_AND_PIECEWISE is (FULL, PIECEWISE). decode_mode() returns the first member and mixed_mode() the second, and a single mode is both of its own.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/compilation.py#L62-L69
    title: vLLM v0.33.0, vllm/config/compilation.py, CUDAGraphMode.mixed_mode
    quote: 'return CUDAGraphMode(self.value[1]) if self.separate_routine() else self'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.piecewise-attention-outside
  value: attention stays outside the graph
  text: PIECEWISE mode builds piecewise CUDA graphs only. It keeps the operations that cannot be captured, some attention operations among them, outside the graph.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/compilation.py#L620-L622
    title: vLLM v0.33.0, vllm/config/compilation.py, CompilationConfig.cudagraph_mode
    quote: 'incompatible ops (i.e. some attention ops) outside the cudagraph'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.piecewise-partitions
  value: N+1 partitions
  text: A graph with N operations that cannot be captured, attention among them, splits into N+1 partitions, and a piecewise capture wraps each partition in a CUDA graph of its own. A piecewise replay is therefore a run of N+1 graph launches with the N operations launched one by one between them.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/compilation.py#L675-L685
    title: vLLM v0.33.0, vllm/config/compilation.py, CompilationConfig.use_inductor_graph_partition
    quote: 'to each partition. For N+1 partitions, there would be N+1'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.downgrade-mixed
  value: FULL becomes FULL_AND_PIECEWISE or FULL_DECODE_ONLY
  text: When a mode captures full graphs for mixed batches and the attention backend does not support graphs for every batch, vLLM sets the mode to FULL_AND_PIECEWISE if attention is split out of the compiled graph, and to FULL_DECODE_ONLY if it is not. A backend that supports no graph at all raises an error.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/compilation.py#L1396-L1419
    title: vLLM v0.33.0, vllm/config/compilation.py, CompilationConfig.resolve_cudagraph_mode_and_sizes
    quote: 'msg += "; setting cudagraph_mode=FULL_AND_PIECEWISE"'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.downgrade-decode
  value: FULL decode without backend support becomes PIECEWISE or NONE
  text: When a mode captures full graphs for decode and the backend supports no graph (support level NEVER), vLLM sets the mode to PIECEWISE if attention is compiled piecewise, and to NONE if it is not.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/compilation.py#L1423-L1445
    title: vLLM v0.33.0, vllm/config/compilation.py, CompilationConfig.resolve_cudagraph_mode_and_sizes
    quote: '"; setting cudagraph_mode=PIECEWISE because "'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.downgrade-spec-decode
  value: speculative decode needs UNIFORM_BATCH for a full graph
  text: When the decode query length is above 1, as with speculative decoding, a mode with full decode graphs needs a backend whose support level is at least UNIFORM_BATCH. Below that, vLLM sets the mode to PIECEWISE if attention is split out, and to NONE if it is not.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/compilation.py#L1449-L1470
    title: vLLM v0.33.0, vllm/config/compilation.py, CompilationConfig.resolve_cudagraph_mode_and_sizes
    quote: 'and min_cg_support.value < AttentionCGSupport.UNIFORM_BATCH.value'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.backend-support-levels
  value: 'ALWAYS, UNIFORM_BATCH, UNIFORM_SINGLE_TOKEN_DECODE, NEVER'
  text: An attention backend has one of four graph support levels, from 3 down to 0. ALWAYS supports mixed prefill and decode batches, UNIFORM_BATCH supports batches whose requests share one query length (speculative decode), UNIFORM_SINGLE_TOKEN_DECODE supports decodes of one token, and NEVER supports no graph.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/attention/backend.py#L557-L568
    title: vLLM v0.33.0, vllm/v1/attention/backend.py, AttentionCGSupport
    quote: 'Cudagraph supported for batches the only contain query_len==1 decodes'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

# --- MRV2's dispatcher (the default runner) ------------------------------------------------------------------------------------------

- id: vllm.cudagraph.mrv2-candidates
  value: FULL candidates first, then PIECEWISE
  text: MRV2's CudaGraphManager builds, once, a list of candidate descriptors for every token count and every captured adapter case. For each mode it takes the descriptors with the smallest captured token count at or above the batch's, the FULL ones before the PIECEWISE ones, and dispatch returns the first candidate that fits the batch.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/worker/gpu/cudagraph_utils.py#L255-L395
    title: vLLM v0.33.0, vllm/v1/worker/gpu/cudagraph_utils.py, CudaGraphManager._init_candidates
    quote: '"""Build priority-ordered candidate lists for each token count."""'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.mrv2-decode-descs
  value: one FULL decode descriptor per rounded capture size
  text: In a dual mode MRV2 captures a FULL decode descriptor for each capture size, with the size rounded up to a multiple of the decode query length and the request count that many divided by the length. It skips a size whose rounded token count is above max_num_seqs times the length, above the largest capture size, or needs more requests than max_num_seqs, and keeps descriptors that come out equal once.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/worker/gpu/cudagraph_utils.py#L317-L351
    title: vLLM v0.33.0, vllm/v1/worker/gpu/cudagraph_utils.py, CudaGraphManager._init_candidates
    quote: 'rounded_num_tokens = round_up(num_tokens, decode_query_len)'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.mrv2-mixed-descs
  value: one mixed descriptor per capture size
  text: For the mixed mode MRV2 captures one descriptor per capture size. A PIECEWISE descriptor has no request count, and a FULL one has min(num_tokens, max_num_seqs) requests. Neither fixes a uniform token count or a query length.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/worker/gpu/cudagraph_utils.py#L353-L372
    title: vLLM v0.33.0, vllm/v1/worker/gpu/cudagraph_utils.py, CudaGraphManager._init_candidates
    quote: 'for PIECEWISE graphs there is no limit on requests when replaying'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.mrv2-compatible
  value: six conditions
  text: A descriptor fits a batch when its uniform token count is unset or equal to the batch's, its query-length bound is unset or at least the batch's (and the batch gave one), its request count is unset or at least the batch's, its token count is at least the batch's, and its adapter case and microbatch count equal the batch's.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/worker/gpu/cudagraph_utils.py#L113-L138
    title: vLLM v0.33.0, vllm/v1/worker/gpu/cudagraph_utils.py, _is_compatible
    quote: 'and desc.num_active_loras == num_active_loras'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.mrv2-lora-clamp
  value: round up to a captured case, clamp at the largest
  text: MRV2 maps a batch's active-adapter count to the smallest captured adapter case at or above it, and a count above the largest captured case to the largest. A count of 0, or any count when no adapter case was captured, stays as it is.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/worker/gpu/cudagraph_utils.py#L222-L228
    title: vLLM v0.33.0, vllm/v1/worker/gpu/cudagraph_utils.py, CudaGraphManager._resolve_effective_loras
    quote: '# Counts above the largest captured case clamp to it.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.mrv2-lora-cases
  value: 0 plus the captured counts
  text: With LoRA on, MRV2 captures the adapter case 0 and the counts that get_captured_lora_counts returns, if cudagraph_specialize_lora is on, which is the default. If it is off, MRV2 captures 0 and max_loras + 1. Without LoRA the only case is 0.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/worker/gpu/lora_utils.py#L20-L36
    title: vLLM v0.33.0, vllm/v1/worker/gpu/lora_utils.py, get_lora_capture_cases
    quote: 'return [0] + [c for c in captured if c > 0]'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.lora-counts
  value: max_loras + 1 by default
  text: get_captured_lora_counts returns only max_loras + 1 unless specialize_active_lora is on, which is off by default. When it is on, it returns the powers of 2 up to max_loras and max_loras + 1. By default the one adapter graph is therefore the one for max_loras + 1 active adapters.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/lora/utils.py#L55-L69
    title: vLLM v0.33.0, vllm/lora/utils.py, get_captured_lora_counts
    quote: 'When specialize=True: powers of 2 up to max_loras, plus max_loras + 1.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.mrv2-uniform-count
  value: num_tokens == max_query_len * num_reqs
  text: MRV2 calls a batch a uniform decode when every request has the same query length, that is when num_tokens equals max_query_len times num_reqs. The runner reports that length as the batch's uniform token count only when no request in the batch is still prefilling, except that a prefill chunk of one new token over existing context counts as a decode.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/worker/utils.py#L958-L975
    title: vLLM v0.33.0, vllm/v1/worker/utils.py, is_uniform_query_len
    quote: 'return num_reqs > 0 and num_tokens == max_query_len * num_reqs'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.mrv2-prefill-query-len
  value: None for a batch with a prefill
  text: When a request in the batch is still prefilling, the MRV2 runner passes max_query_len to the dispatcher as None, so a descriptor that bounds the query length cannot match the batch.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/worker/gpu/model_runner.py#L1805-L1812
    title: vLLM v0.33.0, vllm/v1/worker/gpu/model_runner.py, GPUModelRunner.execute_model
    quote: 'Varlen decode graphs replay decodes only, and their bound'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.mrv2-active-loras
  value: distinct adapters of the batch
  text: The active-adapter count that MRV2 dispatches on is the number of distinct active adapters among the batch's requests. A dummy run, which captures a graph, uses max_loras + 1.
