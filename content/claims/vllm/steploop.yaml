- id: vllm.cudagraph.mrv1-lora-cases
  value: 0 plus the captured counts, or max_loras + 1 alone
  text: MRV1's adapter cases are 0 alone when LoRA is off. With LoRA on and cudagraph_specialize_lora on, which is the default, they are 0 and the counts from get_captured_lora_counts. With cudagraph_specialize_lora off the only case is max_loras + 1, so no graph is captured for a batch without active adapters.
