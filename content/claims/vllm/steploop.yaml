    title: vLLM v0.33.0, vllm/v1/cudagraph_dispatcher.py, CudagraphDispatcher._compute_bs_to_padded_graph_size
    quote: '"""Pre-compute the mapping from batch size to padded graph size."""'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.mrv1-keys-mixed
  value: one key per capture size and adapter case
  text: For the mixed mode MRV1 registers one key per capture size and adapter case, with num_reqs set to min(padded tokens, max_num_seqs) and uniform false. A PIECEWISE key then drops num_reqs to None, and a FULL key keeps the exact count.
