# --- Capture sizes and memory --------------------------------------------------------------------------------------------------------

- id: vllm.cudagraph.default-max-formula
  value: min(2 * max_num_seqs * query length, ceiling)
  text: When the largest capture size is unset, vLLM sets it to the smaller of max_num_seqs times the decode query length times 2 and the platform ceiling, which is 512 tokens or 1,024 on data-centre Blackwell.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/vllm.py#L2398-L2410
    title: vLLM v0.33.0, vllm/config/vllm.py, VllmConfig._set_cudagraph_sizes
    quote: 'max_num_seqs * decode_query_len * 2, default_max_graph_size'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.sizes-budget-clamp
  value: no larger than max_num_batched_tokens
  text: The largest capture size is then cut to max_num_batched_tokens, and a capture size above that budget is dropped from a list the user gave.
  tag: measured
