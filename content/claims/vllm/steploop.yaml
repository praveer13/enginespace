  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.mrv1-uniform-reqs
  value: padded tokens over the query length
  text: A MRV1 key for a uniform decode has num_reqs equal to the padded token count divided by the decode query length, at most max_num_seqs, and the dispatcher asserts that the padded count is a multiple of that length.
