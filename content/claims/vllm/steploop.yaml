  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/cudagraph_dispatcher.py#L186-L201
    title: vLLM v0.33.0, vllm/v1/cudagraph_dispatcher.py, CudagraphDispatcher.initialize_cudagraph_keys
    quote: '# Only relax for PIECEWISE mode. FULL mode needs exact num_reqs'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.cudagraph.mrv1-keys-decode
  value: FULL keys for uniform decode
  text: When the decode mode is FULL and the mode has a decode routine of its own, MRV1 adds FULL keys for uniform decode at every capture size from the decode query length up to that length times max_num_seqs, with uniform true.
