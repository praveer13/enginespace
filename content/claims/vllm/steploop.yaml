# --- MRV1's dispatcher (the legacy runner) -------------------------------------------------------------------------------------------

- id: vllm.cudagraph.mrv1-padding-map
  value: smallest captured size at or above the batch
  text: MRV1 pads a batch of num_tokens up to the smallest captured size at or above it, through a table built from the sorted capture sizes. A batch above max_cudagraph_capture_size is sent to eager execution.
  tag: measured
  source:
