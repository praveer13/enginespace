- id: vllm.mrv2.fallback-reasons
  value: 5
  unit: reasons
  text: At v0.33.0 five things send a configuration back to MRV1. They are pipeline parallelism with the external_launcher backend; the speculative methods suffix and custom_class; parallel drafting for EAGLE; draft models with their own vocabulary; and the features dual-batch overlap lacks.
  tag: measured
  source:
