# vLLM at the pin: the runner, the step loop, the scheduler and the engine defaults (W1-T01; ARCHITECTURE §4.4, D-035, D-041).
#
# Every claim here was read on 2026-11-04 from the file the source URL names, at the tag the URL names. The pin is v0.33.0, the commit
# 4ba787ec9959e566d3b587a796dff07673324da5 (course.lock.json, key vllm). A quote is the source's own text, and a #L anchor says which
# lines hold it. A fact about an older release (the day a default changed) cites that release. TTLs are in days: 90 for a fact that
# belongs to the pin, which the quarterly re-pin re-reads, and 365 for the history of a release that never changes (ARCHITECTURE §4.4).
# research/upstream-vllm.md has the row each claim came from (M6, M7 and so on) and the notes of the day it was first read.

# --- Async scheduling ----------------------------------------------------------------------------------------------------------------

- id: vllm.async-scheduling.default
  value: 'on'
  text: At v0.33.0 vLLM turns async scheduling on by default, unless an incompatible option is set. The config resolves an unset field to on, or to off with a warning when an option conflicts.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/vllm.py#L1685-L1686
    title: vLLM v0.33.0, vllm/config/vllm.py (async scheduling resolved at L1685)
    quote: 'Enable async scheduling unless there is an incompatible option.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.async-scheduling.tri-state
  value: 'bool | None = None'
  text: The async_scheduling field of SchedulerConfig is a tri-state at v0.33.0. It is None until the engine config resolves it, False turns the feature off and True turns it on.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/scheduler.py#L211
    title: vLLM v0.33.0, vllm/config/scheduler.py, async_scheduling
    quote: 'async_scheduling: bool | None = None'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.async-scheduling.since
  value: v0.14.0
  text: Async scheduling became vLLM's default in v0.14.0, released on 2026-01-20. The release notes list it as a breaking change that users can undo with --no-async-scheduling.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/releases/tag/v0.14.0
    title: vLLM v0.14.0 release notes
    quote: 'Async scheduling is now enabled by default - Users who experience issues can disable with --no-async-scheduling.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 365
  pin: vllm

- id: vllm.async-scheduling.mrv1-limits
  value: 'pipeline parallelism; some speculative methods'
  text: On the V1 model runner (MRV1) async scheduling does not work with pipeline parallelism, with speculative methods other than EAGLE, n-gram on the GPU, a draft model, DSpark or DFlash, or with disable_padded_drafter_batch. An explicit request for it raises an error, and the default turns it off with one warning.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/vllm.py#L1651-L1719
    title: vLLM v0.33.0, vllm/config/vllm.py (async scheduling checks, L1651-L1719)
    quote: 'Async scheduling is not supported by the V1 model runner'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.step.max-concurrent-batches.mrv1
  value: 2
  unit: batches
  text: With async scheduling on, the V1 model runner at pipeline-parallel size 1 keeps at most 2 batches in flight, which is what lets the CPU plan one batch while the GPU runs the other.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/vllm.py#L588-L598
    title: vLLM v0.33.0, vllm/config/vllm.py, max_concurrent_batches
    quote: 'Async scheduling requires 2 concurrent batches to overlap.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.step.max-concurrent-batches.mrv2
  value: pp_size + 1
  text: With async scheduling on, Model Runner V2 (MRV2) keeps pipeline-parallel size plus 1 batches in flight, so 2 batches without pipeline parallelism.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/vllm.py#L592-L594
    title: vLLM v0.33.0, vllm/config/vllm.py, max_concurrent_batches
    quote: 'return pp_size + 1'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

