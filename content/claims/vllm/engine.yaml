- id: vllm.mrv2.async-first
  value: 'step N+1 is prepared while step N runs'
  text: MRV2's design document says the scheduler and worker prepare the inputs for step N+1 while the GPU executes step N, so that CPU and GPU work overlap.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/model_runner_v2.md#L45
    title: vLLM v0.33.0, docs/design/model_runner_v2.md (Async-First)
    quote: 'The scheduler and worker prepare inputs for step `N+1` while the GPU executes step `N`, overlapping CPU and GPU work to maximize utilization.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.mrv2.gpu-input-prep
  value: Triton kernels
  text: MRV2 prepares input_ids, positions, query_start_loc and seq_lens with Triton kernels on the GPU, so a value that the CPU does not know yet can still be derived there.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/model_runner_v2.md#L134
    title: vLLM v0.33.0, docs/design/model_runner_v2.md (GPU-native input preparation)
    quote: 'MRV2 uses Triton kernels to prepare inputs such as `input_ids`, `positions`, `query_start_loc`, and `seq_lens`.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.mrv2.persistent-rows
  value: 1024
  unit: rows
  text: MRV2 pre-allocates one fixed table with max_num_reqs rows, 1,024 by default on most platforms. A request keeps its row until it finishes or is preempted, and a preemption counts as a completion.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/model_runner_v2.md#L35-L37
    title: vLLM v0.33.0, docs/design/model_runner_v2.md (Persistent batch)
    quote: 'Pre-allocate a fixed-size tensor with `max_num_reqs` rows (1024 by default on most platforms).'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

# --- The step loop -------------------------------------------------------------------------------------------------------------------

- id: vllm.step.order
  value: 'schedule, launch, mask, wait, sample, update'
  text: At v0.33.0 EngineCore.step schedules, launches execute_model without blocking, builds the grammar bitmask on the CPU while the forward runs, waits on the future, samples with the bitmask, and updates the scheduler from the output.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/engine/core.py#L677-L691
    title: vLLM v0.33.0, vllm/v1/engine/core.py, EngineCore.step
    quote: 'future = self.model_executor.execute_model(scheduler_output, non_block=True)'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.step.idle-sleep
  value: 0.001
  unit: s
  text: When a step ran no model but the scheduler still holds requests, as when requests wait for remote KV or for a delayed free, the engine core loop sleeps 0.001 s to let background threads progress.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/engine/core.py#L1690-L1694
    title: vLLM v0.33.0, vllm/v1/engine/core.py, _process_engine_step
    quote: 'time.sleep(0.001)'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.engine-core.busy-loop
  value: 'poll the input queue, then step'
  text: The engine core's busy loop at v0.33.0 polls the input queue until there is work, runs one engine step, and goes round again.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/engine/core.py#L1621-L1632
    title: vLLM v0.33.0, vllm/v1/engine/core.py, EngineCoreProc.run_busy_loop
    quote: '1) Poll the input queue until there is work to do.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.step.batch-queue
  value: the batch queue first
  text: With async scheduling the engine core uses step_with_batch_queue. It schedules a new batch whenever the queue has room and returns at once, and it blocks on the oldest batch's result only when the queue is full or nothing else can be scheduled.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/engine/core.py#L708-L723
    title: vLLM v0.33.0, vllm/v1/engine/core.py, EngineCore.step_with_batch_queue
    quote: 'fulfilling the batch queue has a higher priority than getting model outputs.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.engine-core.queues
  value: 'input_queue, output_queue'
  text: At v0.33.0 the engine core process keeps a thread-safe input_queue of client requests and an output_queue of engine outputs.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/engine/core.py#L1184-L1185
    title: vLLM v0.33.0, vllm/v1/engine/core.py, EngineCoreProc
    quote: 'self.input_queue = queue.Queue[tuple[EngineCoreRequestType, Any]]()'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.engine-core.aborts
  value: aborts_queue
  text: Aborts arrive on their own queue, aborts_queue, and EngineCore.step drains it after the forward returns and before it updates the scheduler from the output.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/engine/core.py#L688-L690
    title: vLLM v0.33.0, vllm/v1/engine/core.py, EngineCore.step
    quote: 'Before processing the model output, process any aborts that happened'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

# --- The scheduler -------------------------------------------------------------------------------------------------------------------

- id: vllm.scheduler.no-phases
  value: one token budget
  text: The v1 scheduler has no prefill phase and no decode phase. Each request has only the tokens it has computed and the tokens it should have, and each step hands out one token budget so that every request catches up.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/sched/scheduler.py#L701-L710
    title: vLLM v0.33.0, vllm/v1/core/sched/scheduler.py, Scheduler.schedule
    quote: 'There''s no "decoding phase" nor "prefill phase" in the scheduler.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.scheduler.order
  value: 'running first, then waiting'
  text: Within one step the scheduler serves the running requests first and the waiting requests after them, all out of the same token budget.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/sched/scheduler.py#L793
    title: vLLM v0.33.0, vllm/v1/core/sched/scheduler.py, Scheduler.schedule
    quote: 'First, schedule the RUNNING requests.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.scheduler.chunked-prefill-default
  value: 'true'
  text: At v0.33.0 chunked prefill is on by default, so a prompt that does not fit the step's token budget is cut into chunks.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/scheduler.py#L134
    title: vLLM v0.33.0, vllm/config/scheduler.py, enable_chunked_prefill
    quote: 'enable_chunked_prefill: bool = True'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.scheduler.long-prefill-threshold-default
  value: 0
  unit: tokens
  text: The long-prefill token threshold defaults to 0, which means no cap on one prompt's chunk. The cap never applies to a request that is alone in the batch.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/scheduler.py#L79
    title: vLLM v0.33.0, vllm/config/scheduler.py, long_prefill_token_threshold
    quote: 'long_prefill_token_threshold: int = Field(default=0, ge=0)'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.scheduler.reserve-full-isl
  value: 'true'
  text: At v0.33.0 the scheduler checks that a waiting request's whole prompt fits in the KV cache before it admits the request, not only its first chunk.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/scheduler.py#L190
    title: vLLM v0.33.0, vllm/config/scheduler.py, scheduler_reserve_full_isl
    quote: 'scheduler_reserve_full_isl: bool = True'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.scheduler.policy-default
  value: fcfs
  text: The default scheduling policy at v0.33.0 is first come, first served.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/scheduler.py#L159
    title: vLLM v0.33.0, vllm/config/scheduler.py, policy
    quote: 'policy: SchedulerPolicy = "fcfs"'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.scheduler.preemption-recompute
  value: recompute
  text: Preemption in vLLM v0.33.0 is recompute only. The victim's blocks are freed, its computed-token count goes back to 0, and it returns to the front of the waiting queue.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/sched/scheduler.py#L1799-L1842
    title: vLLM v0.33.0, vllm/v1/core/sched/scheduler.py, _preempt_request
    quote: 'request.num_computed_tokens = 0'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.scheduler.preemption-victim
  value: the last running request
  text: Under the first-come, first-served policy the victim of a preemption is the request that joined the running list last. Under the priority policy it is the one with the largest priority value and then the latest arrival.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/sched/scheduler.py#L930-L938
    title: vLLM v0.33.0, vllm/v1/core/sched/scheduler.py, Scheduler.schedule
    quote: 'preempted_req = self.running[-1]'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

