- id: vllm.scheduler.resume-tokens
  value: the prompt and the output so far
  text: The scheduler counts what a waiting request still needs as the request's num_tokens less its computed tokens, and its comment says that it uses num_tokens and not num_prompt_tokens to consider the resumed requests, which have output tokens. A preempted request returns with 0 tokens computed, so it is scheduled for its prompt and for everything it generated, cut to the step's budget, before its next new token.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/sched/scheduler.py#L1303-L1306
    title: vLLM v0.33.0, vllm/v1/core/sched/scheduler.py, Scheduler.schedule (the waiting requests)
    quote: 'num_new_tokens = request.num_tokens - num_computed_tokens'
    accessed: 2026-11-09
  verifiedAt: 2026-11-09
  ttlDays: 90
  pin: vllm

- id: vllm.scheduler.preemption-lowest-priority
  value: the lowest-priority request is the largest priority value
  text: Under the priority policy the scheduler's comment calls the request it preempts the lowest-priority request, and the code picks it as the maximum of the running list by priority value and then arrival time. So a larger priority value is a lower priority, and among requests with the same value the one that arrived last is the victim.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/sched/scheduler.py#L931-L938
    title: vLLM v0.33.0, vllm/v1/core/sched/scheduler.py, Scheduler.schedule (the running requests)
    quote: '# Preempt the lowest-priority request.'
    accessed: 2026-11-09
  verifiedAt: 2026-11-09
  ttlDays: 90
  pin: vllm

- id: vllm.batch-defaults.a100-throughput
  value: a large budget reduces an A100's throughput
  text: The comment in get_batch_defaults says that setting a large max_num_batched_tokens for an A100 reduces its throughput, so the code checks the device name as well as the memory and keeps an A100 on the small tier whatever its memory.
