# --- The structured-output mask ------------------------------------------------------------------------------------------------------

- id: vllm.mask.overlap
  value: computed while the forward runs
  text: In EngineCore.step the CPU builds the grammar bitmask after execute_model has launched the forward without blocking, so the mask is computed while the GPU runs. sample_tokens then applies it.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/engine/core.py#L678-L686
    title: vLLM v0.33.0, vllm/v1/engine/core.py, EngineCore.step
    quote: 'grammar_output = self.scheduler.get_grammar_bitmask(scheduler_output)'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.mask.deferred-sampling
  value: deferred under async scheduling
  text: Under async scheduling a step whose structured-output requests are still waiting for the previous step's tokens cannot sample at once. step_with_batch_queue defers its sampling until it has processed the model output of the prior step.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/engine/core.py#L747-L760
    title: vLLM v0.33.0, vllm/v1/engine/core.py, EngineCore.step_with_batch_queue
    quote: 'We need to defer sampling until we have processed the model output'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.mask.fill-parallel-threshold
  value: 128
  unit: structured requests
  text: The bitmask is filled serially while a step holds up to 128 structured-output requests. Above that, the fill can run in tasks of 16 rows on a thread pool of at most 8 threads.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/structured_output/__init__.py#L79-L87
    title: vLLM v0.33.0, vllm/v1/structured_output/__init__.py, StructuredOutputManager
    quote: 'self.fill_bitmask_parallel_threshold = 128'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.mask.grammar-compile-async
  value: thread pool
  text: Grammar compilation is asynchronous at v0.33.0 unless the executor backend is external_launcher. The structured-output manager submits the grammar build to a thread pool and gives the request a future in place of a grammar, and the request waits in WAITING_FOR_STRUCTURED_OUTPUT_GRAMMAR until the scheduler sees the compiled grammar.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/structured_output/__init__.py#L71-L197
    title: vLLM v0.33.0, vllm/v1/structured_output/__init__.py, StructuredOutputManager.grammar_init
    quote: 'grammar = self.executor.submit(self._create_grammar, request)'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

