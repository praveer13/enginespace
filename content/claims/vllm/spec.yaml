- id: vllm.spec.rejection-methods
  value: 'standard, synthetic, block, fly'
  text: rejection_sample_method is one of standard, synthetic, block and fly, and standard is the default. Standard is probabilistic rejection sampling, synthetic accepts drafts with a decaying probability set by a target rate, block verifies the drafts jointly as a block, and fly is lossy.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/speculative.py#L562-L569
    title: vLLM v0.33.0, vllm/config/speculative.py, rejection_sample_method
    quote: "'standard' uses probabilistic"
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.spec.rejection-sampler.exact
  value: arXiv 2211.17192
  text: The MRV1 RejectionSampler's docstring says its implementation strictly follows the algorithm of arXiv 2211.17192. It names three kinds of token, accepted, recovered and bonus, and the output tokens are their sum.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/sample/rejection_sampler.py#L50-L70
    title: vLLM v0.33.0, vllm/v1/sample/rejection_sampler.py, RejectionSampler
    quote: 'The implementation strictly follows the algorithm described in https://arxiv.org/abs/2211.17192.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

