- id: vllm.spec.fly-lossy
  value: lossy
  text: FLy is an approximate verification policy that vLLM ships as an option. Its documentation says it is intentionally lossy, does not preserve the target distribution, and may degrade model outputs.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/features/speculative_decoding/fly.md#L6
    title: vLLM v0.33.0, docs/features/speculative_decoding/fly.md
    quote: 'FLy is intentionally lossy. Unlike standard speculative decoding, it does not preserve the target distribution and may degrade model outputs.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.spec.chi-square.threshold
  value: df + 10 * sqrt(2 * df)
  text: vLLM's own test of its rejection sampler compares the chi-squared statistic of the sampled tokens with a threshold of df + 10 * sqrt(2 * df), about 10 sigma under the normal approximation, which its docstring says effectively disallows false positives.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/tests/v1/spec_decode/test_rejection_sampler_utils.py#L243-L253
    title: vLLM v0.33.0, tests/v1/spec_decode/test_rejection_sampler_utils.py, _assert_distribution_match
    quote: 'The threshold is set at df + 10*sqrt(2*df), which corresponds to ~10 sigma under the chi-squared distribution''s normal approximation, effectively disallowing false positives.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.spec.chi-square.min-expected
  value: 5
  unit: expected count
  text: The test merges every token whose expected count is under 5 into a single other bin before it computes the statistic, to keep the chi-squared noise down.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/tests/v1/spec_decode/test_rejection_sampler_utils.py#L236-L253
    title: vLLM v0.33.0, tests/v1/spec_decode/test_rejection_sampler_utils.py, _assert_distribution_match
    quote: 'Tokens with expected count < min_expected are merged into a single "other" bin to minimize chi-squared noise.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.spec.custom-class
  value: speculative_config.model is a module path
  text: A custom proposer is configured with method custom_class and a speculative_config.model that holds a module path such as my_module.MyCustomProposer. The class is instantiated with the vLLM config and must expose a callable propose method.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/spec_decode/custom_class_proposer.py#L12-L21
