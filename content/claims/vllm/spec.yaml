  value: 'ngram, draft_model, suffix, eagle, mtp and more'
  text: At v0.33.0 the speculative method is one of ngram, draft_model, suffix, custom_class, the eagle family (eagle, eagle3, extract_hidden_states, dflash and a long list of model-specific mtp names), ngram_gpu or dspark.
