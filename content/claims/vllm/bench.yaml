# vLLM at the pin: `vllm bench serve`, its defaults and its traps (W1-T01; TR8, W1-T32).
#
# TR8's broken-benchmark corpus cites these as the real-world instance of each flaw: a request rate of infinity, a capped closed loop that
# calls itself a rate, no warm-up, and a prefix cache that remembers the last run. The tool is vllm/benchmarks/serve.py at v0.33.0
# (commit 4ba787ec9959e566d3b587a796dff07673324da5), read on 2026-11-04.
#
# One claim was read again on 2026-11-09 and corrected (W1b close-out): vllm.bench.metric-percentiles-default. Its second sentence said that
# a run that asks for no more percentiles "reports the tail and no median". It does not: process_one_metric prints the mean and the median of
# each metric it reports before that metric's percentiles (lines 1424 and 1425), in the file at the pinned commit and in the file at the tag,
# which are byte for byte the same [measured 2026-11-09]. The claim now says so and quotes the line that prints the median. The flag's
# default, "99", is on line 1861.

- id: vllm.bench.request-rate-default
  value: inf
  text: vllm bench serve defaults --request-rate to infinity, and with an infinite rate all the requests are sent at time 0. That is a burst, not a rate.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/benchmarks/serve.py#L1745-L1753
    title: vLLM v0.33.0, vllm/benchmarks/serve.py, --request-rate
    quote: 'then all the requests are sent at time 0.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.bench.arrivals
  value: Poisson, or gamma with --burstiness
  text: With a finite rate the tool draws arrival gaps from a gamma distribution. A --burstiness of 1, the default, makes the gaps exponential, which is a Poisson process, a value below 1 is burstier and a value above 1 is more uniform.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/benchmarks/serve.py#L1754-L1765
    title: vLLM v0.33.0, vllm/benchmarks/serve.py, --burstiness
    quote: 'Default value is 1, which follows Poisson process.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.bench.arrival-rescale
  value: rescaled to N / rate
  text: Without a ramp-up strategy the tool rescales its random arrival offsets so that the last one equals the number of requests divided by the rate, which stabilizes the throughput across seeds. The realized arrival process is therefore not exactly Poisson.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/benchmarks/serve.py#L513-L526
    title: vLLM v0.33.0, vllm/benchmarks/serve.py, get_request
    quote: 'normalize_factor = target_total_delay_s / delay_ts[-1]'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.bench.max-concurrency-default
  value: none
  text: --max-concurrency is unset by default, so nothing caps the requests in flight.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/benchmarks/serve.py#L1678-L1690
    title: vLLM v0.33.0, vllm/benchmarks/serve.py, --max-concurrency
    quote: '"--max-concurrency",'
    accessed: 2026-11-04
