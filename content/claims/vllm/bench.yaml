- id: vllm.bench.prefix-cache-reuse
  value: repeat runs can inflate throughput
  text: vLLM's own benchmarking guide warns that repeating vllm bench serve against the same server can reuse prompts left in the prefix cache and inflate throughput. It suggests varying --seed, restarting or resetting the server, or using vllm bench sweep serve, which resets the caches between runs.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/benchmarking/cli.md#L132-L139
    title: vLLM v0.33.0, docs/benchmarking/cli.md (warning)
    quote: 'Repeating `vllm bench serve` against the same server can reuse prompts left in the prefix cache and inflate throughput.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.bench.tpot-definition
  value: (latency - TTFT) / (output_len - 1)
  text: The tool computes a request's time per output token as its latency minus its time to first token, over the output length minus 1, and only for output lengths above 1. A one-token response counts as 0 for goodput.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/benchmarks/serve.py#L654-L660
    title: vLLM v0.33.0, vllm/benchmarks/serve.py, calculate_metrics
    quote: 'tpot = latency_minus_ttft / (output_len - 1)'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

