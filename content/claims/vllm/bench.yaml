- id: vllm.bench.metric-percentiles-default
  value: '99'
  text: --metric-percentiles defaults to the 99th percentile alone, and it chooses only the percentiles. For each metric it reports, the tool prints the mean and the median before the percentiles, so a run that asks for no more percentiles prints a mean, a median and a P99 for each metric.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/benchmarks/serve.py#L1423-L1431
    title: vLLM v0.33.0, vllm/benchmarks/serve.py, process_one_metric; the default of --metric-percentiles, "99", is at line 1861
    quote: 'print("{:<40} {:<10.2f}".format(f"Median {metric_name} (ms):", median))'
    accessed: 2026-11-09
  verifiedAt: 2026-11-09
  ttlDays: 90
  pin: vllm

