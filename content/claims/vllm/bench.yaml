- id: vllm.bench.max-concurrency-closed-loop
  value: a semaphore
  text: --max-concurrency is an asyncio semaphore around each request, so with it set the run is a capped closed loop. The tool's own help says that the actual request rate may then be lower than the one requested, if the server does not keep up.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/benchmarks/serve.py#L1679-L1689
    title: vLLM v0.33.0, vllm/benchmarks/serve.py, --max-concurrency
    quote: 'actual request rate may be lower than specified with --request-rate,'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.bench.client-queue-time
  value: client_queue_time
  text: The time a request waits at the semaphore is recorded apart as client_queue_time, the gap between its arrival and its send. The request's start_time stays the moment it was sent, which is the time that throughput is computed from.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/benchmarks/serve.py#L1014-L1016
    title: vLLM v0.33.0, vllm/benchmarks/serve.py, limited_request_func
    quote: 'record client-side semaphore delay separately.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

