- id: vllm.lora.s-lora-scope
  value: tensor-parallel slicing
  text: S-LoRA is cited in vLLM's LoRA layers only for how a fully sharded LoRA layer slices its weights across tensor-parallel ranks. In the KV block code, block_pool.py, kv_cache_manager.py, the coordinators and the single-type managers, the adapter appears only in block hashes and events, so adapter weights are not pages of the KV pool. Adapter pages in one pool are S-LoRA's design and not vLLM's.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/lora/layers/row_parallel_linear.py#L98-L106
    title: vLLM v0.33.0, vllm/lora/layers/row_parallel_linear.py
    quote: 'Based on S-LoRA, slicing happens along the output dim.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

