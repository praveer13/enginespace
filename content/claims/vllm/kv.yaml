# --- Adapter slots, not adapter pages ------------------------------------------------------------------------------------------------
# D-042: at the pins neither engine pages adapters in the KV pool. vLLM keeps max_loras GPU slots and a CPU LRU. The adapter weights are
# not blocks of the KV pool, and the only trace of S-LoRA in the tree is the fully sharded tensor-parallel slicing of LoRA layers.

- id: vllm.lora.max-loras-default
  value: 1
  unit: slots
  text: vLLM sizes its GPU adapter slots by max_loras, the most adapters that one batch may use, and it defaults to 1 at v0.33.0.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/config/lora.py#L36-L37
    title: vLLM v0.33.0, vllm/config/lora.py, max_loras
    quote: 'max_loras: int = Field(default=1, ge=1)'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.lora.slot-count
  value: lora_slots = max_loras
  text: The LoRA model manager sizes its adapter slots, lora_slots, as max_loras.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/lora/model_manager.py#L347-L349
    title: vLLM v0.33.0, vllm/lora/model_manager.py, LoRAModelManager.lora_slots
