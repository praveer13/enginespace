# vLLM at the pin: the hybrid KV cache manager, adapter slots, the HMA connector flag and the KV events (W1-T01; D-034, D-042, D-045).
#
# TR5a builds a page pool that holds every KV group and every adapter; vLLM does the first and not the second, and D-042 says so on every
# card. The KV-event claims resolve ARCHITECTURE §5.4, which waited on this task to check the shapes of the pinned version. Read on
# 2026-11-04 at v0.33.0 (commit 4ba787ec9959e566d3b587a796dff07673324da5).

# --- Hybrid KV groups ----------------------------------------------------------------------------------------------------------------

- id: vllm.hybrid-kv.single-pool
  value: one pool, one page size
  text: The hybrid KV cache manager serves every layer type from a single memory pool that is split into blocks of the same page size. Making every layer type reach that one page size is its core challenge.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/hybrid_kv_cache_manager.md#L47
    title: vLLM v0.33.0, docs/design/hybrid_kv_cache_manager.md (Allocation)
    quote: 'We use a single memory pool for all layer types. The memory pool is split into multiple blocks with the same page size.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.hybrid-kv.cache-key
  value: (block hash, group id)
  text: The block pool caches full blocks in a dict keyed by the pair of a block hash and a group id, so the same tokens in different groups are cached and evicted independently.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/hybrid_kv_cache_manager.md#L163
    title: vLLM v0.33.0, docs/design/hybrid_kv_cache_manager.md (Prefix caching)
    quote: 'The block pool uses a dict similar to `tuple(block_hash, group_id) -> block` to cache the full blocks.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.hybrid-kv.intersection
  value: the intersection of the groups' hits
  text: On a new request the manager checks the cache-hit prefix of each group and returns the intersection of the groups as the request's cached prefix.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/hybrid_kv_cache_manager.md#L165
    title: vLLM v0.33.0, docs/design/hybrid_kv_cache_manager.md (Prefix caching)
    quote: 'return the intersection of these groups as the cached prefix of the request.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.hybrid-kv.full-plus-sliding-lookup
  value: full left to right, window right to left
  text: For full attention plus sliding window the lookup first finds the longest full-attention hit scanning left to right, and then the longest sliding-window hit inside that length, checking from right to left.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/hybrid_kv_cache_manager.md#L196-L197
    title: vLLM v0.33.0, docs/design/hybrid_kv_cache_manager.md (Case 2)
    quote: 'Implemented by checking cache hits from right to left starting from the cache hit length of full attention.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.hybrid-kv.doc-two-groups
  value: 2
  unit: groups
  text: The design document describes HybridKVCacheCoordinator as handling exactly two KV cache groups, one full-attention group and one other, and says other cases are not implemented. The code does more than that, as the next claim shows, so the document is stale on the number of groups.
  tag: measured
