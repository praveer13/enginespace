# --- KV events -----------------------------------------------------------------------------------------------------------------------
# ARCHITECTURE §5.4 says the model's events take the shape of the pinned vLLM version's. These claims are that shape. The classes are
# msgspec structs in vllm/distributed/kv_events.py, and an event is a tagged map whose `type` is the class name (the SGLang source says
# so for both engines: see sglang.kv-events.encoding).

- id: vllm.kv-events.batch
  value: '[ts, events, data_parallel_rank]'
  text: A KV event batch is an array-like struct of a timestamp, a list of events and an optional data-parallel rank. KVEventBatch narrows the events to BlockStored, BlockRemoved and AllBlocksCleared.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/distributed/kv_events.py#L31-L39
    title: vLLM v0.33.0, vllm/distributed/kv_events.py, EventBatch
    quote: 'data_parallel_rank: int | None = None'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.kv-events.block-stored
  value: 15
  unit: fields
  text: BlockStored has 15 fields. Seven have no default, block_hashes, parent_block_hash, token_ids, block_size, lora_id (deprecated), medium and lora_name. Eight are optional, extra_keys, group_idx, kv_cache_spec_kind, kv_cache_spec_sliding_window, locality, ownership, session_id and lookahead_token_ids. A store carries the cache-spec kind of its group so that a consumer can classify groups as it learns them.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/distributed/kv_events.py#L56-L98
    title: vLLM v0.33.0, vllm/distributed/kv_events.py, BlockStored
    quote: 'Store events carry cache-spec metadata so consumers can classify and filter groups as they are learned.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.kv-events.adapter-field
  value: lora_name
  text: BlockStored already carries the adapter, as lora_name and as lora_id, which the source marks deprecated in favour of lora_name for the block key hash. The adapter name is also the first entry of extra_keys when it is set.
