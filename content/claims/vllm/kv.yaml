    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/hybrid_kv_cache_manager.md#L221
    title: vLLM v0.33.0, docs/design/hybrid_kv_cache_manager.md (Overview)
    quote: 'Handles exactly two KV cache groups'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.hybrid-kv.n-group-lookup
  value: iterative fixed point
  text: At v0.33.0 HybridKVCacheCoordinator.find_longest_cache_hit handles a list of attention types, not only two, with an iterative fixed-point algorithm. Each type either accepts the candidate length or shortens it, and any shortening restarts the pass over all the types. The loop converges because the length only falls and stops at 0.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/kv_cache_coordinator.py#L811-L816
    title: vLLM v0.33.0, vllm/v1/core/kv_cache_coordinator.py, HybridKVCacheCoordinator.find_longest_cache_hit
    quote: 'Find the longest cache hit using an iterative fixed-point algorithm.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.hybrid-kv.simple-hybrid
  value: one pass
  text: When a model has exactly one full-attention group and one other group, the lookup needs one iteration, and full attention is always checked first when it exists.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/core/kv_cache_coordinator.py#L836-L837
    title: vLLM v0.33.0, vllm/v1/core/kv_cache_coordinator.py, HybridKVCacheCoordinator.find_longest_cache_hit
    quote: 'Simple hybrid (1 full attn + 1 other): one iteration suffices.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

- id: vllm.hybrid-kv.one-lru
  value: one LRU queue
  text: The design document says all KV cache groups share one LRU queue. Blocks join it when they are freed, either because the request finished or because the block fell out of the sliding window.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/docs/design/hybrid_kv_cache_manager.md#L203
    title: vLLM v0.33.0, docs/design/hybrid_kv_cache_manager.md (Case 2)
    quote: 'For now, we use one LRU queue for all kv cache groups.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: vllm

