# --- What a rejection is replaced by -------------------------------------------------------------------------------------------------

- id: vllm.spec.mrv2.residual
  value: r(x) = max(p(x) - q(x), 0)
  text: MRV2 replaces a rejected token with one drawn from the residual r(x), the target's probability minus the draft's where that is positive. It computes the residual's logits in log space, because it draws with Gumbel noise.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/worker/gpu/spec_decode/rejection_sampler_utils.py#L937-L948
    title: vLLM v0.33.0, vllm/v1/worker/gpu/spec_decode/rejection_sampler_utils.py, the resampling kernel
    quote: 'r(x) = max(p(x) - q(x), 0)'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

