# What TR6's lessons cite beyond the claims of vllm/spec.yaml, vllm/steploop.yaml, sglang/spec.yaml and worlds/ (W1-T30; curriculum/TR6 §8): how the pinned
# engines' rejection samplers decide an accept and draw a replacement (so that the lessons can set the course's integer rule beside both runners' code), what
# each proposer family needs, where the grammar mask is applied and when a step defers it, and the three papers and the one kernelspace lesson the reading
# list stands on. An id starts with its engine, or with the world it belongs to (`spec`, `mask`) when its source is not an engine's.
#
# Each quote was read on 2026-11-05 with the generic User-Agent "Mozilla/5.0 (X11; Linux x86_64)". An engine file or document is read at the pinned tag,
# vLLM v0.33.0 (commit 4ba787ec9959e566d3b587a796dff07673324da5) or SGLang v0.5.23 (commit 297e54fd105e974cdf401e5b4d20253a22c16f90): the tag's source
# tarball was downloaded into a folder of its own, its commit was read back from the archive with `git get-tar-commit-id`, and the file was read as text
# and never run. The quote is found verbatim inside the lines its anchor names, after a run of spaces is read as one. A paper is read on its arXiv page,
# the abstract or, for DeepSeek-V3, the HTML version 2, and a document at a commit or a version does not move, so it carries a year [estimated].
# The engines' files carry the quarter that a pin lasts.

# --- The rejection samplers' accept tests --------------------------------------------------------------------------------------------

- id: vllm.spec.mrv2.accept-test
  value: p(x) > u * q(x)
  text: MRV2, the default runner, accepts a drafted token x when the target's probability of x is greater than a draw u times the draft's probability of x. The comparison is strict, and the kernel does it in log space.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/worker/gpu/spec_decode/rejection_sampler_utils.py#L694-L697
    title: vLLM v0.33.0, vllm/v1/worker/gpu/spec_decode/rejection_sampler_utils.py, the acceptance kernel
    quote: 'Probability ratio test: p(x) > u * q(x)'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.spec.mrv2.coin-call
  value: includes_zero=False
  text: MRV2's acceptance kernel draws the coin u of every drafted token with the argument includes_zero set to False.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/worker/gpu/spec_decode/rejection_sampler_utils.py#L598
    title: vLLM v0.33.0, vllm/v1/worker/gpu/spec_decode/rejection_sampler_utils.py, the acceptance kernel
    quote: 'u = tl_rand32(step_seed, pos, includes_zero=False)'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.spec.mrv2.coin-floor
  value: u = max(u, a minimum)
  text: When includes_zero is False, the helper tl_rand32 raises a draw that falls below a minimum, _TL_RAND_MIN, up to that minimum, so that u is never exactly 0.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/worker/gpu/sample/gumbel.py#L66-L70
    title: vLLM v0.33.0, vllm/v1/worker/gpu/sample/gumbel.py, tl_rand32
    quote: 'u = tl.maximum(u, _TL_RAND_MIN)'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.spec.mrv1.accept-test
  value: target_prob / draft_prob >= uniform_prob
  text: MRV1's rejection sampler accepts a drafted token when the draft's probability of it is above 0 and the target's probability divided by the draft's is at least a uniform draw. The comparison includes its boundary.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/sample/rejection_sampler.py#L949-L951
    title: vLLM v0.33.0, vllm/v1/sample/rejection_sampler.py, rejection_random_sample_kernel
    quote: 'accepted = draft_prob > 0 and target_prob / draft_prob >= uniform_prob'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 90
