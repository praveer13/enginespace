  verifiedAt: 2026-11-05
  ttlDays: 90
  pin: vllm

- id: vllm.spec.mrv1.residual
  value: max(target_prob - draft_prob, 0)
  text: MRV1 draws the replacement for a rejected token from the target's probabilities minus the draft's, where positive. It does not divide by the sum first, because it takes an argmax over the residual scaled by random numbers.
  tag: measured
  source:
    url: https://github.com/vllm-project/vllm/blob/v0.33.0/vllm/v1/sample/rejection_sampler.py#L1117-L1144
    title: vLLM v0.33.0, vllm/v1/sample/rejection_sampler.py, sample_recovered_tokens_kernel
    quote: 'prob = tl.maximum(target_prob - draft_prob, 0.0)'
    accessed: 2026-11-05
