# --- The papers and the kernelspace lesson the reading stands on -----------------------------------------------------------------------

- id: spec.paper.eagle-feature-level
  value: autoregression at the second-to-top-layer feature level
  text: EAGLE drafts by autoregression at the feature level, the target's second-to-top layer, which its authors found more straightforward than autoregression at the token level.
  tag: measured
  source:
    url: https://arxiv.org/abs/2401.15077
    title: Li et al., EAGLE, Speculative Sampling Requires Rethinking Feature Uncertainty, arXiv 2401.15077, abstract
    quote: 'autoregression at the feature (second-to-top-layer) level is more straightforward than at the token level.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 365

- id: spec.paper.eagle3-fusion
  value: direct token prediction and multi-layer feature fusion
  text: EAGLE-3 gives up feature prediction for direct token prediction and replaces its reliance on the target's top-layer features with a fusion of features from several layers, which it trains with a technique it calls training-time test.
  tag: measured
  source:
    url: https://arxiv.org/abs/2503.01840
    title: Li et al., EAGLE-3, Scaling up Inference Acceleration of Large Language Models via Training-Time Test, arXiv 2503.01840, abstract
    quote: 'we introduce EAGLE-3, which abandons feature prediction in favor of direct token prediction and replaces reliance on top-layer features with multi-layer feature fusion via a technique named training-time test.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 365

- id: spec.paper.mtp-sequential
  value: sequential modules that keep the causal chain
  text: DeepSeek-V3's multi-token prediction predicts the additional tokens one after another, not in parallel from independent heads, and keeps the complete causal chain at each prediction depth.
  tag: measured
  source:
    url: https://arxiv.org/html/2412.19437v2
    title: DeepSeek-AI, DeepSeek-V3 Technical Report, arXiv 2412.19437v2, section 2.2
    quote: 'we sequentially predict additional tokens and keep the complete causal chain at each prediction depth.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 365

- id: spec.paper.mtp-speculative
  value: the MTP modules can be repurposed for speculative decoding
  text: DeepSeek-V3 trains its multi-token prediction modules to improve the main model, which can discard them at inference, and says it can also repurpose them for speculative decoding to cut generation latency.
  tag: measured
  source:
    url: https://arxiv.org/html/2412.19437v2
    title: DeepSeek-AI, DeepSeek-V3 Technical Report, arXiv 2412.19437v2, section 2.2 (MTP in inference)
    quote: 'we can also repurpose these MTP modules for speculative decoding to further improve the generation latency.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 365

- id: mask.paper.xgrammar-split
  value: context-independent and context-dependent tokens
  text: XGrammar splits the vocabulary into context-independent tokens, which it can precheck, and context-dependent tokens, which have to be interpreted at run time.
  tag: measured
  source:
    url: https://arxiv.org/abs/2411.15100
    title: Dong et al., XGrammar, Flexible and Efficient Structured Generation Engine for Large Language Models, arXiv 2411.15100, abstract
    quote: 'dividing the vocabulary into context-independent tokens that can be prechecked and context-dependent tokens that need to be interpreted during runtime.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 365

- id: mask.paper.xgrammar-overlap
  value: grammar computation overlapped with GPU executions
  text: XGrammar's authors co-design the grammar engine with the inference engine so that grammar computation overlaps with GPU executions.
  tag: measured
  source:
    url: https://arxiv.org/abs/2411.15100
    title: Dong et al., XGrammar, Flexible and Efficient Structured Generation Engine for Large Language Models, arXiv 2411.15100, abstract
    quote: 'we co-design the grammar engine with LLM inference engine to overlap grammar computation with GPU executions.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 365

- id: mask.kernelspace.token-mask
  value: a token can span several grammar states
  text: kernelspace's T6.L8 teaches that a BPE token can contain several grammar terminals and transitions in one model step, so a mask must consume the whole token's bytes from the current parser stack and cannot check a first character only.
  tag: measured
  source:
    url: https://github.com/praveer13/kernelspace/blob/d478f91a0af590f03fcfd76ee73149fa70b28e51/public/lessons-md/t6.l8.md#L32
    title: kernelspace at d478f91, public/lessons-md/t6.l8.md, "The token mask is not a string mask"
    quote: 'A BPE token can contain `"tool","arguments":{` — several grammar terminals and transitions in one model step.'
    accessed: 2026-11-05
  verifiedAt: 2026-11-05
  ttlDays: 365
