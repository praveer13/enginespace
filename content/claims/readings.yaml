- id: nano-vllm.step-shape
  value: prefill or decode, never mixed
  text: nano-vllm's Scheduler.schedule returns a list of sequences and a flag that says whether they are prefill. It admits waiting sequences first, and it schedules a decode step only when no prefill was scheduled, so a step is all prefill or all decode. vLLM's scheduler has no such phases.
  tag: measured
  source:
    url: https://github.com/GeeeekExplorer/nano-vllm/blob/bb823b3e06983d71485a8e1f23715ebd87d98ef8/nanovllm/engine/scheduler.py#L25-L73
    title: nano-vllm at bb823b3, nanovllm/engine/scheduler.py, Scheduler.schedule
    quote: 'def schedule(self) -> tuple[list[Sequence], bool]:'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: nano-vllm

- id: nano-vllm.chunked-prefill-first-only
  value: the first sequence only
  text: nano-vllm cuts a prompt into chunks only for the first sequence of a prefill step. A later sequence that does not fit the token budget waits for the next step.
  tag: measured
  source:
    url: https://github.com/GeeeekExplorer/nano-vllm/blob/bb823b3e06983d71485a8e1f23715ebd87d98ef8/nanovllm/engine/scheduler.py#L42-L43
    title: nano-vllm at bb823b3, nanovllm/engine/scheduler.py, Scheduler.schedule
    quote: '# only allow chunked prefill for the first seq'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: nano-vllm

- id: nano-vllm.preempt-recompute
  value: recompute
  text: nano-vllm preempts by recomputation, as vLLM does. A preempted sequence goes back to the front of the waiting queue as a prefill with its blocks freed. The victim during decode is the last running sequence, and the sequence itself when it is the only one.
  tag: measured
  source:
    url: https://github.com/GeeeekExplorer/nano-vllm/blob/bb823b3e06983d71485a8e1f23715ebd87d98ef8/nanovllm/engine/scheduler.py#L58-L79
    title: nano-vllm at bb823b3, nanovllm/engine/scheduler.py, Scheduler.preempt
    quote: 'def preempt(self, seq: Sequence):'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: nano-vllm

