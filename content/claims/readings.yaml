# The reading targets of TR1 (W1-T01; D-011, D-035): "Inside vLLM" at commit 42172ad, nano-vllm and Mini-SGLang.
#
# The course reads three small or old code bases next to the engines it pins. Each is pinned by commit in course.lock.json (keys inside-vllm,
# nano-vllm and mini-sglang), and TR1 maps each box of their request paths onto the pinned engines. These claims say what a reader needs to
# know before the map: where the post stops being true of v0.33.0, and what the two small engines do and leave out. Read on 2026-11-04.
# nano-vllm and Mini-SGLang have no releases or tags, so a claim cites the file at the commit.

