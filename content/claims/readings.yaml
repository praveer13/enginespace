# --- Mini-SGLang (commit 9a91cfafe754aa85daee49998176275667eb58f2) ---------------------------------------------------------------------

- id: mini-sglang.processes
  value: API server, tokenizer, scheduler per GPU, detokenizer
  text: Mini-SGLang is several independent processes, an API server, a tokenizer worker, a detokenizer worker and one scheduler worker for each GPU, the TP rank.
  tag: measured
  source:
    url: https://github.com/sgl-project/mini-sglang/blob/9a91cfafe754aa85daee49998176275667eb58f2/docs/structures.md#L5-L12
    title: Mini-SGLang at 9a91cfa, docs/structures.md (System Architecture)
    quote: 'It consists of several independent processes working together.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: mini-sglang

- id: mini-sglang.transport
  value: ZeroMQ for control, NCCL for tensors
  text: The Mini-SGLang processes talk over ZeroMQ for control messages, and over NCCL through torch.distributed for the heavy tensor data that moves between GPUs.
  tag: measured
  source:
    url: https://github.com/sgl-project/mini-sglang/blob/9a91cfafe754aa85daee49998176275667eb58f2/docs/structures.md#L16
    title: Mini-SGLang at 9a91cfa, docs/structures.md (Data Flow)
    quote: 'The components communicate using **ZeroMQ (ZMQ)** for control messages and **NCCL** (via `torch.distributed`) for heavy tensor data exchange between GPUs.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: mini-sglang

- id: mini-sglang.request-path
  value: 8
  unit: steps
  text: Mini-SGLang's documented request path has eight steps. The API server forwards a request to the tokenizer, which sends tokens to the rank 0 scheduler, which broadcasts it to the other ranks. All the schedulers then run their engines, rank 0 collects the output token and sends it to the detokenizer, and the API server streams the text back.
  tag: measured
  source:
    url: https://github.com/sgl-project/mini-sglang/blob/9a91cfafe754aa85daee49998176275667eb58f2/docs/structures.md#L20-L29
    title: Mini-SGLang at 9a91cfa, docs/structures.md (Request Lifecycle)
    quote: '**Scheduler (Rank 0)** collects the output token and sends it to the **Detokenizer**.'
    accessed: 2026-11-04
  verifiedAt: 2026-11-04
  ttlDays: 90
  pin: mini-sglang

- id: mini-sglang.chunked-prefill-default
  value: 'true'
