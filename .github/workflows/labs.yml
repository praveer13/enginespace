name: Labs

# The lab toolchains (ARCHITECTURE §10.1). They run only on a change that can affect a lab, a schema or the receipt rules, and
# they need the Rust and Python toolchains that the fast gate does not install.
#   forge   lane B: Rust to wasm. cargo test against the reference, then verify:labs. As in kernelspace's verify-labs, that gate
#           builds the template, the reference and the bestiary for wasm itself and checks them through the host the site uses: the
#           template traps, the reference passes, and the bestiary fails. W1-T10 builds that gate.
#   grader  the local grader: uv 0.10.2, exactly, from the action or else from PyPI; the lockfile checked and synced; its unittest suite on
#           the CPU, which reads schemas/vectors and so is the Python end of verify:vectors, requires the synthetic bundle in
#           tests/fixtures/grader to be what the grader writes now, and judges the manifests of tests/fixtures/references as the zod schema
#           does (it downloads from a server on 127.0.0.1 and reaches nothing else); the installed command's own checks; verify:schema and
#           verify:vectors; and the receipt fixtures (the fixtures pass and the forgeries fail).
#   cpu     W2-T13: the CPU environment (labs/envs/cpu, torch 2.14.0+cpu) is installed from the hashed export of its lock, and
#           scripts/tensor-torch-vectors.py run in it must give the cases of tests/fixtures/tensor/torch-vectors.json, which the tensor model
#           is replayed against. It runs only when a change touches labs/envs/cpu, tests/fixtures/tensor, the script, scripts/triton-interp or the TR0 lab's files (its grader module, its tests and its kit folder, labs/gpu/tr0-forward)
#           (detect says which), and it needs no GPU.
#
# A job switches on when its lab lands (labs/forge/Cargo.toml from W1-T10, labs/grader/pyproject.toml from W2-T02), and this
# file does not change for that. Until then the detect job prints "pending: <task>" for the lab that is missing, and the job
# for it is skipped.
#
# The pack check (W2b-T71) compares the committed kit, public/labs/ and src/receipts/graders.ts with what scripts/pack-kit.ts makes from labs/ and
# course.lock.json, so a change to the packed files or to the scripts that pack them runs it too.
#
# The receipt fixtures step (W2-T08) reads the bestiary and the synthetic fixtures (tests/verify/, built on tests/schema/receipt-support.ts), the owner's
# bundles once they exist (tests/fixtures/receipts/) and the hardware atlas that the floors read (src/receipts/atlas.ts), so a change to any of them runs it.
#
# The workflow runs when a file that its gates read changes. verify:labs reads more than labs/: it imports the forge host and the
# worker the site runs (src/forge, src/workers/forge.worker.ts), the models behind the labs' checks (packages/sim) and the vendored files
# under those (vendor/kernelspace), it judges the builds with scripts/labs, and it compares the builds that tests/fixtures/forge
# commits with the ones it makes. W1 left those out of the filter, so a change to the host or to a model could break a lab with no
# labs job on the pull request (W1 report §12). tests/ci/workflows.test.ts walks the imports of scripts/verify-labs.ts and fails on
# a file that this list does not cover, so a lab's new dependency adds its path here before it can merge.

on:
  pull_request:
    paths:
      - 'labs/**'
      - 'course.lock.json'
      - 'schemas/**'
      - 'packages/schema/**'
      - 'packages/verify/**'
      - 'packages/sim/**'
      - 'src/forge/**'
      - 'src/workers/forge.worker.ts'
      - 'scripts/labs/**'
      - 'scripts/verify-labs.ts'
      - 'tests/fixtures/forge/**'
      - 'tests/fixtures/grader/**'
      - 'tests/fixtures/references/**'
      - 'tests/fixtures/receipts/**'
      - 'tests/fixtures/tensor/**'
      - 'scripts/tensor-torch-vectors.py'
      - 'tests/verify/**'
      - 'tests/schema/receipt-support.ts'
      - 'src/receipts/atlas.ts'
      - 'vendor/kernelspace/**'
      - 'public/labs/**'
      - 'src/receipts/graders.ts'
      - 'scripts/pack-kit.ts'
      - 'scripts/pack-labs.ts'
      - '.github/workflows/labs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labs-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so that a new stable release never changes lab results under a pull request (ARCHITECTURE §10.3).
  RUST_TOOLCHAIN: 1.96.0

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      forge: ${{ steps.labs.outputs.forge }}
      grader: ${{ steps.labs.outputs.grader }}
      cpu: ${{ steps.labs.outputs.cpu }}
    steps:
      # Two commits deep, so that a pull request's merge commit has its first parent (the base) to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Look for the labs
        id: labs
        run: |
          if [ -f labs/forge/Cargo.toml ]; then
            echo 'forge=true' >> "$GITHUB_OUTPUT"
          else
            echo 'forge=false' >> "$GITHUB_OUTPUT"
            echo 'pending: W1-T10'
          fi
          if [ -f labs/grader/pyproject.toml ]; then
            echo 'grader=true' >> "$GITHUB_OUTPUT"
          else
            echo 'grader=false' >> "$GITHUB_OUTPUT"
            echo 'pending: W2-T02'
          fi
          # W2-T13: the cpu job runs when its inputs exist and a change touched one of them. With no first parent to diff against (a first
          # commit, or a checkout without history), it runs.
          cpu=false
          if [ -f labs/envs/cpu/uv.lock ] && [ -f scripts/tensor-torch-vectors.py ] && [ -f tests/fixtures/tensor/torch-vectors.json ]; then
            if git rev-parse --verify --quiet HEAD^1 >/dev/null && git diff --quiet HEAD^1 HEAD -- labs/envs/cpu tests/fixtures/tensor scripts/tensor-torch-vectors.py 'labs/grader/src/enginespace_grader/labs/tr0*' 'labs/grader/src/enginespace_grader/checks' 'labs/grader/src/enginespace_grader/schemas' 'labs/grader/tests/cpu' 'labs/grader/tests/test_tr0*' 'labs/grader/tests/synthetic/tr0-forward' scripts/triton-interp 'labs/gpu/tr0-forward'; then
              echo 'cpu: no change under the CPU environment, the vectors, the script, the TR0 lab or the interpreter scripts'
            else
              cpu=true
            fi
          else
            echo 'cpu: the CPU environment, its fixture or the script is missing, so the cpu job is skipped'
          fi
          echo "cpu=$cpu" >> "$GITHUB_OUTPUT"

  forge:
    needs: detect
    if: needs.detect.outputs.forge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The scripts run under Bun, pinned as in ci.yml.
      - name: Set up pinned Bun
        id: bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # A failed download from GitHub falls back to npm's copy of the same release (ARCHITECTURE §10.3).
      - name: Set up pinned Bun from npm, when GitHub's download failed
        if: steps.bun.outcome == 'failure'
        env:
          BUN_VERSION: 1.3.14
        run: npm install --global --no-audit --no-fund "bun@$BUN_VERSION" && test "$(bun --version)" = "$BUN_VERSION"

      - name: Set up pinned Rust with the wasm32 target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          rustup target list --installed

      - name: Cache cargo registry and lab build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            labs/forge/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('labs/forge/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - run: npm ci
      # A lab's own checks are red on the template a learner receives, because the file they edit holds todo!(). They run here against the
      # reference solution (--features reference), which verify:labs builds as well; verify:labs also checks that the template traps.
      - run: cargo test --manifest-path labs/forge/Cargo.toml --workspace --features reference
      - run: bun run verify:labs

  grader:
    needs: detect
    if: needs.detect.outputs.grader == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The interpreter that runs the grader's tests is pinned too (ARCHITECTURE §10.3). The job installs it with actions/setup-python, which reads this
      # value, so the series is written once. uv looks for it on the path, never downloads one (UV_PYTHON_DOWNLOADS), and fails the job when it is missing,
      # so a runner image that moves to another series cannot change the tests' interpreter. It is inside the lock's range (>=3.11,<3.15).
      UV_PYTHON: '3.12'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up pinned Bun
        id: bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # A failed download from GitHub falls back to npm's copy of the same release (ARCHITECTURE §10.3).
      - name: Set up pinned Bun from npm, when GitHub's download failed
        if: steps.bun.outcome == 'failure'
        env:
          BUN_VERSION: 1.3.14
        run: npm install --global --no-audit --no-fund "bun@$BUN_VERSION" && test "$(bun --version)" = "$BUN_VERSION"

      # Before the uv steps, which find this interpreter and the fallback's `python3 -m venv` uses it. ubuntu-26.04's own python3 is not 3.12 [measured
      # 2026-11-16: uv found no 3.12 on it], and uv is forbidden to download one.
      - name: Set up the pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Set up pinned uv
        id: uv
        continue-on-error: true
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.10.2
          enable-cache: false

      # setup-uv fetches uv from GitHub, as setup-bun fetches Bun [unverified: the action's source was not read], so a failed download falls back
      # to PyPI's copy of the same release (ARCHITECTURE §10.3). The copy goes into a virtual environment of its own, and the step stops unless
      # `uv --version` prints the pin.
      - name: Set up pinned uv from PyPI, when GitHub's download failed
        if: steps.uv.outcome == 'failure'
        env:
          UV_VERSION: 0.10.2
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/python" -m pip install --no-input "uv==$UV_VERSION"
          echo "$RUNNER_TEMP/uv-venv/bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/uv-venv/bin/uv" --version | cut -d ' ' -f 2)" = "$UV_VERSION"

      - run: npm ci
      - name: The grader's lockfile is current
        run: uv lock --check --project labs/grader
      # The four engine environments (W2-T04): each uv.lock satisfies its pyproject.toml, and each requirements.txt is what `uv export` gives from the lock.
      # It resolves from PyPI's metadata and installs nothing: the GPU wheels are gigabytes, and no job syncs these environments.
      - name: The engine environments' locks and exports are current
        run: bash labs/envs/relock.sh --check
      - run: uv sync --locked --project labs/grader
      # The command is the one TRACKER names (W2-T02). uv runs it from the root of the repository, where unittest finds the tests only because
      # labs/, labs/grader/ and labs/grader/tests/ are packages (labs/__init__.py says why).
      - name: Grader tests, on the CPU
        run: uv run --project labs/grader python -m unittest
      - name: The installed command runs its own checks
        run: uv run --project labs/grader enginespace selftest --no-suite
      - run: bun run verify:schema
      - run: bun run verify:vectors

      # W2b-T71: the published kit is what its sources pack to. The wheel, the kit zip, public/labs/manifest.json and src/receipts/graders.ts
      # are committed, and a source that changed without a repack would send a learner a kit that no longer matches (the merge gate runs this
      # for a branch that touches a kit member, and nothing ran it for a pull request). It writes nothing and needs no Python.
      - name: The packed kit is what its sources pack to
        run: bun scripts/pack-kit.ts --check

      # W2-T08: the receipt fixtures pass the browser's rules (packages/verify, ARCHITECTURE §8.5), and the forged bestiary fails them check by check, with
      # the bound printed. The fixtures are the synthetic ones of tests/verify until the owner's bundles are committed to tests/fixtures/receipts/ (W2-T12),
      # which the same tests then forge from. The tests run under Bun, as the unit suite does.
      - name: Receipt fixtures and forgeries
        run: bun test tests/verify/bestiary.test.ts tests/verify/fixtures.test.ts

  cpu:
    needs: detect
    if: needs.detect.outputs.cpu == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The environment is the hashed export of its lock, labs/envs/cpu/requirements.txt, which the grader's job checks against uv.lock (relock.sh
      # --check) before this job runs, and it installs with pip --require-hashes, so every file is the one the lock names. The CPU torch wheel comes
      # from PyTorch's CPU index. The grader is not in the export (it is a path, and the script does not import it), so --no-deps keeps the set exact.
      - name: Install the CPU environment from its lock's export
        run: |
          python3 -m venv "$RUNNER_TEMP/cpu-venv"
          "$RUNNER_TEMP/cpu-venv/bin/python" -m pip install --no-input --no-deps --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r labs/envs/cpu/requirements.txt
      # The vectors are regenerated in that environment and compared with the committed fixture: a different case, or another torch build, fails
      # the job. The job writes to RUNNER_TEMP and never the fixture; the Python patch version is the runner's and is not compared.
      - name: The vectors are what the CPU environment's torch gives
        run: |
          "$RUNNER_TEMP/cpu-venv/bin/python" -I scripts/tensor-torch-vectors.py --out "$RUNNER_TEMP/torch-vectors.json" --compare tests/fixtures/tensor/torch-vectors.json

      # W2b-T48: the TR0 lab's own tests (labs/grader/tests/cpu/), in the CPU environment of the lock. The reference solution passes stages 1 to 3 on a small
      # random-weight Qwen3 that the tests build from the pinned transformers (no weights are downloaded), a wrong RMSNorm epsilon fails stage 2, a cache that
      # miscounts fails its length check, and the cache holds as many positions as the prefix at every step. The grader is not installed in this environment
      # (it is a path dependency, and the export leaves it out), so its source folder is on the path; its one dependency, jsonschema, is in the export.
      # CI is true here on purpose: a test of this folder that finds no torch fails and never passes by being left out. The tests print the worst difference
      # of each run, which is the only measurement they make, and none of it says anything about the margin of Qwen3-0.6B (the weights job measures that).
      - name: The TR0 lab, on a small random-weight model
        env:
          CI: 'true'
          PYTHONPATH: labs/grader/src
        run: '"$RUNNER_TEMP/cpu-venv/bin/python" -m unittest discover -v -s labs/grader/tests/cpu -p "test_*.py"'

      # W2b-T49 (D-072): Triton 3.8.0 is in the CPU environment, for TR0 lesson 4. Its interpreter (TRITON_INTERPRET=1) runs a kernel's programs one after
      # another in Python, on the CPU, which is how a learner steps one on a laptop. The first step is the tests of scripts/triton-interp/run.py on stand-in
      # kernels of its own served from 127.0.0.1 (CI is true so that a missing triton fails them), and the second is the course's own kernel, which asserts its
      # outputs and prints what its last program held. Neither reads vLLM.
      - name: The interpreter script, on stand-in kernels, and the course's own kernel
        env:
          CI: 'true'
        run: |
          "$RUNNER_TEMP/cpu-venv/bin/python" -I -m unittest discover -v -s scripts/triton-interp -p "test_*.py"
          "$RUNNER_TEMP/cpu-venv/bin/python" -I scripts/triton-interp/course_kernel.py
      # The third step is the one that asks the question. It reads the five candidate files of TR0 at vLLM's pinned commit (raw.githubusercontent.com over
      # https, a generic User-Agent, no token), keeps their jit functions, and launches each kernel that has an input recipe under the interpreter. The log
      # names every kernel as ran, failed (with the error's class) or not-attempted; the step ends green whichever way they fall, because a kernel that does not
      # run is a finding for lesson 4 (content/claims/tr0.yaml) and not a fault of the job. Nothing it reads is kept.
      - name: Which of vLLM's pinned kernels run under the interpreter
        run: '"$RUNNER_TEMP/cpu-venv/bin/python" -I scripts/triton-interp/run.py --json "$RUNNER_TEMP/triton-interp.json"'

  # W2-T16: the weights job. It is started by hand (workflow_dispatch) and by nothing else, because it downloads the pinned Qwen3-0.6B (about 1.5 GB) from the model
  # hub, which no pull request should do, and the owner decides when to run it. It is the only run of the TR0 lab on the pinned weights, so the lab's first check (the
  # reference passes on the pinned model) closes with its first green run, and until then the model files' hashes in labs/references/manifest.json are [unverified].
  # What it does, in order: install the CPU environment from its lock's export (as the cpu job); fetch the pinned files with `enginespace fetch tr0.forward` into a cache
  # (the grader hashes each download against the manifest and keeps nothing that differs); hash each file again against labs/references/manifest.json, in a step of its own, so
  # that the log shows every name, size and hash; run the reference solution and the wrong-epsilon mutants through the grader's own stages on the pinned weights; and print
  # the worst logit difference of each, which goes to the owner and changes no bound. No token is read or sent, and the job writes nothing back.
  weights:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ENGINESPACE_CACHE: ${{ github.workspace }}/.enginespace-cache
      PYTHONPATH: labs/grader/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the CPU environment from its lock's export
        run: |
          python3 -m venv "$RUNNER_TEMP/cpu-venv"
          "$RUNNER_TEMP/cpu-venv/bin/python" -m pip install --no-input --no-deps --require-hashes --extra-index-url https://download.pytorch.org/whl/cpu -r labs/envs/cpu/requirements.txt

      # The cache is keyed by the manifest: a changed pin is a new download, and a file in the cache is hashed again by the grader each time it is used.
      - name: Restore the weights from an earlier run
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ENGINESPACE_CACHE }}
          key: tr0-weights-${{ hashFiles('labs/references/manifest.json') }}

      - name: Fetch the pinned weights
        run: '"$RUNNER_TEMP/cpu-venv/bin/python" -m enginespace_grader fetch tr0.forward'

      - name: Hash each file against the references manifest
        run: |
          "$RUNNER_TEMP/cpu-venv/bin/python" -I - <<'PY'
          import hashlib, json, os, sys
          manifest = json.load(open("labs/references/manifest.json", encoding="utf-8"))
          cache = os.environ["ENGINESPACE_CACHE"]
          bad = 0
          for entry in manifest["entries"]:
              if "tr0.forward" not in entry["labs"]:
                  continue
              path = os.path.join(cache, entry["path"])
              if not os.path.isfile(path):
                  print(f"MISSING    {entry['path']}  (the fetch step should have put it in the cache)")
                  bad += 1
                  continue
              digest, size = hashlib.sha256(), 0
              with open(path, "rb") as handle:
                  for block in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(block)
                      size += len(block)
              same = digest.hexdigest() == entry["sha256"] and size == entry["bytes"]
              bad += 0 if same else 1
              print(f"{'ok' if same else 'DIFFERENT'}  {entry['path']}  {size} bytes  sha256 {digest.hexdigest()}  manifest {entry['bytes']} bytes sha256 {entry['sha256']}")
          sys.exit(1 if bad else 0)
          PY

      # The reference and the two wrong-epsilon solutions, stage by stage, on the pinned weights. Each line is the worst absolute difference of one check against its bound.
      # CI is true so that a missing torch fails the step and never passes it by being left out.
      - name: The reference and the mutants, on the pinned weights
        env:
          CI: 'true'
        run: |
          "$RUNNER_TEMP/cpu-venv/bin/python" labs/grader/tests/cpu/weights_margin.py | tee "$RUNNER_TEMP/weights-margin.txt"
          { echo '### TR0 on the pinned Qwen3-0.6B: the worst difference of each check'; echo; echo '```'; cat "$RUNNER_TEMP/weights-margin.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

