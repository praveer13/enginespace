name: Labs

# The lab toolchains (ARCHITECTURE §10.1). They run only on a change that can affect a lab, a schema or the receipt rules, and
# they need the Rust and Python toolchains that the fast gate does not install.
#   forge   lane B: Rust to wasm. cargo test against the reference, then verify:labs. As in kernelspace's verify-labs, that gate
#           builds the template, the reference and the bestiary for wasm itself and checks them through the host the site uses: the
#           template traps, the reference passes, and the bestiary fails. W1-T10 builds that gate.
#   grader  the local grader: uv sync from the lockfile, its unittest suite on the CPU, verify:schema and verify:vectors, and the
#           receipt fixtures (the fixtures pass and the forgeries fail).
#
# A job switches on when its lab lands (labs/forge/Cargo.toml from W1-T10, labs/grader/pyproject.toml from W2-T02), and this
# file does not change for that. Until then the detect job prints "pending: <task>" for the lab that is missing, and the job
# for it is skipped.

on:
  pull_request:
    paths:
      - 'labs/**'
      - 'schemas/**'
      - 'packages/schema/**'
      - 'packages/verify/**'
      - '.github/workflows/labs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: labs-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so that a new stable release never changes lab results under a pull request (ARCHITECTURE §10.3).
  RUST_TOOLCHAIN: 1.96.0

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      forge: ${{ steps.labs.outputs.forge }}
      grader: ${{ steps.labs.outputs.grader }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look for the labs
        id: labs
        run: |
          if [ -f labs/forge/Cargo.toml ]; then
            echo 'forge=true' >> "$GITHUB_OUTPUT"
          else
            echo 'forge=false' >> "$GITHUB_OUTPUT"
            echo 'pending: W1-T10'
          fi
          if [ -f labs/grader/pyproject.toml ]; then
            echo 'grader=true' >> "$GITHUB_OUTPUT"
          else
            echo 'grader=false' >> "$GITHUB_OUTPUT"
            echo 'pending: W2-T02'
          fi

  forge:
    needs: detect
    if: needs.detect.outputs.forge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The scripts run under Bun, pinned as in ci.yml.
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up pinned Rust with the wasm32 target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          rustup target list --installed

      - name: Cache cargo registry and lab build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            labs/forge/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('labs/forge/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - run: npm ci
      # A lab's own checks are red on the template a learner receives, because the file they edit holds todo!(). They run here against the
      # reference solution (--features reference), which verify:labs builds as well; verify:labs also checks that the template traps.
      - run: cargo test --manifest-path labs/forge/Cargo.toml --workspace --features reference
      - run: bun run verify:labs

  grader:
    needs: detect
    if: needs.detect.outputs.grader == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.10.2
          enable-cache: false

      - run: npm ci
      - run: uv sync --locked --project labs/grader
      - name: Grader tests, on the CPU
        run: uv run --project labs/grader python -m unittest
      - run: bun run verify:schema
      - run: bun run verify:vectors

      # W2-T08 builds the receipt fixtures and the forged bestiary. This step passes the fixtures and fails on a forgery then.
      - name: Receipt fixtures and forgeries
        run: "echo 'pending: W2-T08'"
