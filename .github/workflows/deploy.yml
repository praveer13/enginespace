name: Deploy to GitHub Pages

# Publishes the site on every push to main: the fast gate and the tests, then the build, prepare-pages, and the Pages upload
# and deploy (ARCHITECTURE §10.1, kernelspace's deploy).
#
# It is off until the owner answers O-2 (docs/DECISIONS.md): GitHub Pages on a private repository needs a paid GitHub plan
# [unverified, 2026-11-03]. To turn it on, enable Pages with the source "GitHub Actions", then set the repository variable
# PAGES_ENABLED to 'true'. While the variable is unset, both jobs are skipped.
#
# Until a custom domain exists (O-1) the site is served under /enginespace/, so the build sets VITE_BASE.
#
# Every command of ci.yml's fast gate and tests job runs here too, so a deploy is never less checked than a pull request
# (tests/ci/workflows.test.ts compares the two).

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The scripts run under Bun, pinned as in ci.yml.
      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Compile the content
        run: |
          if [ -f scripts/content/build.ts ]; then
            bun scripts/content/build.ts
          else
            echo 'pending: W0-T08'
          fi

      - name: Source gates
        run: bun run verify:all --stage source

      - run: bun run test

      # The deployed build, under the Pages base path.
      - name: Build for Pages
        run: npm run build
        env:
          VITE_BASE: /enginespace/

      - name: Build gates
        run: bun run verify:all --stage build

      - name: Export freshness
        run: |
          if ! git ls-files --error-unmatch public/llms.txt > /dev/null 2>&1; then
            echo 'pending: W1-T35'
            exit 0
          fi
          if [ -n "$(git status --porcelain --untracked-files=all -- public/md public/llms.txt)" ]; then
            git status --short --untracked-files=all -- public/md public/llms.txt
            echo '::error title=Export freshness::the committed Markdown export is stale: run bun scripts/content/build.ts and commit public/md and public/llms.txt'
            exit 1
          fi

      # §3.2: a real index.html for every route it can enumerate, and the 404.html fallback. W0-T19 builds the script.
      - name: Prepare the Pages directory
        run: |
          if [ -f scripts/prepare-pages.ts ]; then
            bun scripts/prepare-pages.ts
          else
            echo 'pending: W0-T19'
          fi
        env:
          VITE_BASE: /enginespace/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
