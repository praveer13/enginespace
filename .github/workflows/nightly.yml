name: Nightly

# The slow checks that would blow the pull-request fast gate (ARCHITECTURE §10.1). Nothing here blocks a merge: no other
# workflow needs these jobs. When one fails, the report job opens one nightly-failure issue, or comments on the one that is
# open, with a link to the run (kernelspace's pattern).
#
# Most jobs are reserved. Each prints "pending: <task>" and passes until its owning task replaces the step, because the
# check needs code that does not exist yet:
#   properties   W0-T10  the seeded properties at their nightly seed count (§5.10). The first task with seeded property tests
#                        settles the one seed-count knob that every suite reads.
#   browsers     W0-T21  the cross-browser determinism hash, full axe at the nightly widths on every route, keyboard walks of
#                        every game, and reduced-motion emulation (§10.1, §11.2). W0-T21 owns the nightly sweep.
#   lab-profile  W0-T20  the LCP, INP and CLS lab profile, from e2e/perf.spec.ts (§11.1).
#   reports      W3-T13  link rot. The claim-expiry report runs now: verify:claims and verify:pins list what is past its TTL.

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC [estimated slot]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  properties:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: "echo 'pending: W0-T10'"

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: "echo 'pending: W0-T21'"

  lab-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: "echo 'pending: W0-T20'"

  # Claims and pins past their TTL never fail a gate (§4.4): the gates print them, and this job keeps the log.
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: npm ci
      - run: bun run verify:claims
      - run: bun run verify:pins

      - name: Link-rot report
        run: "echo 'pending: W3-T13'"

  report:
    needs: [properties, browsers, lab-profile, reports]
    # A run started by hand from another branch is a trial, and a trial files no issue.
    if: ${{ always() && contains(needs.*.result, 'failure') && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          gh label create nightly-failure --color B60205 --description 'A nightly check failed' 2>/dev/null || true
          results=$(jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<< "$NEEDS")
          body=$(printf 'Nightly run: %s\n\n%s\n' "$RUN_URL" "$results")
          open=$(gh issue list --label nightly-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --label nightly-failure --title 'Nightly checks failed' --body "$body"
          fi
