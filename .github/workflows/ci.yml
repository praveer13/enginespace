name: CI

# The pull-request gates (ARCHITECTURE §10.1). Three jobs run side by side:
#   fast-gate  lint, typecheck, the content compile, every verify:* gate that scripts/verify.ts registers, the build, and the
#              gate that reads the build (verify:bundle), then export freshness.
#   tests      bun test, in four shards (bun test --shard) that together run every test file once: units, golden vectors, seeded
#              properties and bestiaries.
#   e2e-smoke  Playwright's Chromium against vite preview: axe on the eight routes of W0-T21 and the sixteen pages and five level pages
#              that W1 added (W1-T36) at 360 and 1280 px, the keyboard walks of the front-page game and of one level of each W1 game,
#              the network check, the screenshots and reduced motion. Every level of every game, at the nightly widths, runs in nightly.yml: it takes
#              longer than a pull request should wait for. The specs that earlier tasks wrote run in e2e-features, below.
#
# A gate whose script is not built yet prints "pending: <task>" and exits 0 (kernelspace's pattern, scripts/verify.ts), so this
# file does not change when a task lands its gate. The content compile and the export freshness check switch on the same way,
# by file. Run the gates locally with `bun run verify:all`. labs.yml runs the one gate that needs the Rust toolchain (verify:labs).
#
#   e2e-features  the rest of the specs (Playwright's `features` project: the 3D scenes, frame counts, the ledger, receipts, settings, route
#              changes and the lesson walks), in four shards, with the smoke job's workers and the configuration's own one retry. A test that
#              passes only on its retry is printed. It checks the commits whose runs finish (ARCHITECTURE §10.1, D-078).
#
# The job timeouts are backstops [estimated], set well above the targets of §10.2 and §10.1: under 5 minutes for the fast gate
# [estimated] and under 6 for e2e-smoke [estimated].
#
# Actions are pinned by full commit SHA with the release in the comment, as ARCHITECTURE §10.3 lists them. A bump is a
# reviewed change to that table and to every workflow, and tests/ci/workflows.test.ts compares the two.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The scripts run under Bun, pinned as in kernelspace's workflows.
      - name: Set up pinned Bun
        id: bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # A failed download from GitHub falls back to npm's copy of the same release (ARCHITECTURE §10.3).
      - name: Set up pinned Bun from npm, when GitHub's download failed
        if: steps.bun.outcome == 'failure'
        env:
          BUN_VERSION: 1.3.14
        run: npm install --global --no-audit --no-fund "bun@$BUN_VERSION" && test "$(bun --version)" = "$BUN_VERSION"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # §4.1: in CI, `bun scripts/content/build.ts` runs the compiler that the dev server runs as a Vite plugin.
      - name: Compile the content
        run: |
          if [ -f scripts/content/build.ts ]; then
            bun scripts/content/build.ts
          else
            echo 'pending: W0-T08'
          fi

      # Every gate that reads only the working tree. Its pending ones name their task.
      - name: Source gates
        run: bun run verify:all --stage source

      - run: npm run build

      # The gates that read dist/ (verify:bundle).
      - name: Build gates
        run: bun run verify:all --stage build

      # §4.6: the Markdown export is committed (W1-T35), and the build above rewrote it, so a difference means the committed export is
      # stale, and an export that the commit does not hold fails too. tests/content/export.test.ts runs this step on a stale tree.
      - name: Export freshness
        run: |
          if ! git ls-files --error-unmatch public/llms.txt > /dev/null 2>&1; then
            echo '::error title=Export freshness::the Markdown export is not committed: run bun scripts/content/build.ts and commit public/md and public/llms.txt'
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all -- public/md public/llms.txt)" ]; then
            git status --short --untracked-files=all -- public/md public/llms.txt
            echo '::error title=Export freshness::the committed Markdown export is stale: run bun scripts/content/build.ts and commit public/md and public/llms.txt'
            exit 1
          fi

  # The suite outgrew one job with W1: on PR #2's first run the runner had run 253 of the 268 test files, with no failure, when the
  # job timed out after 841 s of tests, and the runs that finished took 9 and 16 minutes in all [measured 2026-11-09, PR #2 and #3].
  # The deploy's build ran the whole suite in 610 and 955 s [measured 2026-11-09, deploy.yml on main]. The laptop runs all 268 in 427 s
  # [measured 2026-11-08 at 6418a20].
  #
  # So the job is four, one for each shard of `bun test --shard=<i>/4`. Bun sorts the test files by path and deals them out in turn,
  # the first to shard 1, the second to shard 2 and so on, so the four shards together run every file once and no file twice;
  # tests/ci/shards.test.ts lists each shard's files, compares their union with the suite, and asks Bun itself how many files each shard
  # runs. A file is therefore in the shard that its place in the sorted list gives it, and nobody assigns it. On the files of 2026-11-09 the
  # dealing gave the heaviest shard 34% of the suite's test time, on the laptop's run and on the runner's [derived from the junit reports of
  # a laptop run at 54d880f, and from the test times in the log of the deploy's build], so a shard takes a third of a full run or a little
  # more, which on the runs above is 3.5 to 5.5 minutes of tests [derived]. The backstop is 15 minutes [estimated]: it was 15 for the unsharded
  # job at the start of W1, and the 30 that it was raised to is gone. deploy.yml still runs the suite whole (tests/ci/workflows.test.ts
  # compares the two).
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The suite runs under Bun, pinned as in the fast gate.
      - name: Set up pinned Bun
        id: bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # A failed download from GitHub falls back to npm's copy of the same release (ARCHITECTURE §10.3).
      - name: Set up pinned Bun from npm, when GitHub's download failed
        if: steps.bun.outcome == 'failure'
        env:
          BUN_VERSION: 1.3.14
        run: npm install --global --no-audit --no-fund "bun@$BUN_VERSION" && test "$(bun --version)" = "$BUN_VERSION"

      - run: npm ci

      # bunfig.toml roots `bun test` at tests/, so Playwright's specs in e2e/ never run here. `bun run test` is package.json's
      # `bun test --timeout 30000`, and the flag after it is Bun's: this shard's share of the sorted file list, out of four.
      - name: Run this shard of the unit suite
        env:
          SHARD: ${{ matrix.shard }}
        run: bun run test --shard="$SHARD/4"

  # §10.1: Playwright's Chromium against `vite preview`, with axe on the pull-request routes, the keyboard walks of the front-page game
  # and of the games that W1 built, the network-isolation check, and the screenshots uploaded as artifacts. playwright.config.ts builds
  # the site and serves it, so the test step is also the build; its `smoke` project is the five specs of W0-T21 (e2e/a11y, keyboard-loop,
  # network, screenshots and reduced-motion) and W1-T36's keyboard walks (e2e/walks.spec.ts). The report, the traces, the actual and diff
  # of a screenshot that failed, and the 3D captures are kept as an artifact, whatever the result. A screenshot baseline is a Linux
  # rendering: when a runner draws the page a little differently, the artifact has the `-actual.png` to copy over the baseline in
  # e2e/screenshots.spec.ts-snapshots/.
  #
  # The smoke project runs in four shards, one test at a time across them (its fullyParallel): a private repository's runner has two
  # cores, and SwiftShader draws on the CPU, so the 78 specs in one job did not finish in 15 minutes [measured 2026-11-04 on PR #1:
  # 47 of 78 had run when the job timed out]. The cut is by count and the order is the files' names, so playwright.config.ts says where
  # each file sorts and why; W1-T36's 193 tests ran as four shards of 66, 61, 75 and 98 s on a 20-core laptop [measured 2026-11-08 at
  # df76ca9]. On a runner the four shards took 7 to 12 minutes each, and shard 4 failed or had to retry its keyboard walks at 1280 px and its
  # 2D screenshot after a fire on each of PR #2's three runs [measured 2026-11-09, PR #2 and #3]. Those tests did not wait for too short a time: the
  # pages that they open do not need the GPU, and the browser composed them through SwiftShader on the CPU all the same, until it did not
  # answer for a minute and a half. The smoke project's browser composes on the CPU now (playwright.config.ts has the measurements): the four
  # shards ran in 82, 71, 58 and 74 s on four pinned cores of a laptop, where they took 206, 196, 293 and 306 s [measured 2026-11-09 at
  # 54d880f]. No run on a runner has timed the change [unverified], and the backstop stays at 20 minutes.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The browser is the revision that the locked @playwright/test pins, with the system libraries it needs.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the smoke specs
        env:
          SHARD: ${{ matrix.shard }}
        run: npx playwright test --project=smoke --shard="$SHARD/4"

      - name: Keep the report, the screenshots and the traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-smoke-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore

  # W2b-T71 (D-078): the `features` project on the pull request. Until now only nightly.yml ran it, by hand, and a failure that only the
  # nightly saw appeared after a wave was declared finished (B03 of the leftovers; ARCHITECTURE §10.1). It is the smoke job's shape: the
  # same four-way `--shard` (the project is cut by file, in the order of the file names: playwright.config.ts's note on sorting says where a
  # spec belongs), the same two workers and the configuration's own one retry (`retries: CI ? 1 : 0`, so a real failure fails twice), and
  # no flag of its own. Nothing is skipped or quarantined here. The step after the run prints every test that passed only on its retry,
  # so that a flaky spec is read in the log and does not hide behind a green job.
  #
  # The concurrency group is the job's own and carries the shard, because a job-level group holds one running and one waiting job: with a
  # four-way matrix in one group three shards would wait, and a newer pending one would replace the older. cancel-in-progress is false, so
  # a shard that has started is never cancelled by a later job of the group. The workflow's own group above still cancels the whole run
  # when a newer commit is pushed to the same pull request, so the job checks the commits whose runs finish. It is not a required check
  # until the owner makes it one (N14, an open question; D-078). The backstop is 25 minutes [estimated]: the project's 836 tests took 20.5
  # minutes whole on four performance cores [measured 2026-11-22 at f0ede6ec, D-077], so a shard of a quarter is about 5 minutes there and
  # a runner of two cores is slower; the first dispatch of this file on a branch gives each shard's minutes, which D-078 records.
  e2e-features:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: e2e-features-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # front.spec.ts runs scripts/prepare-pages.ts, which uses Bun's HTMLRewriter, so the specs need the pinned Bun that the other jobs have.
      - name: Set up pinned Bun
        id: bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # A failed download from GitHub falls back to npm's copy of the same release (ARCHITECTURE §10.3).
      - name: Set up pinned Bun from npm, when GitHub's download failed
        if: steps.bun.outcome == 'failure'
        env:
          BUN_VERSION: 1.3.14
        run: npm install --global --no-audit --no-fund "bun@$BUN_VERSION" && test "$(bun --version)" = "$BUN_VERSION"

      - run: npm ci

      # The browser is the revision that the locked @playwright/test pins, with the system libraries it needs.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      # The list reporter and the HTML report are the configuration's own; the JSON file is for the step below.
      - name: Run this shard of the features specs
        env:
          SHARD: ${{ matrix.shard }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: features-report.json
        run: npx playwright test --project=features --shard="$SHARD/4" --reporter=list,html,json

      # A test that failed once and passed on its retry is green in the job. It is listed here, and in the run's summary, with its file and
      # title, so that a pull request that is green by retry is read as such.
      - name: Print every test that passed only on its retry
        if: ${{ !cancelled() }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          node - <<'JS'
          const fs = require('node:fs')
          if (!fs.existsSync('features-report.json')) {
            console.log('no report: the run did not reach the end')
            process.exit(0)
          }
          const report = JSON.parse(fs.readFileSync('features-report.json', 'utf8'))
          const flaky = []
          const walk = (suite, trail) => {
            const here = suite.title && !suite.file ? [...trail, suite.title] : trail
            for (const spec of suite.specs ?? []) {
              for (const test of spec.tests ?? []) {
                if (test.status === 'flaky') flaky.push(`${spec.file}:${spec.line} ${[...here, spec.title].join(' > ')} (${test.results.length} attempts)`)
              }
            }
            for (const child of suite.suites ?? []) walk(child, here)
          }
          for (const suite of report.suites ?? []) walk(suite, [])
          const lines = [`shard ${process.env.SHARD}/4: ${report.stats.expected} passed, ${report.stats.unexpected} failed, ${flaky.length} passed only on the retry, ${report.stats.skipped} skipped`, ...flaky.map((line) => `  retried: ${line}`)]
          console.log(lines.join('\n'))
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n\n')
          if (flaky.length > 0) console.log(`::warning title=Passed only on the retry::${flaky.length} test(s) of shard ${process.env.SHARD}`)
          JS

      - name: Keep the report, the traces and the JSON
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-features-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
            features-report.json
          retention-days: 14
          if-no-files-found: ignore
