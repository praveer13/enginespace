name: CI

# The pull-request gates (ARCHITECTURE §10.1). Three jobs run side by side:
#   fast-gate  lint, typecheck, the content compile, every verify:* gate that scripts/verify.ts registers, the build, and the
#              gate that reads the build (verify:bundle), then export freshness.
#   tests      bun test: units, golden vectors, seeded properties and bestiaries.
#   e2e-smoke  Playwright's Chromium against vite preview: axe on the eight routes of W0-T21 and the sixteen pages and five level pages
#              that W1 added (W1-T36) at 360 and 1280 px, the keyboard walks of the front-page game and of one level of each W1 game,
#              the network check, the screenshots and reduced motion. The specs that earlier tasks wrote, and every level of every game,
#              run in nightly.yml: they take longer than a pull request should wait for.
#
# A gate whose script is not built yet prints "pending: <task>" and exits 0 (kernelspace's pattern, scripts/verify.ts), so this
# file does not change when a task lands its gate. The content compile and the export freshness check switch on the same way,
# by file. Run the gates locally with `bun run verify:all`. labs.yml runs the one gate that needs the Rust toolchain (verify:labs).
#
# The job timeouts are backstops [estimated], set well above the targets of §10.2 and §10.1: under 5 minutes for the fast gate
# [estimated] and under 6 for e2e-smoke [estimated].
#
# Actions are pinned by full commit SHA with the release in the comment, as ARCHITECTURE §10.3 lists them. A bump is a
# reviewed change to that table and to every workflow, and tests/ci/workflows.test.ts compares the two.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The scripts run under Bun, pinned as in kernelspace's workflows.
      - name: Set up pinned Bun
        id: bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # A failed download from GitHub falls back to npm's copy of the same release (ARCHITECTURE §10.3).
      - name: Set up pinned Bun from npm, when GitHub's download failed
        if: steps.bun.outcome == 'failure'
        env:
          BUN_VERSION: 1.3.14
        run: npm install --global --no-audit --no-fund "bun@$BUN_VERSION" && test "$(bun --version)" = "$BUN_VERSION"

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # §4.1: in CI, `bun scripts/content/build.ts` runs the compiler that the dev server runs as a Vite plugin.
      - name: Compile the content
        run: |
          if [ -f scripts/content/build.ts ]; then
            bun scripts/content/build.ts
          else
            echo 'pending: W0-T08'
          fi

      # Every gate that reads only the working tree. Its pending ones name their task.
      - name: Source gates
        run: bun run verify:all --stage source

      - run: npm run build

      # The gates that read dist/ (verify:bundle).
      - name: Build gates
        run: bun run verify:all --stage build

      # §4.6: the Markdown export is committed (W1-T35), and the build above rewrote it, so a difference means the committed export is
      # stale, and an export that the commit does not hold fails too. tests/content/export.test.ts runs this step on a stale tree.
      - name: Export freshness
        run: |
          if ! git ls-files --error-unmatch public/llms.txt > /dev/null 2>&1; then
            echo '::error title=Export freshness::the Markdown export is not committed: run bun scripts/content/build.ts and commit public/md and public/llms.txt'
            exit 1
          fi
          if [ -n "$(git status --porcelain --untracked-files=all -- public/md public/llms.txt)" ]; then
            git status --short --untracked-files=all -- public/md public/llms.txt
            echo '::error title=Export freshness::the committed Markdown export is stale: run bun scripts/content/build.ts and commit public/md and public/llms.txt'
            exit 1
          fi

  # The suite outgrew a 15-minute backstop with W1: on PR #2's first run the runner had run 253 of the 268 test files, with no
  # failure, when the job timed out after 841 s of tests [measured 2026-11-09, PR #2]. The laptop runs all 268 in 427 s [measured
  # 2026-11-08 at 6418a20]. 30 minutes holds the whole suite until it is split across jobs (`bun test --shard`) or made faster.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The suite runs under Bun, pinned as in the fast gate.
      - name: Set up pinned Bun
        id: bun
        continue-on-error: true
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # A failed download from GitHub falls back to npm's copy of the same release (ARCHITECTURE §10.3).
      - name: Set up pinned Bun from npm, when GitHub's download failed
        if: steps.bun.outcome == 'failure'
        env:
          BUN_VERSION: 1.3.14
        run: npm install --global --no-audit --no-fund "bun@$BUN_VERSION" && test "$(bun --version)" = "$BUN_VERSION"

      - run: npm ci

      # bunfig.toml roots `bun test` at tests/, so Playwright's specs in e2e/ never run here.
      - run: bun run test

  # §10.1: Playwright's Chromium against `vite preview`, with axe on the pull-request routes, the keyboard walks of the front-page game
  # and of the games that W1 built, the network-isolation check, and the screenshots uploaded as artifacts. playwright.config.ts builds
  # the site and serves it, so the test step is also the build; its `smoke` project is the five specs of W0-T21 (e2e/a11y, keyboard-loop,
  # network, screenshots and reduced-motion) and W1-T36's keyboard walks (e2e/walks.spec.ts). The report, the traces, the actual and diff
  # of a screenshot that failed, and the 3D captures are kept as an artifact, whatever the result. A screenshot baseline is a Linux
  # rendering: when a runner draws the page a little differently, the artifact has the `-actual.png` to copy over the baseline in
  # e2e/screenshots.spec.ts-snapshots/.
  #
  # The smoke project runs in four shards, one test at a time across them (its fullyParallel): a private repository's runner has two
  # cores, and SwiftShader draws on the CPU, so the 78 specs in one job did not finish in 15 minutes [measured 2026-11-04 on PR #1:
  # 47 of 78 had run when the job timed out]. The cut is by count and the order is the files' names, so playwright.config.ts says where
  # each file sorts and why; W1-T36's 193 tests ran as four shards of 66, 61, 75 and 98 s on a 20-core laptop [measured 2026-11-08 at
  # df76ca9]. A runner took about 4 to 16 times as long per test as that laptop did [derived from the first CI run's log on 2026-11-04,
  # PR #1, against the laptop's times on 2026-11-08], which puts a shard at about 11 minutes of test time [estimated: no CI run has
  # timed W1-T36's tests], inside this job's backstop.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The browser is the revision that the locked @playwright/test pins, with the system libraries it needs.
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the smoke specs
        env:
          SHARD: ${{ matrix.shard }}
        run: npx playwright test --project=smoke --shard="$SHARD/4"

      - name: Keep the report, the screenshots and the traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-smoke-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
