# Claims for the schema tests. The sources are example.com pages (RFC 2606) and the facts are made up for the tests: none of
# this says anything about a real engine. Dates are bare YAML dates, so a loader must keep them as strings (CORE_SCHEMA).
- id: example.engine.async-default
  value: "on"
  text: The example engine turns async scheduling on by default.
  tag: measured
  source:
    url: https://example.com/engine/docs/scheduler
    title: Example engine scheduler docs
    quote: Async scheduling is enabled by default.
    accessed: 2026-11-03
  verifiedAt: 2026-11-03
  ttlDays: 90
  pin: example-engine

- id: example.engine.step-count
  value: 12
